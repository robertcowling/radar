<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>UK Radar — Live</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }
    body {
      font-family: 'Roboto', sans-serif;
      background: #eef2f7;
      color: #1f2937;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────────────────────────── */
    header {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 8px;
      padding: 9px 14px;
      background: linear-gradient(90deg, #0ea5e9 0%, #2563eb 100%);
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    }
    .title { font-size: 15px; font-weight: 700; white-space: nowrap; flex: 1; }
    .toggle { display: flex; background: rgba(255,255,255,0.18); border-radius: 20px; padding: 3px; flex-shrink: 0; gap: 1px; }
    .toggle button {
      background: none; border: none; color: rgba(255,255,255,0.85);
      font-family: inherit; font-size: 11px; font-weight: 500;
      padding: 4px 9px; border-radius: 16px; cursor: pointer;
      transition: background .18s, color .18s; white-space: nowrap;
    }
    .toggle button.active { background: #fff; color: #2563eb; }
    .toggle button:disabled { opacity: .4; cursor: default; }

    /* ── Image stage ─────────────────────────────────────────────────────────── */
    #stage {
      flex: 1; min-height: 0;
      position: relative;
      display: flex; align-items: center; justify-content: center;
      background: #dbe4ee; overflow: hidden;
    }
    #stage img {
      max-width: 100%; max-height: 100%;
      object-fit: contain; display: block;
    }
    #loading {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: #2563eb; font-weight: 500; background: #eef2f7;
    }
    #loading.done { display: none; }

    /* ── Dark controls panel ─────────────────────────────────────────────────── */
    #controls {
      flex-shrink: 0;
      background: #1a1f2e;
      padding: 12px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ctrl-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #play-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: #2563eb;
      border: none; color: #fff;
      font-size: 18px;
      cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    #play-btn:hover { background: #1d4ed8; }

    .step-btn {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: rgba(255,255,255,0.1);
      border: none; color: rgba(255,255,255,0.85);
      font-size: 15px;
      cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    .step-btn:hover { background: rgba(255,255,255,0.2); }

    #speed-select {
      background: rgba(255,255,255,0.1);
      border: none; color: rgba(255,255,255,0.85);
      font-family: inherit; font-size: 12px;
      padding: 6px 10px; border-radius: 8px;
      cursor: pointer; margin-left: auto;
    }
    #speed-select option { background: #1a1f2e; color: #fff; }

    /* ── Scrubber ─────────────────────────────────────────────────────────────── */
    #scrubber { display: flex; flex-direction: column; gap: 6px; }

    #progress-track {
      position: relative; height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px; cursor: pointer;
    }
    #progress-fill {
      height: 100%; background: #2563eb;
      border-radius: 2px; position: relative;
      transition: width .1s;
    }
    #scrubber-handle {
      position: absolute; right: -6px; top: -4px;
      width: 12px; height: 12px;
      border-radius: 50%; background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
      pointer-events: none;
    }

    .time-labels {
      display: flex; justify-content: space-between;
      font-size: 10px; color: rgba(255,255,255,0.45);
      font-weight: 500;
    }

    /* ── Big timestamp ───────────────────────────────────────────────────────── */
    #big-timestamp {
      font-size: 17px; font-weight: 700;
      color: #fff; text-align: center;
      letter-spacing: 0.01em;
    }

    footer {
      flex-shrink: 0;
      padding: 6px 14px; background: #1a1f2e;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 11px; text-align: center;
    }
    footer a { color: rgba(255,255,255,0.45); text-decoration: none; }
    footer a:hover { color: rgba(255,255,255,0.85); }
  </style>
</head>
<body>

<header>
  <span class="title">UK Radar</span>
  <div class="toggle">
    <button id="btn-combined" class="active" onclick="setLayer('combined')">Combined</button>
    <button id="btn-radar"                   onclick="setLayer('radar')">Radar</button>
    <button id="btn-sat"                     onclick="setLayer('sat')">Satellite</button>
    <button id="btn-mslp"                    onclick="setLayer('mslp')">MSLP</button>
  </div>
</header>

<div id="stage">
  <img id="frame-img" alt="Radar frame" />
  <div id="loading">Loading radar…</div>
</div>

<div id="controls">
  <div class="ctrl-row">
    <button id="play-btn" onclick="togglePlay()" title="Play/Pause">⏸</button>
    <button class="step-btn" onclick="stepFrame(-1)" title="Previous">⏮</button>
    <button class="step-btn" onclick="stepFrame(1)"  title="Next">⏭</button>
    <select id="speed-select" onchange="setSpeed(this.value)" title="Speed">
      <option value="2">Slow</option>
      <option value="5" selected>Normal</option>
      <option value="10">Fast</option>
    </select>
  </div>
  <div id="scrubber">
    <div id="progress-track" onclick="scrubClick(event)">
      <div id="progress-fill" style="width:0%">
        <div id="scrubber-handle"></div>
      </div>
    </div>
    <div class="time-labels">
      <span id="time-start">—</span>
      <span id="time-end">—</span>
    </div>
  </div>
  <div id="big-timestamp">—</div>
</div>

<footer>
  <a href="../index.html">Full radar map →</a>
</footer>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
const RADAR_MANIFEST = '../frames_parallel.json';
const MSLP_MANIFEST  = '../frames_mslp.json';
const REFRESH_MS     = 5 * 60 * 1000;
const HISTORY        = 24;
const DWELL_FRAMES   = 12;

// ── State ─────────────────────────────────────────────────────────────────────
let radarFrames  = [];   // [{time, radar, sat, combined}]
let mslpFrames   = [];   // [{time, mslp}]
let radarIdx     = 0;
let mslpIdx      = 0;
let currentLayer = 'combined';
let playing      = true;
let fps          = 5;
let tickTimer    = null;
let dwellCount   = 0;
const cache      = {};

const img = document.getElementById('frame-img');

function activeFrames() { return currentLayer === 'mslp' ? mslpFrames : radarFrames; }
function getIdx()       { return currentLayer === 'mslp' ? mslpIdx    : radarIdx;    }
function setIdx(i)      { if (currentLayer === 'mslp') mslpIdx = i; else radarIdx = i; }

function tsFromUrl(u) {
  const m = u && u.match(/\/(\d{12})_/);
  return m ? m[1] : null;
}

function buildRadarFrame(f) {
  const ts = tsFromUrl(f.url);
  if (!ts) return null;
  return {
    time:     f.time || '',
    radar:    'composites/dashboard_radar_'    + ts + '.webp',
    sat:      'composites/dashboard_sat_'      + ts + '.webp',
    combined: 'composites/dashboard_combined_' + ts + '.webp',
  };
}

function updateTimeLabels() {
  const frames = activeFrames();
  if (!frames.length) {
    document.getElementById('time-start').textContent = '—';
    document.getElementById('time-end').textContent   = '—';
    return;
  }
  document.getElementById('time-start').textContent = frames[0].time;
  document.getElementById('time-end').textContent   = frames[frames.length - 1].time;
}

// ── Initial radar load ────────────────────────────────────────────────────────
async function loadRadarManifest() {
  try {
    const res = await fetch(RADAR_MANIFEST + '?t=' + Date.now());
    const all = await res.json();
    const candidates = all.map(buildRadarFrame).filter(Boolean).slice(-HISTORY);

    const checked = await Promise.all(candidates.map(fr => new Promise(resolve => {
      const im = new Image();
      im.onload  = () => { cache[fr.combined] = im; resolve(fr); };
      im.onerror = () => resolve(null);
      im.src = fr.combined;
    })));
    radarFrames = checked.filter(Boolean);

    if (!radarFrames.length) {
      document.getElementById('loading').textContent = 'No radar frames available.';
      return;
    }
    document.getElementById('loading').classList.add('done');
    radarIdx = radarFrames.length - 1;
    preloadRadarLayers(radarFrames);
    updateTimeLabels();
    renderFrame(getIdx());
    scheduleBackgroundRefresh();
  } catch (e) {
    document.getElementById('loading').textContent = 'Failed to load: ' + e.message;
  }
}

// ── MSLP load ─────────────────────────────────────────────────────────────────
async function loadMslpManifest() {
  try {
    const res = await fetch(MSLP_MANIFEST + '?t=' + Date.now());
    const all = await res.json();
    if (!all.length) return;

    const checked = await Promise.all(all.map(fr => new Promise(resolve => {
      const im = new Image();
      im.onload  = () => { cache[fr.mslp] = im; resolve(fr); };
      im.onerror = () => resolve(null);
      im.src = fr.mslp;
    })));
    mslpFrames = checked.filter(Boolean);
    mslpIdx = Math.max(0, mslpFrames.length - 1);
    if (currentLayer === 'mslp') { updateTimeLabels(); renderFrame(getIdx()); }
  } catch (_) { /* silent — MSLP not yet generated */ }
}

// ── Silent background refresh ─────────────────────────────────────────────────
async function refreshRadarInBackground() {
  try {
    const res = await fetch(RADAR_MANIFEST + '?t=' + Date.now());
    const all = await res.json();
    const candidates = all.map(buildRadarFrame).filter(Boolean).slice(-HISTORY);

    const known  = new Set(radarFrames.map(f => f.combined));
    const novel  = candidates.filter(f => !known.has(f.combined));
    if (!novel.length) return;

    const checked = await Promise.all(novel.map(fr => new Promise(resolve => {
      const im = new Image();
      im.onload  = () => { cache[fr.combined] = im; resolve(fr); };
      im.onerror = () => resolve(null);
      im.src = fr.combined;
    })));
    const valid = checked.filter(Boolean);
    if (!valid.length) return;

    const merged = [...radarFrames, ...valid].slice(-HISTORY);
    const shift  = merged.length - radarFrames.length;
    radarFrames = merged;
    radarIdx    = Math.min(radarIdx + shift, radarFrames.length - 1);
    preloadRadarLayers(valid);
    if (currentLayer !== 'mslp') updateTimeLabels();
  } catch (_) {}
}

async function refreshMslpInBackground() {
  try {
    const res = await fetch(MSLP_MANIFEST + '?t=' + Date.now());
    const all = await res.json();
    if (!all.length) return;

    const known = new Set(mslpFrames.map(f => f.mslp));
    const novel = all.filter(f => !known.has(f.mslp));
    if (!novel.length) return;

    const checked = await Promise.all(novel.map(fr => new Promise(resolve => {
      const im = new Image();
      im.onload  = () => { cache[fr.mslp] = im; resolve(fr); };
      im.onerror = () => resolve(null);
      im.src = fr.mslp;
    })));
    const valid = checked.filter(Boolean);
    if (!valid.length) return;

    const merged = [...mslpFrames, ...valid].slice(-HISTORY);
    const shift  = merged.length - mslpFrames.length;
    mslpFrames = merged;
    mslpIdx    = Math.min(mslpIdx + shift, mslpFrames.length - 1);
    if (currentLayer === 'mslp') { updateTimeLabels(); }
  } catch (_) {}
}

function preloadRadarLayers(list) {
  for (const fr of list) {
    for (const key of ['radar', 'sat']) {
      if (!cache[fr[key]]) {
        const s = new Image();
        s.onload = () => { cache[fr[key]] = s; };
        s.src = fr[key];
        cache[fr[key]] = s;
      }
    }
  }
}

// ── Render one flat image ─────────────────────────────────────────────────────
function renderFrame(idx) {
  const frames = activeFrames();
  if (!frames.length) return;
  const fr = frames[idx];
  img.src = currentLayer === 'mslp' ? fr.mslp : fr[currentLayer];
  document.getElementById('big-timestamp').textContent = fr.time;
  const pct = frames.length > 1 ? idx / (frames.length - 1) * 100 : 100;
  document.getElementById('progress-fill').style.width = pct + '%';
}

// ── Animation ─────────────────────────────────────────────────────────────────
function tick() {
  const frames = activeFrames();
  if (!frames.length) return;
  let idx = getIdx();
  if (idx >= frames.length - 1) {
    if (++dwellCount < DWELL_FRAMES) return;
    dwellCount = 0; idx = 0;
  } else {
    idx++;
  }
  setIdx(idx);
  renderFrame(idx);
}
function startLoop() { clearInterval(tickTimer); tickTimer = setInterval(tick, 1000 / fps); }
function stopLoop()  { clearInterval(tickTimer); tickTimer = null; }
function togglePlay() {
  playing = !playing;
  document.getElementById('play-btn').textContent = playing ? '⏸' : '▶';
  playing ? startLoop() : stopLoop();
}
function stepFrame(d) {
  const frames = activeFrames();
  const idx = Math.max(0, Math.min(frames.length - 1, getIdx() + d));
  setIdx(idx); dwellCount = 0; renderFrame(idx);
}
function setSpeed(v) { fps = parseFloat(v); if (playing) startLoop(); }
function scrubClick(e) {
  const frames = activeFrames();
  const r = e.currentTarget.getBoundingClientRect();
  const frac = (e.clientX - r.left) / r.width;
  const idx = Math.max(0, Math.min(frames.length - 1, Math.round(frac * (frames.length - 1))));
  setIdx(idx); dwellCount = 0; renderFrame(idx);
}

// ── Layer toggle ──────────────────────────────────────────────────────────────
function setLayer(layer) {
  const wasMslp = currentLayer === 'mslp';
  currentLayer = layer;
  const isMslp = layer === 'mslp';

  // When switching between radar/mslp timeline, reset to latest frame
  if (wasMslp !== isMslp) {
    if (isMslp) {
      mslpIdx = Math.max(0, mslpFrames.length - 1);
    } else {
      radarIdx = Math.max(0, radarFrames.length - 1);
    }
    dwellCount = 0;
  }

  document.getElementById('btn-combined').classList.toggle('active', layer === 'combined');
  document.getElementById('btn-radar').classList.toggle('active',    layer === 'radar');
  document.getElementById('btn-sat').classList.toggle('active',      layer === 'sat');
  document.getElementById('btn-mslp').classList.toggle('active',     layer === 'mslp');

  updateTimeLabels();
  const frames = activeFrames();
  if (!frames.length && isMslp) {
    document.getElementById('big-timestamp').textContent = 'MSLP loading…';
    document.getElementById('progress-fill').style.width = '0%';
    return;
  }
  renderFrame(getIdx());
}

// ── Background polling ────────────────────────────────────────────────────────
function scheduleBackgroundRefresh() {
  setInterval(refreshRadarInBackground, REFRESH_MS);
  setInterval(refreshMslpInBackground,  REFRESH_MS);
}

// ── Boot ──────────────────────────────────────────────────────────────────────
loadRadarManifest();
loadMslpManifest();
startLoop();
</script>
</body>
</html>
