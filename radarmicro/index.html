<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>UK Radar — Live</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }
    body {
      font-family: 'Roboto', sans-serif;
      background: #eef2f7;
      color: #1f2937;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;          /* keeps controls on-screen on mobile */
      overflow: hidden;
    }

    /* ── Header (blue gradient — visible deploy marker) ──────────────── */
    header {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 8px;
      padding: 9px 14px;
      background: linear-gradient(90deg, #0ea5e9 0%, #2563eb 100%);
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    }
    .title { font-size: 15px; font-weight: 700; white-space: nowrap; }
    #timestamp { font-size: 12px; color: rgba(255,255,255,0.92); white-space: nowrap; flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .toggle { display: flex; background: rgba(255,255,255,0.18); border-radius: 20px; padding: 3px; flex-shrink: 0; }
    .toggle button {
      background: none; border: none; color: rgba(255,255,255,0.85);
      font-family: inherit; font-size: 12px; font-weight: 500;
      padding: 4px 11px; border-radius: 16px; cursor: pointer;
      transition: background .18s, color .18s;
    }
    .toggle button.active { background: #fff; color: #2563eb; }
    .toggle button:disabled { opacity: .4; cursor: default; }

    /* ── Image stage (one flat composite per frame, GIF-style) ───────── */
    #stage {
      flex: 1; min-height: 0;
      display: flex; align-items: center; justify-content: center;
      background: #dbe4ee; overflow: hidden;
    }
    #stage img {
      max-width: 100%; max-height: 100%;
      object-fit: contain; display: block;
    }
    #loading {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: #2563eb; font-weight: 500; background: #eef2f7;
    }
    #loading.done { display: none; }

    /* ── Controls (always pinned, never off-screen) ─────────────────── */
    #controls {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 9px;
      padding: 8px 14px; background: #fff; border-top: 1px solid #e2e8f0;
    }
    .ctrl-btn {
      background: #f1f5f9; border: none; color: #1f2937;
      font-family: inherit; font-size: 17px; width: 34px; height: 34px;
      border-radius: 8px; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    .ctrl-btn:hover { background: #e2e8f0; }
    #scrubber { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    #progress-track { position: relative; height: 6px; background: #e2e8f0; border-radius: 3px; cursor: pointer; }
    #progress-fill { height: 100%; background: #2563eb; border-radius: 3px; transition: width .1s; }
    #frame-label { font-size: 11px; color: #64748b; text-align: right; }
    #speed-select {
      background: #f1f5f9; border: none; color: #1f2937;
      font-family: inherit; font-size: 12px; padding: 5px 8px; border-radius: 8px;
      cursor: pointer; flex-shrink: 0;
    }

    footer {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 14px; background: #f8fafc; border-top: 1px solid #e2e8f0;
      font-size: 11px; color: #64748b; gap: 10px;
    }
    footer a { color: #2563eb; text-decoration: none; font-weight: 500; }
    footer a:hover { text-decoration: underline; }
    #next-refresh { white-space: nowrap; }
  </style>
</head>
<body>

<header>
  <span class="title">UK Radar</span>
  <span id="timestamp">Loading…</span>
  <div class="toggle">
    <button id="btn-combined" class="active" onclick="setLayer('combined')">Combined</button>
    <button id="btn-radar"                   onclick="setLayer('radar')">Radar</button>
    <button id="btn-sat"                     onclick="setLayer('sat')">Satellite</button>
  </div>
</header>

<div id="stage">
  <img id="frame-img" alt="Radar frame" />
  <div id="loading">Loading radar…</div>
</div>

<div id="controls">
  <button class="ctrl-btn" id="play-btn" onclick="togglePlay()" title="Play/Pause">⏸</button>
  <button class="ctrl-btn" onclick="stepFrame(-1)" title="Previous">⏮</button>
  <button class="ctrl-btn" onclick="stepFrame(1)"  title="Next">⏭</button>
  <div id="scrubber">
    <div id="progress-track" onclick="scrubClick(event)">
      <div id="progress-fill" style="width:0%"></div>
    </div>
    <div id="frame-label">—</div>
  </div>
  <select id="speed-select" onchange="setSpeed(this.value)" title="Speed">
    <option value="2">Slow</option>
    <option value="5" selected>Normal</option>
    <option value="10">Fast</option>
  </select>
</div>

<footer>
  <a href="../index.html">Full radar map →</a>
  <span id="next-refresh"></span>
</footer>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
const MANIFEST     = '../frames_parallel.json';
const REFRESH_MS   = 5 * 60 * 1000;
const HISTORY      = 24;
const DWELL_FRAMES = 12;

// ── State ─────────────────────────────────────────────────────────────────────
let frames        = [];          // [{ time, radar, sat, combined }]
let currentIdx    = 0;
let currentLayer  = 'combined';
let playing       = true;
let fps           = 5;
let tickTimer     = null;
let dwellCount    = 0;
let refreshTimer  = null;
let nextRefreshAt = null;
const cache       = {};          // src -> preloaded Image

const img = document.getElementById('frame-img');

function tsFromUrl(u) {
  const m = u && u.match(/\/(\d{12})_/);
  return m ? m[1] : null;
}

// ── Load manifest → build flat composite frame list ───────────────────────────
async function loadManifest() {
  try {
    const res = await fetch(MANIFEST + '?t=' + Date.now());
    const all = await res.json();
    const built = [];
    for (const f of all) {
      const ts = tsFromUrl(f.url);
      if (!ts) continue;
      built.push({
        time:     f.time || '',
        radar:    'composites/dashboard_radar_'    + ts + '.webp',
        sat:      'composites/dashboard_sat_'      + ts + '.webp',
        combined: 'composites/dashboard_combined_' + ts + '.webp',
      });
    }
    const candidates = built.slice(-HISTORY);

    // Keep only frames whose combined composite actually loads — never show a
    // broken image if the manifest is briefly ahead of the committed frames.
    const checked = await Promise.all(candidates.map(fr => new Promise(resolve => {
      const im = new Image();
      im.onload  = () => { cache[fr.combined] = im; resolve(fr); };
      im.onerror = () => resolve(null);
      im.src = fr.combined;
    })));
    frames = checked.filter(Boolean);

    if (!frames.length) {
      document.getElementById('loading').textContent = 'No radar frames available.';
      return;
    }
    document.getElementById('loading').classList.add('done');
    currentIdx = frames.length - 1;
    preloadLayers();
    renderFrame(currentIdx);
    scheduleRefresh();
  } catch (e) {
    document.getElementById('loading').textContent = 'Failed to load: ' + e.message;
  }
}

function preloadLayers() {
  for (const fr of frames) {
    for (const key of ['radar', 'sat']) {
      if (!cache[fr[key]]) {
        const s = new Image();
        s.onload = () => { cache[fr[key]] = s; };
        s.src = fr[key];
        cache[fr[key]] = s;
      }
    }
  }
}

// ── Render one flat image (GIF-style swap) ────────────────────────────────────
function renderFrame(idx) {
  if (!frames.length) return;
  const fr = frames[idx];
  img.src = fr[currentLayer];
  document.getElementById('timestamp').textContent = fr.time;
  const pct = frames.length > 1 ? idx / (frames.length - 1) * 100 : 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('frame-label').textContent = `Frame ${idx + 1} / ${frames.length}`;
}

// ── Animation ─────────────────────────────────────────────────────────────────
function tick() {
  if (!frames.length) return;
  if (currentIdx >= frames.length - 1) {
    if (++dwellCount < DWELL_FRAMES) return;
    dwellCount = 0; currentIdx = 0;
  } else {
    currentIdx++;
  }
  renderFrame(currentIdx);
}
function startLoop() { clearInterval(tickTimer); tickTimer = setInterval(tick, 1000 / fps); }
function stopLoop()  { clearInterval(tickTimer); tickTimer = null; }
function togglePlay() {
  playing = !playing;
  document.getElementById('play-btn').textContent = playing ? '⏸' : '▶';
  playing ? startLoop() : stopLoop();
}
function stepFrame(d) {
  currentIdx = Math.max(0, Math.min(frames.length - 1, currentIdx + d));
  dwellCount = 0; renderFrame(currentIdx);
}
function setSpeed(v) { fps = parseFloat(v); if (playing) startLoop(); }
function scrubClick(e) {
  const r = e.currentTarget.getBoundingClientRect();
  const frac = (e.clientX - r.left) / r.width;
  currentIdx = Math.max(0, Math.min(frames.length - 1, Math.round(frac * (frames.length - 1))));
  dwellCount = 0; renderFrame(currentIdx);
}

// ── Layer toggle ──────────────────────────────────────────────────────────────
function setLayer(layer) {
  currentLayer = layer;
  document.getElementById('btn-combined').classList.toggle('active', layer === 'combined');
  document.getElementById('btn-radar').classList.toggle('active',    layer === 'radar');
  document.getElementById('btn-sat').classList.toggle('active',      layer === 'sat');
  renderFrame(currentIdx);
}

// ── Auto-refresh ──────────────────────────────────────────────────────────────
function scheduleRefresh() {
  clearTimeout(refreshTimer);
  nextRefreshAt = Date.now() + REFRESH_MS;
  refreshTimer = setTimeout(loadManifest, REFRESH_MS);
  updateCountdown();
  setInterval(updateCountdown, 15000);
}
function updateCountdown() {
  if (!nextRefreshAt) return;
  const s = Math.max(0, Math.round((nextRefreshAt - Date.now()) / 1000));
  document.getElementById('next-refresh').textContent =
    `Refreshes in ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}

// ── Boot ──────────────────────────────────────────────────────────────────────
loadManifest();
startLoop();
</script>
</body>
</html>
