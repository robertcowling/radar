<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UK Radar — Quick View</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', sans-serif;
      background: #111827;
      color: #e8eaed;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: rgba(0,0,0,0.5);
      flex-shrink: 0;
      min-height: 44px;
    }

    .title { font-size: 14px; font-weight: 500; white-space: nowrap; }

    #timestamp {
      font-size: 12px;
      color: #9aa0a6;
      white-space: nowrap;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toggle {
      display: flex;
      background: rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 3px;
      flex-shrink: 0;
    }
    .toggle button {
      background: none; border: none;
      color: #9aa0a6;
      font-family: inherit; font-size: 12px; font-weight: 500;
      padding: 4px 12px; border-radius: 16px;
      cursor: pointer;
      transition: background 0.18s, color 0.18s;
    }
    .toggle button.active { background: #1a73e8; color: #fff; }

    #outlines-btn {
      background: rgba(255,255,255,0.08);
      border: none; color: #9aa0a6;
      font-family: inherit; font-size: 12px;
      padding: 5px 11px; border-radius: 16px;
      cursor: pointer; flex-shrink: 0;
      transition: background 0.18s, color 0.18s;
    }
    #outlines-btn.active { background: rgba(255,255,255,0.2); color: #e8eaed; }

    #image-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
      min-height: 0;
      overflow: hidden;
    }

    #ratio-box {
      position: relative;
      aspect-ratio: 900 / 506;
      max-width: 100%;
      max-height: 100%;
      background: #0b0f1a;
    }

    #ratio-box img, #outline-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #img-sat { opacity: 0; }
    #img-sat.visible { opacity: 1; }
    #img-radar.hidden { opacity: 0; }

    #outline-svg { pointer-events: none; transition: opacity 0.3s; }
    #outline-svg.hidden { opacity: 0; }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #9aa0a6;
      background: #0b0f1a;
    }
    #loading.done { display: none; }

    #controls {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 14px;
      background: rgba(0,0,0,0.4);
      flex-shrink: 0;
    }

    .ctrl-btn {
      background: rgba(255,255,255,0.08);
      border: none; color: #e8eaed;
      font-family: inherit; font-size: 18px;
      width: 32px; height: 32px;
      border-radius: 6px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,0.14); }

    #scrubber { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }

    #progress-track {
      position: relative;
      height: 4px;
      background: rgba(255,255,255,0.12);
      border-radius: 2px;
      cursor: pointer;
    }
    #progress-fill {
      height: 100%;
      background: #1a73e8;
      border-radius: 2px;
      transition: width 0.1s;
    }
    #progress-track:hover #progress-fill { background: #4e9cf8; }

    #frame-label { font-size: 11px; color: #70757a; text-align: right; }

    #speed-select {
      background: rgba(255,255,255,0.08);
      border: none; color: #9aa0a6;
      font-family: inherit; font-size: 12px;
      padding: 4px 8px; border-radius: 6px;
      cursor: pointer; flex-shrink: 0;
    }
    #speed-select option { background: #1f2937; }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 14px;
      background: rgba(0,0,0,0.35);
      flex-shrink: 0;
      font-size: 11px;
      color: #70757a;
      gap: 10px;
    }
    footer a { color: #8ab4f8; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    #next-refresh { white-space: nowrap; }
  </style>
</head>
<body>

<header>
  <span class="title">UK Radar</span>
  <span id="timestamp">Loading…</span>
  <div class="toggle">
    <button id="btn-radar" class="active" onclick="setLayer('radar')">Radar</button>
    <button id="btn-sat"              onclick="setLayer('sat')">Satellite</button>
  </div>
  <button id="outlines-btn" class="active" onclick="toggleOutlines()">Outlines</button>
</header>

<div id="image-wrap">
  <div id="ratio-box">
    <img id="img-radar" alt="Radar" />
    <img id="img-sat"   alt="Satellite" />
    <svg id="outline-svg" viewBox="0 0 900 506" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <!-- paths injected by JS -->
    </svg>
    <div id="loading">Loading radar…</div>
  </div>
</div>

<div id="controls">
  <button class="ctrl-btn" id="play-btn" onclick="togglePlay()" title="Play/Pause">⏸</button>
  <button class="ctrl-btn" onclick="stepFrame(-1)" title="Previous">⏮</button>
  <button class="ctrl-btn" onclick="stepFrame(1)"  title="Next">⏭</button>
  <div id="scrubber">
    <div id="progress-track" onclick="scrubClick(event)">
      <div id="progress-fill" style="width:0%"></div>
    </div>
    <div id="frame-label">—</div>
  </div>
  <select id="speed-select" onchange="setSpeed(this.value)" title="Speed">
    <option value="2">Slow</option>
    <option value="5" selected>Normal</option>
    <option value="10">Fast</option>
  </select>
</div>

<footer>
  <a href="../index.html">Full radar map</a>
  <span id="next-refresh"></span>
</footer>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const MANIFEST     = '../frames_parallel.json';
const REFRESH_MS   = 5 * 60 * 1000;
const HISTORY      = 24;
const DWELL_FRAMES = 12;

// ── Projection (Web Mercator → 900×506 pixel space) ───────────────────────────
// Display window: lon -33..+5, lat 49.5..61.5
const R = 6378137;
function llToMerc(lon, lat) {
  return [
    R * lon * Math.PI / 180,
    R * Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360))
  ];
}
const [mxMin] = llToMerc(-33.0, 0);
const [mxMax] = llToMerc(5.0,   0);
const [, myMin] = llToMerc(0, 49.5);
const [, myMax] = llToMerc(0, 61.5);

function project(lon, lat) {
  const [mx, my] = llToMerc(lon, lat);
  return [
    (mx - mxMin) / (mxMax - mxMin) * 900,
    (myMax - my) / (myMax - myMin) * 506
  ];
}

// ── State ─────────────────────────────────────────────────────────────────────
let radarFrames   = [];
let currentIdx    = 0;
let currentLayer  = 'radar';
let playing       = true;
let fps           = 5;
let tickTimer     = null;
let dwellCount    = 0;
let outlinesOn    = true;
let refreshTimer  = null;
let nextRefreshAt = null;

const radarImg = document.getElementById('img-radar');
const satImg   = document.getElementById('img-sat');

// ── Load manifest ─────────────────────────────────────────────────────────────
async function loadManifest() {
  const res  = await fetch(MANIFEST + '?t=' + Date.now());
  const all  = await res.json();
  radarFrames = all.filter(f => f.dashboard_radar_url).slice(-HISTORY);
  if (!radarFrames.length) {
    document.getElementById('loading').textContent = 'No radar frames available.';
    return;
  }
  document.getElementById('loading').classList.add('done');
  currentIdx = radarFrames.length - 1;
  preloadImages();
  renderFrame(currentIdx);
  scheduleRefresh();
}

function preloadImages() {
  for (const fr of radarFrames) {
    new Image().src = fr.dashboard_radar_url;
    if (fr.dashboard_sat_url) new Image().src = fr.dashboard_sat_url;
  }
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderFrame(idx) {
  if (!radarFrames.length) return;
  const fr = radarFrames[idx];
  radarImg.src = fr.dashboard_radar_url;
  if (fr.dashboard_sat_url) satImg.src = fr.dashboard_sat_url;
  document.getElementById('btn-sat').disabled = !fr.dashboard_sat_url;
  document.getElementById('timestamp').textContent = fr.time || '';
  const pct = radarFrames.length > 1 ? idx / (radarFrames.length - 1) * 100 : 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('frame-label').textContent = `Frame ${idx + 1} / ${radarFrames.length}`;
}

// ── Animation ─────────────────────────────────────────────────────────────────
function tick() {
  if (!radarFrames.length) return;
  if (currentIdx >= radarFrames.length - 1) {
    if (++dwellCount < DWELL_FRAMES) return;
    dwellCount = 0; currentIdx = 0;
  } else {
    currentIdx++;
  }
  renderFrame(currentIdx);
}

function startLoop() { clearInterval(tickTimer); tickTimer = setInterval(tick, 1000 / fps); }
function stopLoop()  { clearInterval(tickTimer); tickTimer = null; }

function togglePlay() {
  playing = !playing;
  document.getElementById('play-btn').textContent = playing ? '⏸' : '▶';
  playing ? startLoop() : stopLoop();
}

function stepFrame(delta) {
  currentIdx = Math.max(0, Math.min(radarFrames.length - 1, currentIdx + delta));
  dwellCount = 0;
  renderFrame(currentIdx);
}

function setSpeed(v) { fps = parseFloat(v); if (playing) startLoop(); }

function scrubClick(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  const frac = (e.clientX - rect.left) / rect.width;
  currentIdx = Math.max(0, Math.min(radarFrames.length - 1, Math.round(frac * (radarFrames.length - 1))));
  dwellCount = 0;
  renderFrame(currentIdx);
}

// ── Layer toggle ──────────────────────────────────────────────────────────────
function setLayer(layer) {
  currentLayer = layer;
  radarImg.classList.toggle('hidden', layer !== 'radar');
  satImg.classList.toggle('visible', layer === 'sat');
  document.getElementById('btn-radar').classList.toggle('active', layer === 'radar');
  document.getElementById('btn-sat').classList.toggle('active',   layer === 'sat');
}

// ── Outlines ──────────────────────────────────────────────────────────────────
function toggleOutlines() {
  outlinesOn = !outlinesOn;
  document.getElementById('outline-svg').classList.toggle('hidden', !outlinesOn);
  document.getElementById('outlines-btn').classList.toggle('active', outlinesOn);
}

async function loadOutlines() {
  try {
    const res = await fetch('../uk-counties.geojson');
    const gj  = await res.json();
    const svg  = document.getElementById('outline-svg');
    for (const feat of gj.features) {
      const geom = feat.geometry;
      if (!geom) continue;
      const polys = geom.type === 'Polygon'      ? [geom.coordinates] :
                    geom.type === 'MultiPolygon' ? geom.coordinates   : [];
      for (const poly of polys) {
        for (const ring of poly) {
          let d = '';
          for (let i = 0; i < ring.length; i++) {
            const [px, py] = project(ring[i][0], ring[i][1]);
            if (px < -20 || px > 920 || py < -20 || py > 526) { continue; }
            d += (d ? 'L' : 'M') + px.toFixed(1) + ',' + py.toFixed(1);
          }
          if (d.length > 4) {
            const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            p.setAttribute('d', d + ' Z');
            p.setAttribute('fill', 'none');
            p.setAttribute('stroke', 'rgba(255,255,255,0.55)');
            p.setAttribute('stroke-width', '0.6');
            svg.appendChild(p);
          }
        }
      }
    }
  } catch(e) {}
}

// ── Auto-refresh ──────────────────────────────────────────────────────────────
function scheduleRefresh() {
  clearTimeout(refreshTimer);
  nextRefreshAt = Date.now() + REFRESH_MS;
  refreshTimer = setTimeout(loadManifest, REFRESH_MS);
  updateCountdown();
  setInterval(updateCountdown, 15000);
}

function updateCountdown() {
  if (!nextRefreshAt) return;
  const s  = Math.max(0, Math.round((nextRefreshAt - Date.now()) / 1000));
  document.getElementById('next-refresh').textContent =
    `Refreshes in ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}

// ── Boot ──────────────────────────────────────────────────────────────────────
loadManifest();
loadOutlines();
startLoop();
</script>
</body>
</html>
