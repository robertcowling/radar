name: Update Soil Data

on:
  workflow_dispatch:

jobs:
  update-soil:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Fetch new data
        run: python make_soil.py
      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cosmos/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update soil data"
          git push origin
