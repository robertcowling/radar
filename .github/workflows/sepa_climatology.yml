name: Build SEPA Climatology

# One-time (re-runnable, resumable) build of multi-decade climatology for SEPA
# gauges from SEPA's KiWIS time-series service (keyless, OGL) — the www2
# rainfall API used by fetch_rain.py only exposes a rolling ~3-4 day window.
# Writes into the same rain/climatology/ prefix and shared index as the EA job.

on:
  workflow_dispatch:
    inputs:
      limit_stations:
        description: 'Process only N series (0 = all, for smoke tests)'
        required: false
        default: '0'
      force:
        description: 'Set to 1 to recompute series already in the index'
        required: false
        default: '0'

permissions:
  contents: read

jobs:
  climatology:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build SEPA climatology
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        LIMIT_STATIONS: ${{ github.event.inputs.limit_stations }}
        FORCE: ${{ github.event.inputs.force }}
      run: python -u build_sepa_climatology.py
