name: Purge Satellite Image Cache

on:
  workflow_dispatch:

permissions: {}

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
    - name: Install boto3
      run: pip install boto3

    - name: Delete all sat_gh objects from R2
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      run: |
        python - <<'EOF'
        import boto3, os

        r2 = boto3.client(
            's3',
            endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",
            aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
            aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],
            region_name='auto',
        )
        bucket = os.environ['R2_BUCKET_NAME']

        paginator = r2.get_paginator('list_objects_v2')
        keys = []
        for page in paginator.paginate(Bucket=bucket, Prefix='sat_gh/'):
            for obj in page.get('Contents', []):
                keys.append({'Key': obj['Key']})

        if not keys:
            print("No sat_gh objects found.")
        else:
            # Delete in batches of 1000 (S3 API limit)
            failed = []
            for i in range(0, len(keys), 1000):
                batch = keys[i:i+1000]
                resp = r2.delete_objects(Bucket=bucket, Delete={'Objects': batch})
                errors = resp.get('Errors', [])
                if errors:
                    for e in errors:
                        print(f"  Delete failed: {e['Key']} — {e['Code']}: {e['Message']}")
                        failed.append({'Key': e['Key']})
                deleted_count = len(batch) - len(errors)
                print(f"Deleted {deleted_count} objects (batch {i//1000 + 1})")

            # Retry any failures once
            if failed:
                print(f"Retrying {len(failed)} failed deletions...")
                resp = r2.delete_objects(Bucket=bucket, Delete={'Objects': failed})
                retry_errors = resp.get('Errors', [])
                if retry_errors:
                    print(f"  {len(retry_errors)} objects still failed after retry:")
                    for e in retry_errors:
                        print(f"    {e['Key']} — {e['Code']}: {e['Message']}")
                else:
                    print(f"  All retries succeeded.")

            # Verify nothing remains
            remaining = sum(
                len(page.get('Contents', []))
                for page in r2.get_paginator('list_objects_v2').paginate(Bucket=bucket, Prefix='sat_gh/')
            )
            if remaining:
                print(f"WARNING: {remaining} objects still remain in sat_gh/ after purge!")
            else:
                print("Verified: sat_gh/ is empty.")

            print(f"Total submitted for deletion: {len(keys)}")
        EOF
