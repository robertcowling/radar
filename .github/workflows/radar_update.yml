name: Process Radar Images

on:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Process latest radar data
      run: python process_latest.py

    - name: Delete files older than 7 days and legacy colour images
      run: |
        cutoff=$(date -u -d '7 days ago' +'%Y%m%d%H%M')
        # Remove legacy natural-colour sat files (no longer generated)
        find static/sat -name '*_sat_color.jpg' -delete 2>/dev/null || true
        # Remove radar + sat files whose filename timestamp is >7 days old
        for f in static/radar/*.png static/sat/*.jpg static/sat/*.png; do
          [ -f "$f" ] || continue
          ts=$(basename "$f" | grep -oP '^\d{12}')
          [ -n "$ts" ] && [ "$ts" \< "$cutoff" ] && rm "$f"
        done

    - name: Commit and push changes
      run: |
        git config --global user.name "Radar Automator"
        git config --global user.email "radar-bot@github.com"
        git add static/radar static/sat frames.json
        git diff --cached --quiet && echo "No changes to commit" || (
          git commit -m "Update radar frames $(date -u +'%Y-%m-%d %H:%M UTC')" &&
          git pull --rebase origin main &&
          git push origin main
        )
