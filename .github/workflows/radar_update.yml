name: Process Satellite Images

on:
  # schedule:
  #   - cron: '*/15 * * * *'  # Every 15 minutes — replaced by Google Apps Script trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with:
        fetch-depth: 0

    - name: Restore image cache
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
      with:
        path: static/sat_gh
        key: sat-images-v1-${{ github.run_id }}
        restore-keys: sat-images-v1-

    - name: Set up Python
      uses: actions/setup-python@f677139bbe7f9c59b41e7f4e61d04dfe60991c87  # v4.7.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download satellite images
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      run: python process_latest.py

    - name: Delete files older than 14 days
      run: |
        cutoff=$(date -u -d '14 days ago' +'%Y%m%d%H%M')
        for f in static/sat_gh/*.jpg static/sat_gh/*.png; do
          [ -f "$f" ] || continue
          base=$(basename "$f")
          ts="${base:0:12}"
          [[ "$ts" =~ ^[0-9]{12}$ ]] && [[ "$ts" < "$cutoff" ]] && rm "$f"
        done
        exit 0

    - name: Save image cache
      uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
      with:
        path: static/sat_gh
        key: sat-images-v1-${{ github.run_id }}

    - name: Commit and push changes
      run: |
        git config --global user.name "Radar Automator"
        git config --global user.email "radar-bot@github.com"
        git add status.json
        git diff --cached --quiet && echo "No changes to commit" || {
          git commit -m "Update sat status $(date -u +'%Y-%m-%d %H:%M UTC')" || exit 1
          n=0
          until git pull --rebase -X theirs origin main && git push origin main; do
            n=$((n+1)); [ $n -ge 3 ] && exit 1
            echo "Push attempt $n/3 failed, retrying in $((n*5))s..."
            sleep $((n*5))
          done
        }
