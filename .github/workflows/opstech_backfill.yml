name: Opstech archive backfill (one-shot)

# One-time job: renders every 22-23 June 2026 radar frame from the Met
# Office public bucket into the permanent opstech/ R2 prefix and commits
# opstech/frames.json for the /opstech archive page. Delete this workflow
# (and opstech_backfill.py) once it has run successfully.

on:
  workflow_dispatch:
  push:
    branches: [claude/radar-page-june-22-23-q1rm1q]
    paths:
      - 'opstech_backfill.py'
      - '.github/workflows/opstech_backfill.yml'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Backfill 22-23 June frames to R2
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      run: python opstech_backfill.py

    - name: Commit manifest
      run: |
        git config --global user.name "Radar Automator"
        git config --global user.email "radar-bot@github.com"
        git add opstech/frames.json
        git diff --cached --quiet && echo "No changes to commit" || {
          git commit -m "Add opstech archive manifest (22-23 June 2026)"
          git push origin "HEAD:${{ github.ref_name }}"
        }
