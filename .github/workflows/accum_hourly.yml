name: Hourly Accumulation Composites

on:
  schedule:
    - cron: '12 * * * *'   # run ~12 min past each hour (after frames arrive)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  accum_hourly:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Restore basemap cache
      uses: actions/cache/restore@v4
      with:
        path: |
          static/dashboard_basemap_uk_z8.png
          static/dashboard_basemap_uk_z8.meta
          europe_geo.json
          uk_regions_r2.geojson
        key: accum-hourly-basemap-v1-${{ github.run_id }}
        restore-keys: accum-hourly-basemap-v1-

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate hourly accumulation composites
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      run: python make_accum_hourly.py

    - name: Save basemap cache
      uses: actions/cache/save@v4
      with:
        path: |
          static/dashboard_basemap_uk_z8.png
          static/dashboard_basemap_uk_z8.meta
          europe_geo.json
          uk_regions_r2.geojson
        key: accum-hourly-basemap-v1-${{ github.run_id }}

    - name: Commit and push manifest
      run: |
        git config --global user.name "Radar Automator"
        git config --global user.email "radar-bot@github.com"
        git add frames_accum_hourly.json
        git diff --cached --quiet && echo "No changes to commit" || {
          git commit -m "Update accum_hourly frames $(date -u +'%Y-%m-%d %H:%M UTC')" || exit 1
          n=0
          until git pull --no-rebase -X ours origin main && git push origin HEAD:main; do
            n=$((n+1)); [ $n -ge 3 ] && exit 1
            git merge --abort 2>/dev/null || true
            echo "Push attempt $n/3 failed, retrying in $((n*5))s..."
            sleep $((n*5))
          done
        }

    - name: Report Job Status
      if: always()
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        JOB_NAME: "Hourly Accumulation Composites"
        JOB_STATUS: ${{ job.status }}
      run: python report_job_status.py
