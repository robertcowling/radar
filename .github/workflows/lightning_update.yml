name: Fetch Lightning Data

on:
  workflow_dispatch:

# No git writes — data goes straight to R2
permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install boto3

    - name: Check OW account limits
      env:
        OW_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      run: |
        echo "=== OW Lightning API response headers ==="
        curl -si "https://demo.openweathermap.org/lightning/1.0/data?lat=51.5&lon=-1.0&radius=50&start_date=2026-06-28T18:00:00Z&end_date=2026-06-28T19:00:00Z&apikey=$OW_API_KEY" \
          | head -40
        echo "=== OW account/subscription info ==="
        curl -s "https://api.openweathermap.org/data/2.5/weather?q=London&appid=$OW_API_KEY" \
          | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d, indent=2))" 2>/dev/null | head -10 || true

    - name: Fetch lightning data
      env:
        OW_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      run: python fetch_lightning.py

    - name: Report Job Status
      if: always()
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        JOB_NAME: "Lightning"
        JOB_STATUS: ${{ job.status }}
      run: python report_job_status.py
