name: Classify flood areas (LLM)

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source to classify (EA, NRW, or both)"
        required: false
        default: "both"
      model:
        description: "OpenAI model"
        required: false
        default: "gpt-4o"
      dry_run:
        description: "Dry run only (no R2 uploads)"
        type: boolean
        default: false

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install boto3 openai

      - name: Run LLM classifier
        env:
          R2_ACCOUNT_ID:       ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:    ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY:${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:      ${{ secrets.R2_BUCKET_NAME }}
          OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL:        ${{ github.event.inputs.model }}
        run: |
          ARGS=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          SRC="${{ github.event.inputs.source }}"
          [ "$SRC" != "both" ] && [ -n "$SRC" ] && ARGS="$ARGS --source $SRC"
          python classify_flood_areas_llm.py $ARGS
