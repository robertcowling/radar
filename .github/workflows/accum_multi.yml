name: Generate Multi-period Accumulation

on:
  schedule:
    - cron: '10 * * * *'  # 10 past every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  accumulate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate accumulation images
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      run: python make_accum_multi.py

    - name: Commit metadata
      run: |
        git config --global user.name "Radar Automator"
        git config --global user.email "radar-bot@github.com"
        git add accum_multi_meta.json
        git diff --cached --quiet && echo "No changes to commit" || (
          git commit -m "Update accumulation meta $(date -u +'%Y-%m-%d %H:%M UTC')" &&
          git pull --rebase -X theirs origin main &&
          git push origin main
        )
