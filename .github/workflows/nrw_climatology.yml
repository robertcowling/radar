name: Build NRW Climatology

on:
  schedule:
    - cron: "0 * * * *"  # hourly at :00
  workflow_dispatch:
    inputs:
      limit_stations:
        description: Limit to N stations (smoke test)
        required: false
      force_rerun:
        description: Reprocess all stations (bypass index)
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install boto3 requests

      - name: Build NRW climatology
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          CEDA_TOKEN: ${{ secrets.CEDA_TOKEN }}
          LIMIT_STATIONS: ${{ github.event.inputs.limit_stations }}
          FORCE: ${{ github.event.inputs.force_rerun && '1' || '0' }}
        run: |
          python3 build_nrw_climatology.py
