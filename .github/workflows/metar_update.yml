name: Fetch METAR/TAF Observations (Ogimet)

on:
  # Triggered hourly by Google Apps Script (same mechanism as
  # synop_update.yml / surface_obs_update.yml) — add this workflow's file
  # name (metar_update.yml) to the Apps Script's dispatch list. METAR is
  # half-hourly at most UK aerodromes, so hourly is a reasonable cadence.
  workflow_dispatch:

# No git writes — output goes straight to R2 (latest snapshot + hourly archive),
# same pattern as synop_update.yml / surface_obs_update.yml.
permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Fetch and decode METAR/TAF observations
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      run: python metar/fetch_metar_taf.py

    - name: Report Job Status
      if: always()
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        JOB_NAME: "METAR/TAF Observations"
        JOB_STATUS: ${{ job.status }}
      run: python report_job_status.py
