name: Purge Last 6 Hours (Radar + Sat + MSLP)

on:
  workflow_dispatch:

permissions: {}

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
    - name: Install boto3
      run: pip install boto3

    - name: Delete last 6 hours from R2
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      run: |
        python - <<'EOF'
        import boto3, os
        from datetime import datetime, timedelta

        r2 = boto3.client(
            's3',
            endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",
            aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
            aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],
            region_name='auto',
        )
        bucket = os.environ['R2_BUCKET_NAME']
        cutoff = (datetime.utcnow() - timedelta(hours=6)).strftime('%Y%m%d%H%M')
        print(f"Deleting objects with timestamp >= {cutoff} (last 6 hours)")

        prefixes = ('radar_gh/', 'sat_gh/', 'mslp/')
        to_delete = []

        paginator = r2.get_paginator('list_objects_v2')
        for prefix in prefixes:
            for page in paginator.paginate(Bucket=bucket, Prefix=prefix):
                for obj in page.get('Contents', []):
                    key = obj['Key']
                    basename = key.split('/')[-1]
                    ts = basename[:12]
                    if ts.isdigit() and ts >= cutoff:
                        to_delete.append({'Key': key})

        if not to_delete:
            print("Nothing found in the last 6 hours.")
        else:
            print(f"Found {len(to_delete)} objects to delete.")
            failed = []
            for i in range(0, len(to_delete), 1000):
                batch = to_delete[i:i+1000]
                resp = r2.delete_objects(Bucket=bucket, Delete={'Objects': batch})
                for e in resp.get('Errors', []):
                    print(f"  Delete failed: {e['Key']} — {e['Code']}: {e['Message']}")
                    failed.append({'Key': e['Key']})
                print(f"  Deleted {len(batch) - len(resp.get('Errors', []))} objects (batch {i//1000 + 1})")

            if failed:
                print(f"Retrying {len(failed)} failures...")
                resp = r2.delete_objects(Bucket=bucket, Delete={'Objects': failed})
                for e in resp.get('Errors', []):
                    print(f"  Still failed: {e['Key']} — {e['Message']}")

            print(f"Done. {len(to_delete)} objects submitted for deletion.")
        EOF
