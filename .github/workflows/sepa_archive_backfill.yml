name: Backfill SEPA Rain Gauge Archive

# One-time (re-runnable) historical backfill of rain/archive/daily_{YYYY}.json
# for SEPA gauges from their KiWIS service, so gauge stats/records don't have
# to build up from scratch after deploying make_rain_summary.py — mirrors
# rain_backfill.yml's EA backfill, using SEPA's own full-history API instead.
# Manual trigger only — not part of the normal 15-min data pipeline.

on:
  workflow_dispatch:
    inputs:
      backfill_years_back:
        description: 'Years back to backfill (plus the current year)'
        required: false
        default: '2'
      limit_stations:
        description: 'Process only N stations (0 = all, for smoke tests)'
        required: false
        default: '0'

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Backfill SEPA historical daily archive
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        BACKFILL_YEARS_BACK: ${{ github.event.inputs.backfill_years_back }}
        LIMIT_STATIONS: ${{ github.event.inputs.limit_stations }}
      run: python -u backfill_sepa_archive.py
