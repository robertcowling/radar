name: Fetch SYNOP Observations (Ogimet)

on:
  # Triggered hourly by Google Apps Script (same mechanism as
  # surface_obs_update.yml / rain_update.yml) — add this workflow's file name
  # (synop_update.yml) to the Apps Script's dispatch list. SYNOP bulletins
  # are hourly at UK stations, so there's no benefit dispatching faster.
  workflow_dispatch:

# No git writes — output goes straight to R2 (latest snapshot + hourly archive),
# same pattern as surface_obs_update.yml.
permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Fetch and decode SYNOP observations
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      run: python synop/fetch_synop.py

    - name: Report Job Status
      if: always()
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        JOB_NAME: "SYNOP Observations"
        JOB_STATUS: ${{ job.status }}
      run: python report_job_status.py
