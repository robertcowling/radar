name: Fetch WIS2 Lightning Data

on:
  # Triggered every few minutes by Google Apps Script (same mechanism as
  # rain_update.yml / radar_update.yml) — add this workflow's file name
  # (lightning_wis2_update.yml) to the Apps Script's dispatch list.
  workflow_dispatch:

# No git writes — data goes straight to R2 (latest snapshot + daily history archive)
permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install boto3

    - name: Fetch WIS2 lightning data
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      run: python fetch_lightning_wis2.py

    - name: Report Job Status
      if: always()
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        JOB_NAME: "WIS2 Lightning"
        JOB_STATUS: ${{ job.status }}
      run: python report_job_status.py
