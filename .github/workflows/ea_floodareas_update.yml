name: Build EA Flood Areas (reference)

# Static reference data (the ~4200 flood alert/warning area polygons). These rarely
# change, so this is run occasionally (e.g. weekly, dispatched by an external scheduler).
# Polygon fetching is incremental: only areas missing from R2 are re-fetched.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-fetch every polygon even if already on R2"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build flood-area reference
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      run: |
        if [ "${{ inputs.force }}" = "true" ]; then
          python fetch_ea_floodareas.py --force
        else
          python fetch_ea_floodareas.py
        fi

    - name: Commit area index
      run: |
        git config --global user.name "Radar Automator"
        git config --global user.email "radar-bot@github.com"
        git add ea/floodareas/index.json ea/floodareas/centroids.geojson
        git diff --cached --quiet && echo "No changes to commit" || {
          git commit -m "Update EA flood-area index $(date -u +'%Y-%m-%d %H:%M UTC')" || exit 1
          n=0
          until git pull --rebase -X theirs origin main && git push origin main; do
            n=$((n+1)); [ $n -ge 3 ] && exit 1
            echo "Push attempt $n/3 failed, retrying in $((n*5))s..."
            sleep $((n*5))
          done
        }

    - name: Report Job Status
      if: always()
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        JOB_NAME: "EA Flood Areas"
        JOB_STATUS: ${{ job.status }}
      run: python report_job_status.py
