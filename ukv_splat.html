<style>

<body>

<div id="map"></div>

<!-- Info & Legend Panel -->
<div class="info-panel surface">
  <div class="panel-header">
    <span class="panel-header-title">UKV Splat Map</span>
  </div>

  <div class="section-label">Rainfall threshold</div>
  <select id="thresholdSelect" onchange="setThreshold(this.value)">
    <optgroup label="1-hour accumulation">
      <option value="1h_10mm">1hr &ge; 10 mm (Heavy)</option>
      <option value="1h_30mm">1hr &ge; 30 mm (Extreme)</option>
    </optgroup>
    <optgroup label="3-hour accumulation">
      <option value="3h_20mm" selected>3hr &ge; 20 mm (Heavy)</option>
      <option value="3h_30mm">3hr &ge; 30 mm (Extreme)</option>
      <option value="3h_40mm">3hr &ge; 40 mm (Severe)</option>
    </optgroup>
    <optgroup label="6-hour accumulation">
      <option value="6h_30mm">6hr &ge; 30 mm (Heavy)</option>
      <option value="6h_50mm">6hr &ge; 50 mm (Extreme)</option>
    </optgroup>
    <optgroup label="12-hour accumulation">
      <option value="12h_1mm">12hr &ge; 1 mm (Test)</option>
    </optgroup>
  </select>

  <div class="section-label">Boundary overlay</div>
  <select id="boundarySelect" onchange="onBoundaryChange(this.value)">
    <option value="catchments" selected>Catchments</option>
    <option value="regions">Regions</option>
    <option value="counties">Counties</option>
    <option value="grid">Grid (20km)</option>
    <option value="none">None</option>
  </select>

  <div class="section-label">Active model runs overlay</div>
  <div id="runLegendList" class="run-legend-list">
    <!-- Populated by JS -->
  </div>

  <div class="section-label" style="margin-top:16px;">Splat opacity</div>
  <div style="display:flex; align-items:center; gap:8px;">
    <input type="range" id="opacitySlider" min="0" max="100" value="80"
           style="flex:1; accent-color:#1e293b; cursor:pointer;"
           oninput="setOpacity(this.value)">
    <span id="opacityLabel" style="font-size:11px; color:#64748b; width:34px; text-align:right;">80%</span>
  </div>

  <p id="generatedAt">Loading metadata...</p>
  <p id="attribution">Met Office data &copy; Crown copyright &mdash; <a href="https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/" target="_blank" style="color:inherit;">OGL v3</a></p>

  </button>

  <div class="control-group">

    <input type="range" id="timeSlider" min="0" max="0" step="1" value="0" oninput="onSliderInput(parseInt(this.value))">
  </div>

  <div id="playerDateTime">
    <div>
      <div id="playerDateLine">—</div>
      <div id="playerOffsetLine">—</div>
    </div>
    <div id="noDataBadge">⚠ No splat data for frame</div>
  </div>

<script>
var R2_CDN = 'https://radar.floodforecast.co.uk';
var BLANK_PNG = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=';

// Distinct high-contrast color palette for up to 4 successive runs
var RUN_COLORS = [
  { name: 'Selected Model Run', hex: '#e63946', rgb: [230, 57, 70] },   // Crimson Red
  { name: 'Run -1',             hex: '#f77f00', rgb: [247, 127, 0] },   // Bright Orange
  { name: 'Run -2',             hex: '#2a9d8f', rgb: [42, 157, 143] },  // Teal Green
  { name: 'Run -3',             hex: '#457b9d', rgb: [69, 123, 157] }   // Steel Blue
];

var imgBounds = [[43.0, -26.0], [63.0, 17.0]];
var map = L.map('map', { zoomControl: false }).setView([54.5, -3.5], 6);
L.control.zoom({ position: 'topleft' }).addTo(map);

L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  maxZoom: 20,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>'
}).addTo(map);

// ── Leaflet overlays for up to 4 runs (slot 0 = selected/latest run, layered at top) ────
var runOverlays = [null, null, null, null];
// Add to map in reverse order (3 down to 0) so selected/latest run (slot 0) is added last and layered at top
for (var r = 3; r >= 0; r--) {
  var z = 400 + (3 - r); // r=3 gets 400, r=0 (selected) gets 403 (topmost)
  var overlay = L.imageOverlay(BLANK_PNG, imgBounds, { opacity: 0.8, interactive: false, zIndex: z }).addTo(map);
  overlay._expectedRawUrl = '';
  runOverlays[r] = overlay;
}

function setOverlayState(overlay, url, opacity, slotIdx) {
  if (!url) {
    overlay._expectedRawUrl = '';
    overlay.setUrl(BLANK_PNG);
    if (overlay.getElement()) overlay.getElement().style.display = 'none';
  } else {
    overlay.setUrl(url);
    overlay.setOpacity(opacity);
    if (overlay.getElement()) {
      overlay.getElement().style.display = 'block';
      if (typeof slotIdx === 'number') {
        overlay.getElement().style.zIndex = 403 - slotIdx;
      }
    }
  }
}

// ── Geographic Boundary Layers ────────────────────────────────────────────────
var regionLayer     = null;
var countiesLayer   = null;
var catchmentsLayer = null;
var gridLayer       = null;
var currentBoundary = 'catchments';

var BOUNDARY_STYLES = {
  regions:    { color: '#5f6368', weight: 1.5, fillOpacity: 0, className: 'region-boundary' },
  counties:   { color: '#5f6368', weight: 1.0, fillOpacity: 0, className: 'region-boundary' },
  catchments: { color: '#5f6368', weight: 1.0, fillOpacity: 0, className: 'region-boundary' },
  grid:       { color: '#5f6368', weight: 0.7, fillOpacity: 0, className: 'region-boundary' },
};

function getLayerObj(name) {
  if (name === 'regions')    return regionLayer;
  if (name === 'counties')   return countiesLayer;
  if (name === 'catchments') return catchmentsLayer;
  if (name === 'grid')       return gridLayer;
  return null;
}

function setLayerObj(name, layer) {
  if (name === 'regions')    regionLayer   = layer;
  if (name === 'counties')   countiesLayer = layer;
  if (name === 'catchments') catchmentsLayer = layer;
  if (name === 'grid')       gridLayer     = layer;
}

function loadBoundary(val) {
  var files = {
    regions:    'uk_regions.geojson',
    counties:   'uk-counties.geojson',
    catchments: 'uk_catchments.geojson',
    grid:       'uk_grid_20km.geojson',
  };
  if (!files[val] || getLayerObj(val)) return;
  fetch(R2_CDN + '/geo/' + files[val]).then(function(r) { if (!r.ok) throw 0; return r.json(); })
    .catch(function() { return fetch(files[val]).then(function(r) { return r.json(); }); })
    .then(function(data) {
      var layer = L.geoJSON(data, { style: BOUNDARY_STYLES[val] });
      setLayerObj(val, layer);
      if (currentBoundary === val) layer.addTo(map);
    })
    .catch(function(e) { console.log('Could not load boundary ' + val + ':', e); });
}

function onBoundaryChange(val) {
  ['regions','counties','catchments','grid'].forEach(function(n) {
    var l = getLayerObj(n);
    if (l && map.hasLayer(l)) map.removeLayer(l);
  });
  currentBoundary = val;
  if (val !== 'none') {
    var l = getLayerObj(val);
    if (l) { l.setStyle(BOUNDARY_STYLES[val]); l.addTo(map); }
    else loadBoundary(val);
  }
}
loadBoundary('catchments');

// ── State ─────────────────────────────────────────────────────────────────────
var meta            = null;
var focusRunIdx     = 0;            // Index in meta.runs (Selected model run)
var activeThreshold = '3h_20mm';
var currentValidIdx = 0;            // Index in masterValidMsList
var masterValidMsList = [];         // Sorted list of unique valid UTC ms timestamps for selected run
var runEnabled      = [true, true, true, true];
var globalOpacity   = 0.8;
var playing         = false;
var playTimer       = null;
var canvasCache     = {};           // Cache colorized dataURLs: key -> dataURL

// Helper: compute exact step valid UTC milliseconds, capped strictly at T+54h
function stepValidMs(run, step) {
  if (!run || !run.run_ts || !step) return NaN;
  if (step.offset_hours && step.offset_hours > 54) return NaN;
  var ts = run.run_ts;
  var runMs = Date.UTC(
    +ts.slice(0, 4), +ts.slice(4, 6) - 1, +ts.slice(6, 8),
    +ts.slice(9, 11), +ts.slice(11, 13)
  );
  return runMs + (step.offset_hours || 0) * 3600 * 1000;
}

// ── Tinting / Canvas Engine ───────────────────────────────────────────────────
function getColorizedSplatUrl(rawUrl, colorHex, cb) {
  var cacheKey = rawUrl + '|' + colorHex;
  if (canvasCache[cacheKey]) {
    cb(canvasCache[cacheKey]);
    return;
  }

  var img = new Image();
  img.crossOrigin = 'Anonymous';
  img.onload = function() {
    var canvas = document.createElement('canvas');
    canvas.width = img.width || 1725;
    canvas.height = img.height || 1800;
    var ctx = canvas.getContext('2d');

    // Draw solid color, then use destination-in mask
    ctx.fillStyle = colorHex;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = 'destination-in';
    ctx.drawImage(img, 0, 0);

    var dataUrl = canvas.toDataURL('image/png');
    canvasCache[cacheKey] = dataUrl;
    cb(dataUrl);
  };
  img.onerror = function() {
    cb('');
  };
  img.src = rawUrl;
}

// ── Main Data Initialization ──────────────────────────────────────────────────
fetch(R2_CDN + '/ukv_meta.json?v=' + Date.now())
  .then(function(res) { return res.json(); })
  .then(function(data) {
    meta = data;
    if (meta.generated_at) {
      document.getElementById('generatedAt').textContent = 'Updated: ' + new Date(meta.generated_at).toUTCString().replace('GMT', 'UTC');
    }
    initRunSelect();
    buildMasterTimeline();
    updateDisplay();
  })
  .catch(function(err) {
    document.getElementById('generatedAt').textContent = 'Error loading metadata.';
    console.error(err);
  });

function initRunSelect() {
  var sel = document.getElementById('focusRunSelect');
  sel.innerHTML = '';
  (meta.runs || []).forEach(function(r, idx) {
    // Only include the top 5 backcalculated active runs
    if (idx >= 5) return;
    var opt = document.createElement('option');
    opt.value = idx;
    opt.textContent = r.run_label || r.run_ts;
    sel.appendChild(opt);
  });
}

function buildMasterTimeline() {
  var msSet = new Set();
  var selectedRun = meta && meta.runs && meta.runs[focusRunIdx];
  if (selectedRun && selectedRun.steps) {
    selectedRun.steps.forEach(function(s) {
      // Filter strictly to steps that have data for the active threshold duration
      if (s.splats && s.splats[activeThreshold]) {
        var ms = stepValidMs(selectedRun, s);
        if (!isNaN(ms)) msSet.add(ms);
      }
    });
  }

  masterValidMsList = Array.from(msSet);
  masterValidMsList.sort(function(a, b) { return a - b; });

  var slider = document.getElementById('timeSlider');
  slider.min = 0;
  slider.max = Math.max(0, masterValidMsList.length - 1);
  if (currentValidIdx >= masterValidMsList.length) {
    currentValidIdx = 0;
  }
  slider.value = currentValidIdx;
}

function formatValidMs(ms) {
  if (isNaN(ms)) return '—';
  var d = new Date(ms);
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var hours = String(d.getUTCHours()).padStart(2, '0');
  var mins = String(d.getUTCMinutes()).padStart(2, '0');
  return d.getUTCDate() + ' ' + months[d.getUTCMonth()] + ' ' + d.getUTCFullYear() + ' ' + hours + ':' + mins + ' GMT';
}

function getActiveRunObjects() {
  if (!meta || !meta.runs) return [];
  var list = [];
  for (var offset = 0; offset < 4; offset++) {
    var idx = focusRunIdx + offset;
    if (idx < meta.runs.length && idx < 5) {
      list.push(meta.runs[idx]);
    } else {
      list.push(null);
    }
  }
  return list;
}

// ── Display Update ────────────────────────────────────────────────────────────
function updateDisplay() {
  if (!meta || !masterValidMsList.length) return;

  var targetMs = masterValidMsList[currentValidIdx];
  var targetValidLabel = formatValidMs(targetMs);
  document.getElementById('playerDateLine').textContent = targetValidLabel;

  var activeRuns = getActiveRunObjects();
  renderLegendList(activeRuns, targetMs);

  var anySplatActive = false;

  // Update map overlays for each of the 4 runs in reverse order (slot 3 up to slot 0) so latest (slot 0) is brought to front
  for (var slotIdx = 3; slotIdx >= 0; slotIdx--) {
    var run = activeRuns[slotIdx];
    var overlay = runOverlays[slotIdx];
    if (!run || !runEnabled[slotIdx]) {
      setOverlayState(overlay, '', 0, slotIdx);
      continue;
    }

    // Find step matching exact targetMs (capped strictly at T+54h)
    var matchingStep = null;
    (run.steps || []).forEach(function(s) {
      var ms = stepValidMs(run, s);
      if (!isNaN(ms) && Math.abs(ms - targetMs) < 60000) matchingStep = s;
    });

    if (!matchingStep || !matchingStep.splats || !matchingStep.splats[activeThreshold]) {
      setOverlayState(overlay, '', 0, slotIdx);
      continue;
    }

    anySplatActive = true;
    var rawSplatUrl = matchingStep.splats[activeThreshold];
    overlay._expectedRawUrl = rawSplatUrl;
    var colorHex = RUN_COLORS[slotIdx].hex;

    (function(sIdx, ov, url, hex) {
      getColorizedSplatUrl(url, hex, function(tintedUrl) {
        // Prevent race condition: verify this overlay still expects this raw URL
        if (ov._expectedRawUrl === url) {
          setOverlayState(ov, tintedUrl, globalOpacity, sIdx);
        }
      });
    })(slotIdx, overlay, rawSplatUrl, colorHex);
  }

  var focusStep = activeRuns[0] ? (activeRuns[0].steps || []).find(function(s){
    var ms = stepValidMs(activeRuns[0], s);
    return !isNaN(ms) && Math.abs(ms - targetMs) < 60000;
  }) : null;

  if (focusStep) {
    document.getElementById('playerOffsetLine').textContent = 'Forecast offset ' + focusStep.offset;
  } else {
    document.getElementById('playerOffsetLine').textContent = 'Outside forecast range';
  }

  document.getElementById('noDataBadge').style.display = anySplatActive ? 'none' : 'block';
}

function renderLegendList(activeRuns, targetMs) {
  var container = document.getElementById('runLegendList');
  container.innerHTML = '';
  var reqHours = parseInt(activeThreshold.split('h')[0]) || 1;

  activeRuns.forEach(function(run, slotIdx) {
    var card = document.createElement('div');
    var matchingStep = null;
    if (run && run.steps) {
      matchingStep = run.steps.find(function(s) {
        var ms = stepValidMs(run, s);
        return !isNaN(ms) && Math.abs(ms - targetMs) < 60000;
      });
    }

    var hasSplat = matchingStep && matchingStep.splats && matchingStep.splats[activeThreshold];
    var isEnabled = runEnabled[slotIdx];
    var isActive = hasSplat && isEnabled;

    card.className = 'run-legend-card' + (!isActive ? ' inactive' : '');

    var colorInfo = RUN_COLORS[slotIdx];
    var labelText = slotIdx === 0 ? (run ? run.run_label + ' (Selected)' : 'N/A') : (run ? run.run_label : 'No run data');
    var subText = '';

    if (!run) {
      subText = 'Run unavailable';
    } else if (!matchingStep) {
      // Check if targetMs is before the run's start time
      var firstMs = run.steps && run.steps[0] ? stepValidMs(run, run.steps[0]) : NaN;
      if (!isNaN(firstMs) && targetMs < firstMs) {
        subText = 'Before run initialization';
      } else {
        subText = 'Outside forecast range';
      }
    } else if (hasSplat) {
      subText = 'Active at timestamp (' + matchingStep.offset + ')';
    } else {
      // Step exists, but splat does not exist for this threshold
      var offsetH = matchingStep.offset_hours || 0;
      if (offsetH < reqHours) {
        subText = 'Needs ' + reqHours + 'h lead time (offset ' + matchingStep.offset + ')';
      } else {
        subText = 'Threshold exceedance mask empty';
      }
    }

    card.innerHTML =
      '<div class="run-info">' +
        '<div class="run-color-pill" style="background:' + colorInfo.hex + '"></div>' +
        '<div class="run-title-group">' +
          '<span class="run-name">' + labelText + '</span>' +
          '<span class="run-time-sub">' + subText + '</span>' +
        '</div>' +
      '</div>' +
      '<input type="checkbox" class="run-toggle-check" ' + (isEnabled ? 'checked' : '') +
      ' onchange="toggleRunSlot(' + slotIdx + ', this.checked)">';

    container.appendChild(card);
  });
}

// ── Interactive Handlers ──────────────────────────────────────────────────────
function setThreshold(val) {
  activeThreshold = val;
  buildMasterTimeline();
  updateDisplay();
}

function setFocusRun(idx) {
  focusRunIdx = idx;
  buildMasterTimeline();
  updateDisplay();
}

function toggleRunSlot(slotIdx, enabled) {
  runEnabled[slotIdx] = enabled;
  updateDisplay();
}

function setOpacity(val) {
  globalOpacity = parseFloat(val) / 100.0;
  document.getElementById('opacityLabel').textContent = Math.round(globalOpacity * 100) + '%';
  runOverlays.forEach(function(ov) {
    ov.setOpacity(globalOpacity);
  });
}

function onSliderInput(val) {
  currentValidIdx = val;
  updateDisplay();
}

function togglePlay() {
  playing = !playing;
  var btn = document.getElementById('playBtn');
  var icon = document.getElementById('playIcon');

  if (playing) {
    icon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; // Pause icon
    playTimer = setInterval(function() {
      currentValidIdx = (currentValidIdx + 1) % masterValidMsList.length;
      document.getElementById('timeSlider').value = currentValidIdx;
      updateDisplay();
    }, 300);
  } else {
    icon.innerHTML = '<path d="M8 5v14l11-7z"/>'; // Play icon
    clearInterval(playTimer);
  }
}
</script>
