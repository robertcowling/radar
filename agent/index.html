<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Weather Briefing</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', sans-serif;
      background: #eef2f7;
      color: #1f2937;
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────── */
    header {
      background: linear-gradient(90deg, #0ea5e9 0%, #2563eb 100%);
      color: #fff;
      padding: 14px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .header-title { font-size: 17px; font-weight: 700; flex: 1; min-width: 120px; }
    .severity-pill {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #fff;
      background: #16a34a;
    }
    .severity-pill.elevated  { background: #ca8a04; }
    .severity-pill.significant { background: #ea580c; }
    .severity-pill.severe    { background: #dc2626; }
    .updated-time {
      font-size: 12px;
      opacity: 0.85;
      white-space: nowrap;
    }

    /* ── Main content ───────────────────────── */
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── Headline card ──────────────────────── */
    .headline-card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .headline-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #6b7280;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .headline-text {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.35;
      color: #1f2937;
    }
    .risk-areas {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .risk-area-tag {
      background: #fef3c7;
      color: #92400e;
      font-size: 12px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 12px;
      border: 1px solid #fcd34d;
    }

    /* ── Summary card ───────────────────────── */
    .summary-card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      font-size: 15px;
      line-height: 1.75;
      color: #374151;
    }
    .summary-card .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #6b7280;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .summary-card p + p { margin-top: 16px; }

    /* ── Image strip ────────────────────────── */
    .image-strip-section {
      background: #1a1f2e;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }
    .image-strip-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .image-strip {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.2) transparent;
    }
    .image-strip::-webkit-scrollbar { height: 4px; }
    .image-strip::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
    .image-tile {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
    }
    .image-tile img {
      width: 160px;
      height: 130px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid transparent;
      transition: border-color 0.15s, transform 0.15s;
      display: block;
    }
    .image-tile img:hover { border-color: #60a5fa; transform: scale(1.02); }
    .image-tile-label {
      font-size: 10px;
      color: rgba(255,255,255,0.65);
      text-align: center;
      max-width: 160px;
      line-height: 1.3;
    }

    /* ── Lightbox ───────────────────────────── */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      padding: 20px;
    }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: 95vw; max-height: 85vh; object-fit: contain; border-radius: 6px; }
    #lightbox-caption { color: rgba(255,255,255,0.8); font-size: 13px; }
    #lightbox-close {
      position: absolute;
      top: 16px; right: 20px;
      background: none; border: none;
      color: #fff; font-size: 28px; cursor: pointer; opacity: 0.8;
      line-height: 1;
    }
    #lightbox-close:hover { opacity: 1; }

    /* ── Context panel ──────────────────────── */
    .context-panel {
      background: #1a1f2e;
      border-radius: 12px;
      padding: 0;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      overflow: hidden;
    }
    .context-section {
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .context-section:last-child { border-bottom: none; }
    .context-toggle {
      width: 100%;
      background: none;
      border: none;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      color: rgba(255,255,255,0.85);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      text-align: left;
    }
    .context-toggle:hover { background: rgba(255,255,255,0.04); }
    .toggle-arrow {
      font-size: 10px;
      opacity: 0.5;
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    .context-toggle[aria-expanded="true"] .toggle-arrow { transform: rotate(90deg); }
    .context-body {
      display: none;
      padding: 0 18px 16px;
    }
    .context-body.open { display: block; }
    .context-bullets {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .context-bullets li {
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      padding-left: 16px;
      position: relative;
      line-height: 1.5;
    }
    .context-bullets li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: #60a5fa;
    }
    .prompt-pre {
      font-family: 'Roboto Mono', 'Courier New', monospace;
      font-size: 11.5px;
      color: rgba(255,255,255,0.6);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 400px;
      overflow-y: auto;
      background: rgba(0,0,0,0.25);
      border-radius: 6px;
      padding: 12px;
      line-height: 1.55;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.15) transparent;
    }

    /* ── Loading / error states ─────────────── */
    .state-card {
      background: #fff;
      border-radius: 12px;
      padding: 40px 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      text-align: center;
      color: #6b7280;
      font-size: 15px;
    }
    .state-card.error { color: #dc2626; }

    /* ── Footer ─────────────────────────────── */
    footer {
      background: #1a1f2e;
      color: rgba(255,255,255,0.5);
      text-align: center;
      padding: 16px;
      font-size: 12px;
    }
    footer a { color: rgba(255,255,255,0.7); text-decoration: none; margin: 0 8px; }
    footer a:hover { color: #fff; }
  </style>
</head>
<body>

<header>
  <div class="header-title">Weather Briefing</div>
  <span id="severity-pill" class="severity-pill">Loading</span>
  <span class="updated-time" id="updated-time"></span>
</header>

<main id="main-content">
  <div class="state-card" id="loading-card">Loading briefing…</div>
</main>

<div id="lightbox">
  <button id="lightbox-close" aria-label="Close">&times;</button>
  <img id="lightbox-img" src="" alt="">
  <div id="lightbox-caption"></div>
</div>

<footer>
  <a href="../">Radar</a>
  <a href="../rain/">Rain Gauges</a>
  <a href="../gaugecheck.html">Gauge QC</a>
  <a href="../24hr/">24hr Accumulation</a>
</footer>

<script>
  const SEVERITY_CLASSES = { normal: '', elevated: 'elevated', significant: 'significant', severe: 'severe' };
  const SEVERITY_LABELS  = { normal: 'Normal', elevated: 'Elevated', significant: 'Significant', severe: 'Severe' };

  function fmtDateUTC(iso) {
    const d = new Date(iso);
    const days  = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const hh = String(d.getUTCHours()).padStart(2,'0');
    const mm = String(d.getUTCMinutes()).padStart(2,'0');
    return `Updated ${days[d.getUTCDay()]} ${d.getUTCDate()} ${months[d.getUTCMonth()]} ${hh}:${mm} UTC`;
  }

  function buildPage(data) {
    const main = document.getElementById('main-content');
    main.innerHTML = '';

    // Severity pill
    const sev = (data.severity || 'normal').toLowerCase();
    const pill = document.getElementById('severity-pill');
    pill.textContent = SEVERITY_LABELS[sev] || sev;
    pill.className = 'severity-pill ' + (SEVERITY_CLASSES[sev] || '');

    // Updated time
    if (data.generated_at) {
      document.getElementById('updated-time').textContent = fmtDateUTC(data.generated_at);
    }

    // Headline card
    const headline = document.createElement('div');
    headline.className = 'headline-card';
    headline.innerHTML = `<div class="headline-label">Today's briefing</div>
      <div class="headline-text">${escHtml(data.headline || 'No headline available.')}</div>`;
    if (data.top_risk_areas && data.top_risk_areas.length) {
      const areas = document.createElement('div');
      areas.className = 'risk-areas';
      data.top_risk_areas.forEach(a => {
        const tag = document.createElement('span');
        tag.className = 'risk-area-tag';
        tag.textContent = a;
        areas.appendChild(tag);
      });
      headline.appendChild(areas);
    }
    main.appendChild(headline);

    // Summary card
    if (data.summary) {
      const sc = document.createElement('div');
      sc.className = 'summary-card';
      sc.innerHTML = '<div class="section-label">Briefing</div>';
      data.summary.split('\n\n').forEach(para => {
        if (!para.trim()) return;
        const p = document.createElement('p');
        p.textContent = para.trim();
        sc.appendChild(p);
      });
      main.appendChild(sc);
    }

    // Image strip
    if (data.images_used && data.images_used.length) {
      const strip = document.createElement('div');
      strip.className = 'image-strip-section';
      strip.innerHTML = '<div class="image-strip-label">Images analysed by the model</div>';
      const row = document.createElement('div');
      row.className = 'image-strip';
      data.images_used.forEach(img => {
        const tile = document.createElement('div');
        tile.className = 'image-tile';
        const im = document.createElement('img');
        im.src = img.url;
        im.alt = img.label;
        im.loading = 'lazy';
        im.addEventListener('click', () => openLightbox(img.url, img.label));
        const lbl = document.createElement('div');
        lbl.className = 'image-tile-label';
        lbl.textContent = img.label;
        tile.appendChild(im);
        tile.appendChild(lbl);
        row.appendChild(tile);
      });
      strip.appendChild(row);
      main.appendChild(strip);
    }

    // Context panel
    const ctx = document.createElement('div');
    ctx.className = 'context-panel';

    if (data.context_bullets && data.context_bullets.length) {
      ctx.appendChild(buildToggleSection(
        'Data used in this briefing',
        true,
        () => {
          const ul = document.createElement('ul');
          ul.className = 'context-bullets';
          data.context_bullets.forEach(b => {
            const li = document.createElement('li');
            li.textContent = b;
            ul.appendChild(li);
          });
          return ul;
        }
      ));
    }

    if (data.prompt_used) {
      ctx.appendChild(buildToggleSection(
        'Full prompt sent to model',
        false,
        () => {
          const pre = document.createElement('pre');
          pre.className = 'prompt-pre';
          pre.textContent = data.prompt_used;
          return pre;
        }
      ));
    }

    if (ctx.children.length) main.appendChild(ctx);
  }

  function buildToggleSection(title, startOpen, contentFn) {
    const sec = document.createElement('div');
    sec.className = 'context-section';
    const btn = document.createElement('button');
    btn.className = 'context-toggle';
    btn.setAttribute('aria-expanded', startOpen ? 'true' : 'false');
    btn.innerHTML = `<span class="toggle-arrow">&#9658;</span> ${escHtml(title)}`;
    const body = document.createElement('div');
    body.className = 'context-body' + (startOpen ? ' open' : '');
    body.appendChild(contentFn());
    btn.addEventListener('click', () => {
      const open = body.classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    sec.appendChild(btn);
    sec.appendChild(body);
    return sec;
  }

  function openLightbox(url, caption) {
    document.getElementById('lightbox-img').src = url;
    document.getElementById('lightbox-caption').textContent = caption;
    document.getElementById('lightbox').classList.add('open');
  }
  document.getElementById('lightbox').addEventListener('click', e => {
    if (e.target === document.getElementById('lightbox') || e.target === document.getElementById('lightbox-close')) {
      document.getElementById('lightbox').classList.remove('open');
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('open');
  });

  function escHtml(str) {
    return String(str)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  // Load data
  fetch('summary.json?_=' + Date.now())
    .then(r => {
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    })
    .then(data => {
      document.getElementById('loading-card')?.remove();
      buildPage(data);
    })
    .catch(err => {
      const card = document.getElementById('loading-card');
      if (card) {
        card.className = 'state-card error';
        card.textContent = 'Could not load briefing: ' + err.message;
      }
    });
</script>
</body>
</html>
