<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Rain Gauge | Flood Forecast</title>
<meta name="description" content="Rainfall totals, climatology, records and data provenance for a UK rain gauge.">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Chart.js — same library the Flood Forecast project itself loads
     (templates/base.html), so these charts port over untouched. -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
/* Brand tokens mirror the Flood Forecast project's tailwind.config brand
   ramp (see Flood Forecast/templates/base.html and rain/table.html). */
:root {
  --font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-display: 'Outfit', var(--font-family);
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --bg-base: #f8f9fa;
  --bg-surface: #ffffff;
  --bg-surface-hover: #f1f3f4;
  --bg-inset: #f4f6f8;
  --border-color: #e2e8f0;
  --border-strong: #cbd5e1;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --text-dark: #94a3b8;
  --brand-100: #d6f4f4;
  --brand-200: #AFEAE9;
  --brand-300: #79D6DA;
  --brand-400: #44BBC8;
  --brand-500: #2F8696;
  --brand-600: #266b78;
  --brand-700: #1f555f;
  --brand-tint: rgba(47,134,150,0.10);
  /* Wet / dry departure pair, used everywhere a value is compared with its
     average: bar colours, cumulative fill, heatmap, stat rail. Cool reads
     wetter, warm reads drier, neutral gray between. */
  --wet-strong: #1f555f; --wet: #2F8696; --wet-fill: rgba(47,134,150,0.20);
  --dry-strong: #7a5713; --dry: #b8862a; --dry-fill: rgba(184,134,42,0.20);
  --dv-w4: #1f555f; --dv-w3: #2F8696; --dv-w2: #79D6DA; --dv-w1: #d6f4f4;
  --dv-n:  #eceff2;
  --dv-d1: #f6e8cd; --dv-d2: #e3c384; --dv-d3: #b8862a; --dv-d4: #7a5713;
  --dv-w4-ink: #ffffff; --dv-w3-ink: #ffffff; --dv-w2-ink: #123a42; --dv-w1-ink: #1f555f;
  --dv-d1-ink: #6f4c12; --dv-d2-ink: #4a330b; --dv-d3-ink: #ffffff; --dv-d4-ink: #ffffff;
  --dv-n-ink: #475569;
  --nodata: #90a4ae;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg-base: #0f172a;
    --bg-surface: #1e293b;
    --bg-surface-hover: #334155;
    --bg-inset: #16233a;
    --border-color: #334155;
    --border-strong: #475569;
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --text-dark: #64748b;
    /* brand-400, not brand-500 — same lighten-for-dark-bg override the
       Flood Forecast project itself uses (see base.html's .spinner rule) */
    --brand-500: #44BBC8;
    --brand-600: #79D6DA;
    --brand-tint: rgba(68,187,200,0.14);
    --wet-strong: #AFEAE9; --wet: #44BBC8; --wet-fill: rgba(68,187,200,0.22);
    --dry-strong: #f2c14e; --dry: #d9a233; --dry-fill: rgba(217,162,51,0.22);
    --dv-w4: #AFEAE9; --dv-w3: #44BBC8; --dv-w2: #2F8696; --dv-w1: #1f555f;
    --dv-n:  #2b3648;
    --dv-d1: #4a3512; --dv-d2: #7d5a17; --dv-d3: #c08f24; --dv-d4: #f2c14e;
    --dv-w4-ink: #0f172a; --dv-w3-ink: #0f172a; --dv-w2-ink: #eafcff; --dv-w1-ink: #cdeef2;
    --dv-d1-ink: #f5dda6; --dv-d2-ink: #fbe9c2; --dv-d3-ink: #241905; --dv-d4-ink: #241905;
    --dv-n-ink: #cbd5e1;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-family);
  background-color: var(--bg-base);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

nav {
  background-color: #0f172a; color: #fff;
  box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
  position: sticky; top: 0; z-index: 1001; height: 64px;
  display: flex; align-items: center;
}
.nav-container { max-width: 96rem; width: 100%; margin: 0 auto; padding: 0 1.5rem; display: flex; justify-content: space-between; align-items: center; }
.nav-brand { display: flex; align-items: center; gap: 0.5rem; text-decoration: none; color: #fff; font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; }
.brand-logo-fallback { width: 32px; height: 32px; border-radius: 50%; background-color: var(--brand-500); display: flex; align-items: center; justify-content: center; color: #fff; }
.nav-links { display: flex; gap: 0.5rem; }
.nav-link { padding: 0.5rem 0.75rem; border-radius: 6px; font-size: 0.875rem; font-weight: 500; color: #cbd5e1; text-decoration: none; }
.nav-link:hover { background-color: #1e293b; color: #fff; }
.nav-link.active { background-color: #1e293b; color: #fff; font-weight: 700; }
/* The shared nav is 456px wide at its natural size, which put the page into a
   horizontal scroll on a phone. Only this page's copy is tightened. */
@media (max-width: 560px) {
  .nav-container { padding: 0 0.75rem; }
  .nav-brand span { display: none; }
  .nav-link { padding: 0.45rem 0.5rem; font-size: 0.8rem; }
}

.main-wrap { flex: 1; padding: 1.25rem 1.5rem 3rem; width: 100%; max-width: 84rem; margin: 0 auto; }
@media (max-width: 560px) { .main-wrap { padding: 0.9rem 0.75rem 2rem; } }

/* ── Header strip: facts and live figures, not a card with one number ──── */
.gauge-head {
  background: var(--bg-surface); border: 1px solid var(--border-color);
  border-radius: 12px; padding: 0.9rem 1.1rem; margin-bottom: 0.85rem;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 1.25rem; flex-wrap: wrap;
}
.gauge-head h1 { font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; line-height: 1.2; }
.head-facts { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.3rem; display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
.head-facts .sep { color: var(--border-strong); }
.pill {
  font-size: 0.68rem; font-weight: 700; padding: 2px 8px; border-radius: 4px;
  background: var(--bg-inset); color: var(--text-muted); border: 1px solid var(--border-color);
}
.mono { font-family: var(--font-mono); font-size: 0.94em; }

.head-figures { display: flex; align-items: stretch; gap: 0; margin-left: auto; }
.figure { padding: 0 0.95rem; border-left: 1px solid var(--border-color); text-align: right; }
.figure:first-child { border-left: none; }
.figure .fv { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; line-height: 1.05; letter-spacing: -0.01em; }
.figure .fv.nil { color: var(--text-dark); font-weight: 500; }
.figure .fv.absent { font-size: 0.95rem; }
.figure .fv .u { font-size: 0.62em; font-weight: 500; color: var(--text-muted); margin-left: 1px; }
.figure .fl { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; white-space: nowrap; }
.head-aside { display: flex; flex-direction: column; align-items: flex-end; gap: 0.35rem; padding-left: 0.95rem; border-left: 1px solid var(--border-color); }
.head-aside .stamp { font-size: 0.7rem; color: var(--text-dark); white-space: nowrap; }
.btn {
  background: var(--bg-surface); border: 1px solid var(--border-color); color: var(--text-main);
  padding: 0.3rem 0.7rem; border-radius: 6px; font-size: 0.75rem; font-weight: 500; cursor: pointer;
  display: inline-flex; align-items: center; gap: 0.25rem; font-family: var(--font-family);
}
.btn:hover { background: var(--bg-surface-hover); }

/* Four hairline-divided figure columns are 500px wide, so on a phone they
   wrap to a left-aligned block rather than widening the page. */
@media (max-width: 760px) {
  .gauge-head { flex-direction: column; gap: 0.85rem; padding: 0.8rem 0.9rem; }
  .head-figures { margin-left: 0; flex-wrap: wrap; gap: 0.5rem 0; width: 100%; }
  .figure { padding: 0 1.1rem 0 0; border-left: none; text-align: left; }
  .figure .fv { font-size: 1.25rem; }
  .head-aside { flex-direction: row; align-items: center; gap: 0.6rem; padding-left: 0; border-left: none; }
}

/* ── Panel primitive: flat, hairline, no hover lift, no icon chips ─────── */
.grid { display: grid; gap: 0.85rem; margin-bottom: 0.85rem; }
.grid.split { grid-template-columns: minmax(0, 0.86fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 1000px) { .grid.split { grid-template-columns: minmax(0, 1fr); } }

.panel { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 12px; margin-bottom: 0.85rem; }
.grid .panel { margin-bottom: 0; }
.panel-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 0.6rem; flex-wrap: wrap;
  padding: 0.7rem 1.05rem; border-bottom: 1px solid var(--border-color);
}
.panel-head h2 { font-family: var(--font-display); font-size: 0.95rem; font-weight: 600; }
.panel-head .hint { font-size: 0.74rem; color: var(--text-muted); }
.panel-body { padding: 0.9rem 1.05rem; }
.panel-body.flush { padding: 0; }
.note { font-size: 0.73rem; color: var(--text-muted); line-height: 1.5; }
.empty { font-size: 0.82rem; color: var(--text-muted); padding: 0.4rem 0; }
@media (max-width: 560px) { .panel-head, .panel-body { padding-left: 0.75rem; padding-right: 0.75rem; } }

/* ── Data tables ─────────────────────────────────────────────────────── */
table.data { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
table.data th {
  font-size: 0.7rem; font-weight: 600; color: var(--text-muted); text-align: right;
  padding: 0.3rem 0.5rem; border-bottom: 1px solid var(--border-color); white-space: nowrap;
}
table.data th:first-child, table.data td:first-child { text-align: left; }
table.data td { padding: 0.34rem 0.5rem; border-bottom: 1px solid var(--border-color); text-align: right; }
table.data tbody tr:last-child td { border-bottom: none; }
table.data tbody tr:hover { background: var(--bg-inset); }
table.data td.num { font-variant-numeric: tabular-nums; font-weight: 600; }
table.data td.dim { color: var(--text-muted); font-weight: 400; }
table.data td.nil { color: var(--text-dark); font-weight: 400; font-style: italic; }

.bar-cell { width: 42%; }
.bar-track { height: 7px; background: var(--bg-inset); border-radius: 2px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--wet); border-radius: 2px 0 0 2px; }
/* A measured zero is a hairline along the track, so it never looks like the
   blank track of a gauge that sent nothing. */
.bar-fill.zero { width: 100%; height: 1px; margin-top: 3px; background: var(--border-strong); border-radius: 0; }

/* ── Inline stat rail ─────────────────────────────────────────────────── */
.rail { display: flex; flex-wrap: wrap; gap: 0.2rem 1.5rem; }
.rail .item { padding: 0.15rem 0; min-width: 8.5rem; }
.rail .rv { font-family: var(--font-display); font-size: 1.12rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.rail .rl { font-size: 0.72rem; color: var(--text-muted); }
.rail .rv.wet { color: var(--wet); }
.rail .rv.dry { color: var(--dry); }
.rail .rv.nil { color: var(--text-dark); font-weight: 500; font-size: 0.98rem; }
.rail-top { margin-top: 0.85rem; padding-top: 0.75rem; border-top: 1px solid var(--border-color); }

/* ── Charts ──────────────────────────────────────────────────────────── */
.tabs { display: flex; gap: 0.3rem; flex-wrap: wrap; }
.tabs button {
  font-family: var(--font-family); font-size: 0.74rem; font-weight: 500; padding: 0.22rem 0.6rem;
  border-radius: 5px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-muted); cursor: pointer;
}
.tabs button:hover { background: var(--bg-surface-hover); }
.tabs button.active { background: var(--brand-tint); border-color: var(--brand-500); color: var(--brand-600); font-weight: 600; }
.chart-box { position: relative; width: 100%; height: 250px; }
.chart-box.h-mid { height: 215px; }
@media (max-width: 560px) { .chart-box { height: 205px; } .chart-box.h-mid { height: 185px; } }
.legend { display: flex; flex-wrap: wrap; gap: 0.15rem 1rem; font-size: 0.72rem; color: var(--text-muted); margin-top: 0.5rem; }
.legend .key { display: inline-flex; align-items: center; gap: 0.35rem; }
.legend .sw { width: 14px; height: 9px; border-radius: 2px; display: inline-block; flex: 0 0 auto; }
.legend .sw.line { height: 0; border-top: 2px solid currentColor; border-radius: 0; }
.legend .sw.dash { height: 0; border-top: 2px dashed var(--text-dark); border-radius: 0; }
.legend .sw.tick { height: 3px; background: var(--text-dark); border-radius: 0; }
.legend .sw.gap { background: repeating-linear-gradient(90deg, var(--nodata) 0 2px, transparent 2px 4px); }

/* ── Anomaly heatmap ─────────────────────────────────────────────────── */
.hm-scroll { max-height: 24rem; overflow: auto; }
table.hm { width: 100%; border-collapse: separate; border-spacing: 2px; font-size: 0.7rem; font-variant-numeric: tabular-nums; }
table.hm th {
  font-size: 0.68rem; font-weight: 600; color: var(--text-muted); padding: 2px 4px; text-align: center;
  background: var(--bg-surface); position: sticky; top: 0; z-index: 2;
}
table.hm th.yr, table.hm td.yr {
  position: sticky; left: 0; z-index: 3; background: var(--bg-surface);
  text-align: left; padding-right: 8px; font-weight: 600; color: var(--text-main); white-space: nowrap;
}
table.hm th.yr { z-index: 4; }
table.hm td { text-align: center; padding: 3px 5px; border-radius: 3px; min-width: 2.1rem; color: var(--dv-n-ink); background: var(--dv-n); }
table.hm td.gap { background: transparent; color: var(--text-dark); }
table.hm td.part { background: var(--bg-inset); color: var(--text-dark); font-style: italic; }
table.hm td.tot { background: transparent; color: var(--text-main); font-weight: 600; border-left: 1px solid var(--border-color); }
/* The average row stays pinned to the bottom of the scroll box: it is the
   reference every cell above is shaded against. */
table.hm tr.norms td {
  background: var(--bg-surface); color: var(--text-muted); font-weight: 500;
  border-top: 1px solid var(--border-strong); position: sticky; bottom: 0; z-index: 2;
}
table.hm tr.norms td.yr { color: var(--text-muted); font-weight: 600; z-index: 3; }
/* Scoped to table.hm so these beat the `table.hm td` default background —
   an unscoped `td.w4` loses on specificity and every cell renders neutral. */
table.hm td.w4 { background: var(--dv-w4); color: var(--dv-w4-ink); }
table.hm td.w3 { background: var(--dv-w3); color: var(--dv-w3-ink); }
table.hm td.w2 { background: var(--dv-w2); color: var(--dv-w2-ink); }
table.hm td.w1 { background: var(--dv-w1); color: var(--dv-w1-ink); }
table.hm td.d1 { background: var(--dv-d1); color: var(--dv-d1-ink); }
table.hm td.d2 { background: var(--dv-d2); color: var(--dv-d2-ink); }
table.hm td.d3 { background: var(--dv-d3); color: var(--dv-d3-ink); }
table.hm td.d4 { background: var(--dv-d4); color: var(--dv-d4-ink); }
.hm-legend { display: flex; align-items: center; gap: 0.3rem; flex-wrap: wrap; font-size: 0.7rem; color: var(--text-muted); margin-top: 0.7rem; }
.hm-legend .cell { width: 24px; height: 13px; border-radius: 3px; flex: 0 0 auto; }

/* ── Map: the /rain gauge map's own visual language, reused ───────────── */
#gaugeMap { height: 390px; border-bottom: 1px solid var(--border-color); }
@media (max-width: 1000px) { #gaugeMap { height: 320px; } }
@media (max-width: 560px) { #gaugeMap { height: 260px; } }
.leaflet-container { background: var(--bg-inset); font-family: var(--font-family); }
/* Marker rules copied verbatim from rain/index.html (.rg-wrap / .rg-icon /
   .rg-nodata / .rg-dry) — same sizes, same flex-centering, same transform
   hint — so a gauge reads as the identical marker on both pages. Only the
   additions below (rg-self, dark-mode dry) are new to this page. */
.rg-wrap {
  display: flex; align-items: center; justify-content: center;
  width: 20px; height: 20px;
}
.rg-icon {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.55);
  transform: translateZ(0); will-change: transform;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-family); font-size: 8.5px; font-weight: 700;
  color: #fff;
  text-shadow: 0 1px 1px rgba(0,0,0,0.5);
  box-sizing: border-box;
  cursor: pointer;
  line-height: 1;
}
.rg-icon.rg-nodata {
  width: 7px; height: 7px;
  background: #90a4ae;
  opacity: 0.35;
  border: none;
}
/* Reported readings summing to ~0: measured and dry, which must not look like
   a gauge that sent nothing. */
.rg-icon.rg-dry {
  background: #eef1f3;
  color: #6b7a86;
  border-color: rgba(120,144,156,0.45);
  text-shadow: none;
}
/* /rain's dry chip is tuned for a light basemap; on Dark Matter it would be
   the brightest thing on the map, which is backwards for "nothing happened".
   /rain itself has no dark mode, so this addition has nothing to match. */
@media (prefers-color-scheme: dark) {
  .rg-icon.rg-dry { background: #2b3648; color: #94a3b8; border-color: rgba(148,163,184,0.35); }
}
/* This page's own addition: the gauge whose page this is, ringed so it's
   findable among its neighbours. Numbers stay visible at every zoom level,
   same as /rain's own map, rather than shrinking to unlabelled dots. */
.rg-icon.rg-self { box-shadow: 0 0 0 3px var(--brand-500), 0 0 0 4.5px rgba(255,255,255,0.85); }
.map-bar {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 0.6rem 1rem; flex-wrap: wrap;
  padding: 0.55rem 1.05rem; border-bottom: 1px solid var(--border-color);
}
.scale-row { display: flex; align-items: center; gap: 0; }
.scale-row .sc { width: 21px; height: 11px; }
.scale-labels { display: flex; gap: 0; font-size: 0.6rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.scale-labels span { width: 21px; text-align: center; }
.scale-cap { font-size: 0.64rem; color: var(--text-muted); margin-bottom: 2px; }
@media (max-width: 560px) { .map-bar { padding-left: 0.75rem; padding-right: 0.75rem; } .scale-row .sc, .scale-labels span { width: 17px; } }

/* ── Map popup: default Leaflet chrome re-themed to this page's own panel
   language (surface colour, hairline border, layered shadow) instead of the
   plain white box Leaflet ships — otherwise a light popup sits on the dark
   basemap and the rest of the dark-mode page like a hole punched in it. */
.leaflet-popup.gauge-popup .leaflet-popup-content-wrapper {
  background: var(--bg-surface); color: var(--text-main);
  border: 1px solid var(--border-color); border-radius: 10px;
  box-shadow: 0 2px 4px rgba(15,23,42,.06), 0 8px 24px -6px rgba(15,23,42,.18);
  padding: 0;
}
.leaflet-popup.gauge-popup .leaflet-popup-content { margin: 0.75rem 0.95rem; width: auto !important; min-width: 11rem; }
.leaflet-popup.gauge-popup .leaflet-popup-tip-container { width: 24px; height: 12px; }
.leaflet-popup.gauge-popup .leaflet-popup-tip { background: var(--bg-surface); box-shadow: none; border: 1px solid var(--border-color); }
.leaflet-popup.gauge-popup .leaflet-popup-close-button {
  top: 7px !important; right: 7px !important; width: 20px !important; height: 20px !important;
  color: var(--text-dark); font-size: 17px; font-weight: 400;
}
.leaflet-popup.gauge-popup .leaflet-popup-close-button:hover { color: var(--text-main); background: transparent; }

.pop-name {
  display: block; font-family: var(--font-display); font-weight: 700; font-size: 0.92rem;
  padding-right: 0.9rem; color: var(--text-main); text-decoration: none;
}
/* Only a neighbouring gauge's name is a link (this gauge's own popup has
   nowhere useful to go) — underline on hover is the only tell it's clickable,
   so it doesn't read as a link when it isn't one. */
.pop-name-link:hover { color: var(--brand-500); text-decoration: underline; }
.pop-sub { font-size: 0.72rem; color: var(--text-muted); margin-top: 1px; }
.pop-sub .pill { padding: 0 6px; font-size: 0.62rem; }
.pop-stats { display: flex; gap: 1.1rem; margin-top: 0.55rem; padding-top: 0.5rem; border-top: 1px solid var(--border-color); }
.pop-stat .pv { font-family: var(--font-display); font-weight: 700; font-size: 1rem; font-variant-numeric: tabular-nums; }
.pop-stat .pv.nil { color: var(--text-dark); font-weight: 500; font-size: 0.82rem; }
.pop-stat .pv .u { font-size: 0.66em; font-weight: 500; color: var(--text-muted); margin-left: 1px; }
.pop-stat .pl { font-size: 0.68rem; color: var(--text-muted); margin-top: 1px; }

.nb-row {
  display: grid; grid-template-columns: minmax(0,1fr) 4.2rem 4.8rem; align-items: center; gap: 0.5rem;
  padding: 0.32rem 1.05rem; font-size: 0.8rem; text-decoration: none; color: var(--text-main);
  border-bottom: 1px solid var(--border-color);
}
.nb-row:last-child { border-bottom: none; }

    <p>Rainfall observations from the Environment Agency, Natural Resources Wales &amp; SEPA. Historic series from EA Hydrology and SEPA, measured at the gauge itself, never substituted from another station.</p>
    <p><a href="table.html" class="footer-link">Gauge table</a> &middot; <a href="/rain" class="footer-link">Gauge map</a></p>
  </div>

<script>
var R2_CDN = 'https://radar.floodforecast.co.uk';
var ref = new URLSearchParams(location.search).get('ref');

var stations = {};          // rain/stations.json — network metadata
var summaryStations = {};   // rain/summary.json — live rolling totals
var summaryGeneratedAt = null;
var normalIndex = {};       // merged climatology_index_{ea,sepa,nrw}
var archiveDays = {};       // {YYYY-MM-DD: mm} rolling archive (UTC-midnight days)
var rawByDate = {};         // {YYYYMMDD: {readings: {ref: {slot: mm}}}} 15-minute
var clim = null;            // rain/climatology/{ref}.json — the deep record
var mode = 'none';          // 'live' | 'historic' | 'none'  (see climatologyMode)
/* Set when a climatology file was fetched but refused because it belongs to a
   different station. Used only to explain why nothing is shown. */
var proxyRejected = null;
var derived = null;
var station = null;
var recentTab = '24h';
var mapWindow = '24h';      // which accumulation the map markers show
var durationScope = 'short'; // 'short' | 'long' — see DURATIONS split below
var lastSummary = null;      // the summaryStations[ref] row, kept for re-renders
// stations.json carries no county field (confirmed empty on all 1,342 rows) —
// table.html derives it client-side with a point-in-polygon test against
// geo/uk-counties.geojson, so this page does the same for the one gauge it
// needs it for, rather than repeating "Not assigned" on every page.
var countyName = null;

var MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DAY_ABBR = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
/* A month is only comparable with other months once ≥90% of its days carry a
   value — the threshold build_rain_climatology.py uses for its own normals. */
var MONTH_COMPLETENESS = 0.9;
/* Beyond this a record describes a different climate from today's telemetry,
   so "% of normal" and the year-to-date curve stop being computable. Recency
   decides, not network: a handful of EA and SEPA gauges have records that stop
   decades back. */
var STALE_RECORD_DAYS = 730;
/* Highest daily rainfall ever recorded in the UK: 341.4 mm, Honister Pass,
   5 December 2015. A published daily value above this is not a record, it is
   an artefact in the source series — say so rather than present it straight. */
var UK_DAILY_RECORD_MM = 341.4;
/* Longest verified UK run without measurable rain: around 73 days (Mile End,
   London, spring 1893). A published dry spell or a driest calendar month of
   0.0 mm well past that is a stuck or blocked gauge reading zero day after
   day, not a fact about the weather, so it is flagged the same way as an
   implausible wettest day rather than presented straight. 90 days gives
   genuine dry spells room without missing the multi-hundred-day cases seen
   in EA's own published series. */
var UK_DRY_SPELL_RECORD_DAYS = 90;
var ZERO_MONTH_MM = 0.5;
// Split rather than one bar scale for all nine: a bar chart sized to a 14 day
// total makes the 1 hour row a sliver regardless of how heavy that hour was.
// Two scopes, each scaled to its own peak, keep both ends legible.
var DURATIONS_SHORT = [
    ['1 hour', 'last1h', 1], ['3 hours', 'last3h', 3], ['6 hours', 'last6h', 6],
    ['12 hours', 'last12h', 12], ['24 hours', 'last24h', 24]
];
var DURATIONS_LONG = [
    ['48 hours', 'last48h', 48], ['72 hours', 'last72h', 72],
    ['7 days', 'last7d', 168], ['14 days', 'last14d', 336]
];
var DURATIONS = DURATIONS_SHORT.concat(DURATIONS_LONG);
// Met Office Alternative Colour Palette — the same breaks/fill/text as
// rain/table.html's accumStyle() (itself lifted from the Flood Forecast
// project's own home.html), so a gauge is coloured the same way here as it is
// in the table, rather than the different teal-to-purple ramp rain/index.html
// uses for its own live radar-style map. One scale for every duration, again
// matching table.html rather than splitting short/long windows.
var ACCUM_BREAKS = [0.03, 1, 5, 10, 20, 40, 60, 80, 100, 120, 140, 160, 180];
var ACCUM_FILL   = ['#3A6CFF','#00FF00','#FFFF95','#FFD563','#FF9618','#E86100','#BA2000','#CC537D','#DB92DC','#FF02FF','#FFFFFF','#C8C8C8','#BFBF00'];
var ACCUM_TEXT   = ['#ffffff','#003300','#333333','#333333','#333333','#ffffff','#ffffff','#ffffff','#333333','#333333','#333333','#333333','#333333'];
var MAP_WINDOWS = [['1h', 'last1h'], ['6h', 'last6h'], ['24h', 'last24h'], ['48h', 'last48h'], ['7d', 'last7d']];

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pad2(n) { return String(n).padStart(2, '0'); }
function dateKeyOf(d) { return d.getUTCFullYear() + pad2(d.getUTCMonth() + 1) + pad2(d.getUTCDate()); }
function isoOf(d) { return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate()); }
function mmText(v, dp) { if (v == null || isNaN(v)) return '&ndash;'; var d = dp == null ? (Math.abs(v) >= 100 ? 0 : 1) : dp; return v.toFixed(d); }
function daysInMonth(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
function monthName(mk) { return MONTH_ABBR[+mk.slice(5, 7) - 1] + ' ' + mk.slice(0, 4); }
function prettyDate(iso) {
    if (!iso) return '';
    var d = new Date(iso + 'T00:00:00Z');
    if (isNaN(d)) return iso;
    return d.getUTCDate() + ' ' + MONTH_ABBR[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
}
function ordinal(n) { var s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function networkOf(s) { return s.source === 'nrw' ? 'NRW' : s.source === 'sepa' ? 'SEPA' : 'EA'; }
function titleCase(s) { return String(s).toLowerCase().replace(/\b[a-z]/g, function(c) { return c.toUpperCase(); }); }
function haversineKm(lat1, lon1, lat2, lon2) {
    var R = 6371, rad = Math.PI / 180;
    var dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

// Point-in-polygon county lookup — the same ray-casting test table.html uses
// for its own county column and filter, kept identical so a gauge's county
// here always agrees with its county there.
function pointInRing(pt, ring) {
    var x = pt[0], y = pt[1], inside = false;
    for (var i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        var xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
        if (((yi > y) !== (yj > y)) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
}
function countyFor(lon, lat, features) {
    var pt = [lon, lat];
    for (var i = 0; i < features.length; i++) {
        var g = features[i].geometry;
        if (!g) continue;
        var polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
        for (var p = 0; p < polys.length; p++) {
            if (pointInRing(pt, polys[p][0])) return features[i].properties.name || features[i].properties.public_name || null;
        }
    }
    return null;
}

// ── Load ──────────────────────────────────────────────────────────────────
if (!ref) {
    document.getElementById('content').innerHTML =
        '<div class="not-found">No gauge specified. <a href="table.html">Back to the gauge table</a></div>';
} else {
    loadAll();
}

function getJson(url) {
    return fetch(url + (url.indexOf('?') < 0 ? '?' : '&') + '_cb=' + Date.now())
        .then(function(r) { if (!r.ok) throw 0; return r.json(); })
        .catch(function() { return null; });
}

function loadAll() {
    Promise.all([
        getJson('stations.json'),
        getJson(R2_CDN + '/rain/summary.json'),
        getJson(R2_CDN + '/rain/climatology/' + encodeURIComponent(ref) + '.json'),
        // EA and SEPA only. climatology_index_nrw.json is built entirely from
        // matched MIDAS stations, so every annual average in it describes a
        // different site — it must not reach the neighbour column, the map
        // popups or the national comparison.
        getJson(R2_CDN + '/rain/climatology_index_ea.json'),
        getJson(R2_CDN + '/rain/climatology_index_sepa.json'),
        // getJson resolves null on any failure rather than rejecting, so the
        // local fallback is chained with .then, not .catch.
        getJson(R2_CDN + '/geo/uk-counties.geojson').then(function(gj) { return gj || getJson('../uk-counties.geojson'); })
    ]).then(function(res) {
        stations = (res[0] && res[0].stations) || {};
        summaryStations = (res[1] && res[1].stations) || {};
        summaryGeneratedAt = (res[1] && res[1].generated_at) || null;
        clim = res[2];
        normalIndex = {};
        [res[3], res[4]].forEach(function(ix) {
            if (ix) Object.keys(ix).forEach(function(k) { normalIndex[k] = ix[k]; });
        });
        var countyFeatures = (res[5] && res[5].features) || [];

        station = stations[ref];
        if (!station) {
            document.getElementById('content').innerHTML = '<div class="not-found">Gauge &ldquo;' + esc(ref) +
                '&rdquo; not found. <a href="table.html">Back to the gauge table</a></div>';
            return;
        }
        countyName = countyFeatures.length ? countyFor(station.lon, station.lat, countyFeatures) : null;
        mode = climatologyMode(clim);
        // Dropped rather than merely unused: with clim null there is no path,
        // now or later, by which another station's numbers reach this page.
        proxyRejected = null;
        if (mode === 'none' && clim && clim.midasSrcId) {
            proxyRejected = {name: clim.midasName || '', srcId: clim.midasSrcId, distKm: clim.matchDistKm};
            clim = null;
        }
        derived = mode === 'none' ? null : deriveClimatology(clim);

        var sum = summaryStations[ref] || {};
        renderSkeleton();
        fillHead(station, sum);
        fillPlace(station);
        fillYear();
        fillExtremes(sum);
        fillLongRecord(sum);
        fillProvenance(station, sum);

        // The duration table, the header figures and the 48 h chart all need
        // the 15-minute readings to tell a reported zero from a gap.
        Promise.all([loadArchive(sum), loadRecentReadings()]).then(function() {
            scanSlotAges();
            fillHead(station, sum);
            fillNow(sum);
            renderRecent();
        });
    });
}

// The rolling archive is UTC-midnight days; used only for the recent daily
// charts and never summed with the 09:00–09:00 climatology series.
function loadArchive(sum) {
    var thisYear = new Date().getUTCFullYear();
    var start = sum.recordsSince ? parseInt(sum.recordsSince.slice(0, 4), 10) : thisYear;
    var years = [];
    for (var y = Math.max(start, thisYear - 1); y <= thisYear; y++) years.push(y);
    return Promise.all(years.map(function(y) {
        return getJson(R2_CDN + '/rain/archive/daily_' + y + '.json').then(function(data) {
            if (data && data[ref]) Object.keys(data[ref]).forEach(function(d) { archiveDays[d] = data[ref][d]; });
        });
    }));
}

// 4 calendar days covers the 72 h tab with room to spare: 72 h back from any
// time of day can touch a 4th distinct UTC date, not just 3.
function loadRecentReadings() {
    var now = new Date();
    return Promise.all([0, 1, 2, 3].map(function(b) {
        var dk = dateKeyOf(new Date(now - b * 86400000));
        return getJson(R2_CDN + '/rain/readings/' + dk + '.json').then(function(data) {
            if (data) rawByDate[dk] = data;
        });
    }));
}

// mm in a 15-minute slot, or null when the gauge reported nothing for it. The
// distinction matters everywhere on this page: a reported 0.0 is a
// measurement, a missing slot is not.
function slotValue(t) {
    var day = rawByDate[dateKeyOf(t)];
    var slot = String(Math.floor((t.getUTCHours() * 60 + t.getUTCMinutes()) / 15));
    var v = day && day.readings && day.readings[ref] && day.readings[ref][slot];
    return typeof v === 'number' ? v : null;
}

// How long ago, in hours, the most recent reported slot is — computed once and
// compared against each duration, rather than rescanning the window per row.
// The test is monotone: if anything arrived within the last hour, every longer
// window contains data too.
var newestSlotAgeH = null;
function scanSlotAges() {
    newestSlotAgeH = null;
    for (var back = 0; back < 48 * 4; back++) {
        if (slotValue(new Date(Date.now() - back * 900000)) != null) {
            newestSlotAgeH = back / 4;
            return;
        }
    }
}
// True when this duration's window contains at least one reported slot. Only
// durations inside the 48 h of 15-minute readings held here can be checked;
// anything longer is reported as published.
function windowHasData(hours) {
    if (!Object.keys(rawByDate).length || hours > 48) return true;
    return newestSlotAgeH != null && newestSlotAgeH < hours;
}

// SEPA only reports hourly, one value on the hour (fetch_rain.py's
// fetch_sepa_data stores that hour's total directly, not a 15-minute
// fraction of it). Treating the three empty quarter-slots between each hour
// as "no reading received" would draw a gap tick three times an hour, every
// hour, forever, and multiplying an hourly total by 4 to fake a "mm/h rate"
// quadruples it. Both need a different code path from EA/NRW's genuine
// 15-minute telemetry.
function isSepaGauge() { return ref.indexOf('sepa_') === 0; }

function latestReading() {
    var now = new Date();
    for (var back = 0; back < 12; back++) {
        var t = new Date(now - back * 900000);
        var v = slotValue(t);
        if (v != null) return {t: t, mm: v};
    }
    return null;
}

// ── Climatology mode & derived statistics ────────────────────────────────
// Nothing on this page is drawn from another station. build_nrw_climatology.py
// fills the NRW gap by matching each gauge to its nearest Met Office MIDAS
// station and stamps midasSrcId on the result; that is a different instrument
// at a different site, however close, so it is refused outright rather than
// presented as this gauge's record. A site with no record of its own says so.
function climatologyMode(c) {
    if (!c || !c.monthly || !Object.keys(c.monthly).length) return 'none';
    if (c.midasSrcId) return 'none';
    var end = new Date(c.recordEnd + 'T00:00:00Z');
    if (isNaN(end)) return 'historic';
    return (Date.now() - end.getTime()) / 86400000 <= STALE_RECORD_DAYS ? 'live' : 'historic';
}

function deriveClimatology(c) {
    var monthly = c.monthly || {}, counts = c.monthDayCounts || {}, norms = c.climatology || {};
    var todayKey = new Date().toISOString().slice(0, 7);

    function complete(mk) {
        if (mk >= todayKey) return false;
        var y = +mk.slice(0, 4), m = +mk.slice(5, 7);
        var n = counts[mk];
        return n == null ? true : (n / daysInMonth(y, m)) >= MONTH_COMPLETENESS;
    }

    var years = {};
    Object.keys(monthly).sort().forEach(function(mk) {
        var y = mk.slice(0, 4), m = +mk.slice(5, 7);
        if (!years[y]) years[y] = {months: {}, complete: {}};
        years[y].months[m] = monthly[mk];
        years[y].complete[m] = complete(mk);
    });
    var yearKeys = Object.keys(years).sort();
    yearKeys.forEach(function(y) {
        var rec = years[y], n = 0, total = 0, full = true;
        for (var m = 1; m <= 12; m++) {
            if (rec.months[m] == null) { full = false; continue; }
            total += rec.months[m];
            if (rec.complete[m]) n++; else full = false;
        }
        rec.total = total;
        rec.fullYear = full && n === 12;
        rec.monthsPresent = Object.keys(rec.months).length;
    });

    var fullYears = yearKeys.filter(function(y) { return years[y].fullYear; });
    var annualNormal = fullYears.length
        ? fullYears.reduce(function(a, y) { return a + years[y].total; }, 0) / fullYears.length
        : null;

    var wettestYear = null, driestYear = null;
    fullYears.forEach(function(y) {
        if (!wettestYear || years[y].total > years[wettestYear].total) wettestYear = y;
        if (!driestYear || years[y].total < years[driestYear].total) driestYear = y;
    });

    var topMonths = Object.keys(monthly).filter(complete)
        .sort(function(a, b) { return monthly[b] - monthly[a]; }).slice(0, 6)
        .map(function(mk) { return {month: mk, mm: monthly[mk]}; });

    // Year to date over the longest run of complete months Jan..M in the
    // latest year of record, so every prior year is compared over the same
    // calendar window rather than against a full-year normal.
    var latestYear = yearKeys[yearKeys.length - 1];
    var ytd = null;
    if (latestYear) {
        var through = 0;
        for (var m = 1; m <= 12; m++) {
            if (years[latestYear].months[m] != null && years[latestYear].complete[m]) through = m; else break;
        }
        if (through >= 1) {
            var sameWindow = [];
            yearKeys.forEach(function(y) {
                var ok = true, t = 0;
                for (var k = 1; k <= through; k++) {
                    if (years[y].months[k] == null || !years[y].complete[k]) { ok = false; break; }
                    t += years[y].months[k];
                }
                if (ok) sameWindow.push({year: y, mm: t});
            });
            var mine = sameWindow.filter(function(r) { return r.year === latestYear; })[0];
            if (mine && sameWindow.length >= 3) {
                var sorted = sameWindow.slice().sort(function(a, b) { return a.mm - b.mm; });
                var rankDriest = sorted.findIndex(function(r) { return r.year === latestYear; }) + 1;
                var mean = sameWindow.reduce(function(a, r) { return a + r.mm; }, 0) / sameWindow.length;
                ytd = {
                    year: latestYear, through: through, mm: mine.mm, mean: mean,
                    pct: mean > 0 ? (mine.mm / mean) * 100 : null,
                    rankDriest: rankDriest, rankWettest: sameWindow.length - rankDriest + 1,
                    n: sameWindow.length,
                    // An en-dash character, not an entity: this label also
                    // reaches tooltip and title contexts that take plain text.
                    label: 'Jan' + (through > 1 ? '–' + MONTH_ABBR[through - 1] : '')
                };
            }
        }
    }

    // Percentiles of the *cumulative* series across complete years, not a
    // running sum of monthly percentiles (which assumes every month lands at
    // the same percentile together and comes out far too narrow). Index 0 is
    // 1 January, so the curve starts from zero rather than mid-air.
    // Cumulative rainfall is right-skewed — bounded below by zero/dry years,
    // stretched above by the occasional very wet one — so the median sits
    // well below the middle of the P10-P90 band (confirmed on real stations:
    // by December the median typically sits 25-30% of the way up the band,
    // not 50%). That is a genuine property of the distribution, not a
    // computation error, but it reads as a mistake next to a band that looks
    // like it should be symmetric. The mean does not have that problem — it
    // is pulled toward the band's centre by the same wet years that stretch
    // the top of it — and it is also the figure already shown alongside this
    // chart as "average full year", so one dashed line means the same thing
    // in both places instead of two different kinds of "average".
    var envelope = null;
    if (fullYears.length >= 5) {
        var p10 = [0], p90 = [0], pmean = [0];
        for (var mm = 1; mm <= 12; mm++) {
            var vals = fullYears.map(function(y) {
                var t = 0;
                for (var k = 1; k <= mm; k++) t += years[y].months[k];
                return t;
            }).sort(function(a, b) { return a - b; });
            p10.push(percentile(vals, 0.10));
            p90.push(percentile(vals, 0.90));
            pmean.push(vals.reduce(function(a, b) { return a + b; }, 0) / vals.length);
        }
        var cur = [0], run = 0, ok = true;
        for (var m2 = 1; m2 <= 12; m2++) {
            var v = years[latestYear].months[m2];
            if (v == null || !ok) { cur.push(null); ok = false; continue; }
            run += v;
            cur.push(run);
        }
        envelope = {p10: p10, p90: p90, mean: pmean, current: cur, year: latestYear, nYears: fullYears.length};
    }

    return {
        monthly: monthly, norms: norms, years: years, yearKeys: yearKeys,
        isComplete: complete, fullYears: fullYears, annualNormal: annualNormal,
        wettestYear: wettestYear, driestYear: driestYear, topMonths: topMonths,
        ytd: ytd, envelope: envelope
    };
}

function percentile(sorted, p) {
    if (!sorted.length) return null;
    if (sorted.length === 1) return sorted[0];
    var k = (sorted.length - 1) * p, lo = Math.floor(k), hi = Math.min(lo + 1, sorted.length - 1);
    return sorted[lo] + (sorted[hi] - sorted[lo]) * (k - lo);
}

// One departure test, so bar colours, the cumulative fill, the heatmap and the
// stat rail all agree on what counts as wetter or drier than average.
function departure(v, mean, tol) {
    if (v == null || !mean || mean <= 0) return '';
    var r = v / mean;
    if (r >= 1 + tol) return 'wet';
    if (r <= 1 - tol) return 'dry';
    return '';
}

// ── Header ───────────────────────────────────────────────────────────────
function fillHead(s, sum) {
    document.title = s.name + ' | Flood Forecast';
    document.getElementById('pageTitle').textContent = s.name + ' | Flood Forecast';

    // Network and county as a pair of pills — identity, not detail. Position
    // is still exact in the provenance table below; a truncated 4dp chip up
    // here just repeated it without earning the space.
    var facts = ['<span class="pill">' + networkOf(s) + '</span>'];
    if (countyName) facts.push('<span class="pill">' + esc(countyName) + '</span>');
    facts.push('<span class="sep">&middot;</span><span class="mono">' + esc(ref) + '</span>');
    if (mode !== 'none') {
        facts.push('<span class="sep">&middot;</span>' + (mode === 'live' ? 'Record ' : 'Historic record ')
            + clim.recordStart.slice(0, 4) + '&ndash;' + clim.recordEnd.slice(0, 4) + ' (' + clim.recordYears + ' yr)');
    } else if (sum.recordsSince) {
        facts.push('<span class="sep">&middot;</span>Tracked since ' + prettyDate(sum.recordsSince));
    }

    var haveSlots = Object.keys(rawByDate).length > 0;
    var sepa = isSepaGauge();
    var latest = latestReading();
    var figures = [latest
        ? (sepa
            ? {v: mmText(latest.mm, 1) + '<span class="u">mm</span>', nil: latest.mm === 0,
               l: pad2(latest.t.getUTCHours()) + ':00 UTC hour'}
            : {v: mmText(latest.mm * 4, 1) + '<span class="u">mm/h</span>', nil: latest.mm === 0,
               l: 'Rate at ' + pad2(latest.t.getUTCHours()) + ':' + pad2(latest.t.getUTCMinutes()) + ' UTC'})
        : {v: haveSlots ? 'No data' : '&ndash;', nil: true, absent: haveSlots,
           l: sepa ? 'Latest hourly total' : 'Latest 15 minute rate'}];
    [['last1h', '1 hour', 1], ['last24h', '24 hours', 24], ['last7d', '7 days', 168]].forEach(function(d) {
        figures.push(windowHasData(d[2])
            ? {v: mmText(sum[d[0]]) + '<span class="u">mm</span>', nil: !sum[d[0]], l: d[1]}
            : {v: 'No data', nil: true, absent: true, l: d[1]});
    });

    document.getElementById('headRegion').innerHTML = ''
        + '<div class="gauge-head">'
        +   '<div><h1>' + esc(s.name) + '</h1><div class="head-facts">' + facts.join(' ') + '</div></div>'
        +   '<div class="head-figures">'
        +     figures.map(function(f) {
                  return '<div class="figure"><div class="fv' + (f.nil ? ' nil' : '') + (f.absent ? ' absent' : '') + '">'
                      + f.v + '</div><div class="fl">' + f.l + '</div></div>';
              }).join('')
        +     '<div class="head-aside">'
        +       '<button class="btn" onclick="loadAll()"><span class="material-icons" style="font-size:13px;">refresh</span>Refresh</button>'
        +       '<div class="stamp">' + (summaryGeneratedAt
                    ? 'Totals ' + new Date(summaryGeneratedAt).toISOString().slice(11, 16) + ' UTC'
                    : 'Awaiting totals') + '</div>'
        +     '</div>'
        +   '</div>'
        + '</div>';
}

// ── Rainfall to now ──────────────────────────────────────────────────────
// A duration whose window contains no reported slots says so instead of
// showing a total of 0.0. Short and long durations are shown one scope at a
// time, each scaled to its own peak — a bar chart spanning 1 hour to 14 days
// makes the short end unreadable regardless of how heavy that hour was.
function fillNow(sum) {
    lastSummary = sum;
    var list = durationScope === 'short' ? DURATIONS_SHORT : DURATIONS_LONG;
    document.getElementById('nowTabs').innerHTML = [['short', 'Up to 24h'], ['long', '48h+']].map(function(t) {
        return '<button class="' + (durationScope === t[0] ? 'active' : '') + '" onclick="setDurationScope(\''
            + t[0] + '\')">' + t[1] + '</button>';
    }).join('');

    var rows = list.map(function(d) {
        return {label: d[0], v: sum[d[1]], known: windowHasData(d[2])};
    });
    var peak = rows.reduce(function(a, r) { return Math.max(a, r.known && r.v ? r.v : 0); }, 0);

    var body = rows.map(function(r) {
        if (!r.known) {
            return '<tr><td>' + r.label + '</td><td class="nil">No data</td>'
                + '<td class="bar-cell"><div class="bar-track"></div></td></tr>';
        }
        var bar = peak > 0 && r.v > 0
            ? '<div class="bar-fill" style="width:' + Math.max(1, Math.round((r.v / peak) * 100)) + '%"></div>'
            : '<div class="bar-fill zero" title="Measured, no rainfall"></div>';
        return '<tr><td>' + r.label + '</td><td class="num">' + mmText(r.v) + '</td>'
            + '<td class="bar-cell"><div class="bar-track">' + bar + '</div></td></tr>';
    }).join('');

    var context = [];
    var now = new Date();
    var monthNorm = mode === 'live' && derived && derived.norms[pad2(now.getUTCMonth() + 1)];
    var recSince = sum.recordsSince ? new Date(sum.recordsSince + 'T00:00:00Z') : null;
    var monthStart = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1));
    var monthTruncated = recSince && recSince > monthStart;
    // A month-to-date of 0.0 mm from a gauge that has sent nothing all month is
    // not a measurement. The rolling archive says how many of this month's days
    // are actually held; today's is allowed to be missing, since it is still
    // accumulating.
    var elapsed = now.getUTCDate(), held = 0;
    for (var dd = 1; dd <= elapsed; dd++) {
        if (archiveDays[isoOf(new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), dd)))] != null) held++;
    }
    var monthCovered = held >= elapsed - 1;
    if (sum.monthTotal != null) {
        context.push(held === 0
            ? {v: 'No data', l: MONTH_ABBR[now.getUTCMonth()] + ' to date, no days held', cls: 'nil'}
            : {v: mmText(sum.monthTotal, 1) + ' mm',
               l: MONTH_ABBR[now.getUTCMonth()] + ' to date'
                   + (monthTruncated ? ' (from ' + prettyDate(sum.recordsSince) + ')'
                      : monthCovered ? '' : ' (' + held + ' of ' + elapsed + ' days held)'), cls: ''});
    }
    // Month to date against this calendar month's average. The live total is
    // built on UTC-midnight days and the average on 09:00–09:00 days, so this
    // is a close guide rather than an exact like-for-like; and it is only
    // called wet or dry against the share of the month elapsed.
    // Only worth a percentage when the month's days are actually all there —
    // otherwise the figure reads dry purely for the missing days.
    if (monthNorm && !monthTruncated && monthCovered && held > 0) {
        var pct = monthNorm.mean > 0 ? (sum.monthTotal / monthNorm.mean) * 100 : null;
        var frac = now.getUTCDate() / daysInMonth(now.getUTCFullYear(), now.getUTCMonth() + 1);
        context.push({
            v: pct == null ? '&ndash;' : Math.round(pct) + '%',
            l: 'of the whole-' + MONTH_ABBR[now.getUTCMonth()] + ' average (' + mmText(monthNorm.mean, 0)
                + ' mm), ' + Math.round(frac * 100) + '% through the month',
            cls: departure(sum.monthTotal, monthNorm.mean * frac, 0.15)
        });
    }
    if (derived && derived.ytd && +derived.ytd.year === now.getUTCFullYear()) {
        context.push({v: Math.round(derived.ytd.pct) + '%',
            l: 'of average for ' + derived.ytd.label + ' ' + derived.ytd.year,
            cls: departure(derived.ytd.mm, derived.ytd.mean, 0.05)});
    }

    document.getElementById('nowHint').innerHTML = sum.completeness != null
        ? Math.round(sum.completeness * 100) + '% of expected readings received in 24 h' : '';
    document.getElementById('nowRegion').innerHTML = ''
        + '<table class="data"><thead><tr><th>Ending now</th><th>Total</th><th></th></tr></thead>'
        + '<tbody>' + body + '</tbody></table>'
        + (context.length
            ? '<div class="rail rail-top">' + context.map(function(c) {
                    return '<div class="item"><div class="rv ' + c.cls + '">' + c.v + '</div><div class="rl">' + c.l + '</div></div>';
                }).join('') + '</div>'
            : '')
        + '<div class="note" style="margin-top:0.7rem">Bars are drawn against the largest accumulation in this scope, so short '
        + 'and long durations each get a scale that fits them; a hairline means the gauge reported and measured no rain. '
        + 'Durations beyond 48 hours cannot be checked for gaps against the 15 minute readings held here, so they are shown as '
        + 'published.</div>';
}
function setDurationScope(s) { durationScope = s; fillNow(lastSummary); }

// ── Map: the /rain gauge map's markers, scale and behaviour ──────────────
function fillPlace(s) {
    var neighbours = Object.keys(stations)
        .filter(function(id) { return id !== ref && stations[id].lat != null; })
        .map(function(id) {
            var o = stations[id];
            return {id: id, name: o.name, dist: haversineKm(s.lat, s.lon, o.lat, o.lon)};
        })
        .sort(function(a, b) { return a.dist - b.dist; })
        .slice(0, 10);

    document.getElementById('placeRegion').innerHTML = ''
        + '<div id="gaugeMap"></div>'
        + '<div class="map-bar">'
        +   '<div class="tabs" id="mapTabs">' + MAP_WINDOWS.map(function(w) {
                return '<button class="' + (mapWindow === w[0] ? 'active' : '') + '" onclick="setMapWindow(\''
                    + w[0] + '\')">' + w[0] + '</button>';
            }).join('') + '</div>'
        +   '<div id="mapScale"></div>'
        + '</div>'
        + '<div class="nb-head"><span>Nearest gauges</span><span id="nbCol">' + mapWindow + '</span><span>Annual avg</span></div>'
        + '<div id="nbList"></div>';

    drawMap(s);
    renderMapScale();
    renderNeighbourList(neighbours);
