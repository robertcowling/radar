function renderMapScale() {
    document.getElementById('mapScale').innerHTML = ''
        + '<div><div class="scale-cap">mm in ' + mapWindow + '</div><div class="scale-row">'
        +   '<span class="sc" style="background:#eef1f3;border:1px solid var(--border-color)" title="Measured, dry"></span>'
        +   ACCUM_FILL.map(function(c) { return '<span class="sc" style="background:' + c + '"></span>'; }).join('')
        + '</div><div class="scale-labels"><span>0</span>'
        +   ACCUM_BREAKS.map(function(b) { return '<span>' + b + '</span>'; }).join('')
        + '</div></div>';
}

// Style for one gauge's accumulation: a faded dot for nothing received, a
// muted full-size marker for measured-and-dry, colour by break otherwise —
// same three-way split as rain/index.html's getAccumStyle, but the colour
// bands are table.html's Met Office Alternative Palette, per ACCUM_BREAKS.
function accumStyle(val, hasData) {
    if (!hasData || val == null) return {cls: 'rg-nodata', bg: '', fg: '', label: ''};
    if (val < 0.05) return {cls: 'rg-dry', bg: '', fg: '', label: '0'};
    var i = 0;
    for (var k = 0; k < ACCUM_BREAKS.length; k++) { if (val >= ACCUM_BREAKS[k]) i = k; else break; }
    return {cls: '', bg: ACCUM_FILL[i], fg: ACCUM_TEXT[i], label: val < 10 ? val.toFixed(1) : String(Math.round(val))};
}

// summary.json holds no nulls, so a gauge that has sent nothing still reads
// 0.0. "Zero with no readings received in 24 h" is what identifies it, and
// that is shown as unknown rather than as a dry measurement.
function windowValue(id, win) {
    var key = MAP_WINDOWS.filter(function(w) { return w[0] === win; })[0][1];
    var sum = summaryStations[id];
    if (!sum) return {v: null, hasData: false};
    var v = sum[key];
    if (sum.completeness === 0 && (v == null || v < 0.05)) return {v: null, hasData: false};
    return {v: v, hasData: v != null};
}

var mapInstance = null, mapMarkers = {};
// Default zoom for a gauge with no saved preference: wide enough to place
// the gauge in its surroundings, not a tight crop on one pin.
var DEFAULT_MAP_ZOOM = 9;
var MAP_ZOOM_KEY = 'gaugeMapZoom';

function savedMapZoom() {
    try {
        var v = localStorage.getItem(MAP_ZOOM_KEY);
        return v == null ? null : +v;
    } catch (e) { return null; }
}

function drawMap(s) {
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (mapInstance) { mapInstance.remove(); mapInstance = null; mapMarkers = {}; }
    // The centre always follows the gauge whose page this is; the zoom level
    // is the one thing that carries over from gauge to gauge, so zooming out
    // to see a wider area once doesn't reset itself on the very next click.
    var startZoom = savedMapZoom();
    if (startZoom == null || isNaN(startZoom)) startZoom = DEFAULT_MAP_ZOOM;
    var map = L.map('gaugeMap', {scrollWheelZoom: false, touchZoom: true}).setView([s.lat, s.lon], startZoom);
    mapInstance = map;
    // CARTO Voyager / Dark Matter — the basemaps the radar viewer and the
    // /rain gauge map already use (index.html:1075, rain/index.html:566).
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/' + (dark ? 'dark_all' : 'voyager') + '/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap, &copy; CARTO', subdomains: 'abcd', maxZoom: 19
    }).addTo(map);

    // Every gauge in the network, not a hand-picked radius: the same markers
    // as /rain, and any one of them opens its own page.
    var layer = L.layerGroup().addTo(map);
    Object.keys(stations).forEach(function(id) {
        var o = stations[id];
        if (!o || o.lat == null || o.lon == null) return;
        var m = L.marker([o.lat, o.lon], {
            icon: L.divIcon({className: '', html: '<div class="rg-wrap"><div class="rg-icon rg-nodata"></div></div>',
                iconSize: [20, 20], iconAnchor: [10, 10]}),
            zIndexOffset: id === ref ? 1000 : 0
        });
        m.bindPopup('', {className: 'gauge-popup', maxWidth: 260});
        m.on('click', function() { m.setPopupContent(popupFor(id)); });
        mapMarkers[id] = m;
        layer.addLayer(m);
    });

    map.on('zoomend', function() {
        try { localStorage.setItem(MAP_ZOOM_KEY, map.getZoom()); } catch (e) {}
    });
    refreshMapMarkers();
}

function refreshMapMarkers() {
    Object.keys(mapMarkers).forEach(function(id) {
        var el = mapMarkers[id].getElement();
        if (!el) return;
        var div = el.querySelector('.rg-icon');
        if (!div) return;
        var wv = windowValue(id, mapWindow);
        var st = accumStyle(wv.v, wv.hasData);
        div.className = 'rg-icon ' + st.cls + (id === ref ? ' rg-self' : '');
        div.style.background = st.bg;
        div.style.color = st.fg;
        div.textContent = st.label;
        el.title = stations[id].name + ', ' + (wv.hasData ? mmText(wv.v, 1) + ' mm in ' + mapWindow
            : 'no readings in ' + mapWindow);
    });
    var nb = document.getElementById('nbCol');
    if (nb) nb.textContent = mapWindow;
    renderNeighbourList(null);
}

function popupFor(id) {
    var o = stations[id], wv = windowValue(id, mapWindow);
    var norm = normalIndex[id] && normalIndex[id].annualNormal;
    var dist = station ? haversineKm(station.lat, station.lon, o.lat, o.lon) : 0;
    var stats = [{v: wv.hasData ? mmText(wv.v, 1) : null, l: mapWindow, nil: !wv.hasData}];
    if (norm) stats.push({v: mmText(norm, 0), l: 'annual avg'});
    var name = id === ref
        ? '<div class="pop-name">' + esc(o.name) + '</div>'
        : '<a class="pop-name pop-name-link" href="gauge.html?ref=' + encodeURIComponent(id) + '">' + esc(o.name) + '</a>';
    return name
        + '<div class="pop-sub">' + networkOf(o)
            + (id === ref ? ' <span class="pill">This gauge</span>' : ' &middot; ' + dist.toFixed(1) + ' km away') + '</div>'
        + '<div class="pop-stats">' + stats.map(function(s) {
              return '<div class="pop-stat"><div class="pv' + (s.nil ? ' nil' : '') + '">'
                  + (s.nil ? 'No data' : s.v + '<span class="u">mm</span>') + '</div><div class="pl">' + s.l + '</div></div>';
          }).join('') + '</div>';
}

var neighbourCache = null;
function renderNeighbourList(list) {
    if (list) neighbourCache = list;
    var el = document.getElementById('nbList');
    if (!el || !neighbourCache) return;
    el.innerHTML = neighbourCache.length
        ? neighbourCache.map(function(o) {
              var wv = windowValue(o.id, mapWindow);
              var norm = normalIndex[o.id] && normalIndex[o.id].annualNormal;
              return '<a class="nb-row" href="gauge.html?ref=' + encodeURIComponent(o.id) + '">'
                  + '<span class="nm">' + esc(o.name) + ' <span class="d">' + o.dist.toFixed(1) + ' km</span></span>'
                  + (wv.hasData ? '<span class="v">' + mmText(wv.v, 1) + '</span>' : '<span class="v nil">no data</span>')
                  + '<span class="n">' + (norm ? Math.round(norm) + ' mm' : '&ndash;') + '</span></a>';
          }).join('')
        : '<div class="empty" style="padding:0.5rem 1.05rem">No other gauges found.</div>';
}

function setMapWindow(w) {
    mapWindow = w;
    var tabs = document.getElementById('mapTabs');
    if (tabs) Array.prototype.forEach.call(tabs.children, function(b) { b.className = b.textContent === w ? 'active' : ''; });
    renderMapScale();
    refreshMapMarkers();
}

// ── Chart plumbing ───────────────────────────────────────────────────────
function chartTheme() {
    return {
        ink: cssVar('--text-main'), text: cssVar('--text-muted'), grid: cssVar('--border-color'),
        gridStrong: cssVar('--border-strong'), surface: cssVar('--bg-surface'), inset: cssVar('--bg-inset'),
        muted: cssVar('--text-dark'), nodata: cssVar('--nodata'),
        wet: cssVar('--wet'), wetStrong: cssVar('--wet-strong'), wetFill: cssVar('--wet-fill'),
        dry: cssVar('--dry'), dryFill: cssVar('--dry-fill'),
        brand: cssVar('--brand-500'), tint: cssVar('--brand-tint'),
        font: "'Roboto', -apple-system, BlinkMacSystemFont, sans-serif"
    };
}

// Same rounding the /rain hyetograph uses, so a y axis here looks like a y
// axis there. Needed up front because the measured-zero and gap marks are
// drawn as a fraction of the axis rather than as data.
function niceMax(m) {
    if (!(m > 0)) return 1;
    if (m < 0.5) return 1;
    if (m < 1) return 2;
    if (m < 4) return 5;
    if (m < 9) return 10;
    if (m < 19) return 20;
    return Math.ceil(m * 1.15 / 10) * 10;
}

var charts = {};
function mountChart(id, config) {
    if (charts[id]) { charts[id].destroy(); delete charts[id]; }
    var el = document.getElementById(id);
    if (el) charts[id] = new Chart(el.getContext('2d'), config);
}

function tooltipOpts(t, titleFn, labelFn) {
    return {
        backgroundColor: t.surface, titleColor: t.ink, bodyColor: t.text, borderColor: t.grid, borderWidth: 1,
        padding: 9, cornerRadius: 6, displayColors: false,
        titleFont: {family: t.font, size: 11, weight: '600'}, bodyFont: {family: t.font, size: 12},
        callbacks: {title: titleFn, label: labelFn}
    };
}

// A bar chart where the reader can tell a measured zero from a gap: positive
// values are bars, measured zeros are a stub sitting on the baseline, and
// missing readings hang below it as a grey tick. Boundary points (midnight,
// the first of a month, January) carry a vertical rule.
function barChart(id, points, opts) {
    var t = chartTheme();
    var maxVal = points.reduce(function(a, p) { return Math.max(a, p.v == null ? 0 : p.v); }, 0);
    var yMax = niceMax(maxVal);
    var stub = yMax * 0.014;
    var gapDepth = yMax * 0.055;
    var anyGap = points.some(function(p) { return p.v == null; });
    var anyZero = points.some(function(p) { return p.v === 0; });
    var tol = opts.tol || 0.25;

    var colours = points.map(function(p) {
        if (!opts.colourByNorm || p.norm == null) return t.wet;
        var d = departure(p.v, p.norm, tol);
        return d === 'wet' ? t.wetStrong : d === 'dry' ? t.dry : t.brand;
    });
    var bar = {maxBarThickness: opts.barMax || 26, categoryPercentage: 0.96, barPercentage: 0.94, borderSkipped: false};

    var datasets = [
        // minBarLength keeps a light shower visible when the axis is scaled to
        // a downpour: at a 30 mm axis a 0.2 mm bar is a pixel and a half, less
        // than the measured-zero stub beside it. Colour still separates the
        // two, and the tooltip carries the exact value.
        Object.assign({label: 'Rainfall', order: 2, borderRadius: 2, backgroundColor: colours, minBarLength: 3,
            data: points.map(function(p) { return p.v == null || p.v === 0 ? null : p.v; })}, bar),
        Object.assign({label: 'Measured dry', order: 3, borderRadius: 0, backgroundColor: t.muted,
            data: points.map(function(p) { return p.v === 0 ? stub : null; })}, bar),
        Object.assign({label: 'No reading', order: 4, borderRadius: 0, backgroundColor: t.nodata,
            data: points.map(function(p) { return p.v == null ? -gapDepth : null; })}, bar)
    ];
    var hasNorm = points.some(function(p) { return p.norm != null; });
    if (opts.normLine && hasNorm) {
        datasets.push({type: 'line', label: 'Average', order: 1,
            data: points.map(function(p) { return p.norm; }),
            borderColor: t.muted, borderWidth: 2, borderDash: [4, 4], pointRadius: 0, spanGaps: true, tension: 0});
    }

    mountChart(id, {
        type: 'bar',
        data: {labels: points.map(function(p) { return p.tick; }), datasets: datasets},
        options: {
            responsive: true, maintainAspectRatio: false, animation: {duration: 200},
            interaction: {mode: 'index', intersect: false},
            scales: {
                x: {
                    ticks: {color: t.text, font: {family: t.font, size: 10}, autoSkip: false, maxRotation: 0,
                        callback: function(v, i) { return points[i] ? points[i].tick : ''; }},
                    grid: {display: true, drawTicks: false,
                        color: function(c) { return points[c.index] && points[c.index].boundary ? t.gridStrong : 'transparent'; }},
                    border: {color: t.grid}
                },
                y: {
                    min: anyGap ? -gapDepth : 0, max: yMax,
                    ticks: {color: t.text, font: {family: t.font, size: 10},
                        callback: function(v) { return v < 0 ? '' : v; }},
                    grid: {color: function(c) { return c.tick.value === 0 ? t.gridStrong : t.grid; }, drawTicks: false},
                    border: {display: false},
                    title: {display: true, text: opts.yTitle, color: t.text, font: {family: t.font, size: 10}}
                }
            },
            plugins: {
                legend: {display: false},
                tooltip: tooltipOpts(t,
                    function(items) { return points[items[0].dataIndex].label; },
                    function(item) {
                        var p = points[item.dataIndex];
                        if (item.datasetIndex === 2) return null;   // gap mark, covered by the line below
                        if (item.datasetIndex === 1) return 'Measured, no rain';
                        if (item.datasetIndex === 3) return 'Average ' + mmText(p.norm, 0) + ' mm';
                        if (p.v == null) return 'No reading received';
                        var line = mmText(p.v, 1) + ' mm';
                        if (p.norm != null && p.norm > 0) {
                            line += '  ·  ' + Math.round((p.v / p.norm) * 100) + '% of the ' + mmText(p.norm, 0) + ' mm average';
                        }
                        return line;
                    })
            }
        }
    });

    var keys = [];
    if (opts.colourByNorm && hasNorm) {
        keys.push('<span class="key"><span class="sw" style="background:' + t.wetStrong + '"></span>Above '
            + Math.round((1 + tol) * 100) + '% of average</span>');
        keys.push('<span class="key"><span class="sw" style="background:' + t.brand + '"></span>Within a quarter of average</span>');
        keys.push('<span class="key"><span class="sw" style="background:' + t.dry + '"></span>Below '
            + Math.round((1 - tol) * 100) + '% of average</span>');
    } else {
        keys.push('<span class="key"><span class="sw" style="background:' + t.wet + '"></span>Rainfall</span>');
    }
    if (opts.normLine && hasNorm) keys.push('<span class="key"><span class="sw dash"></span>Average for that month</span>');
    if (anyZero) keys.push('<span class="key"><span class="sw tick"></span>Measured, no rain</span>');
    if (anyGap) keys.push('<span class="key"><span class="sw gap"></span>No reading, marked below the axis</span>');
    return '<div class="legend">' + keys.join('') + '</div>';
}

// ── Recent rainfall ──────────────────────────────────────────────────────
function points15min(hours) {
    var out = [];
    // SEPA has one real value an hour; sampling on the hour rather than every
    // quarter avoids drawing the three slots between each report as gaps.
    if (isSepaGauge()) {
        var endH = new Date(Math.floor(Date.now() / 3600000) * 3600000);
        for (var backH = hours - 1; backH >= 0; backH--) {
            var th = new Date(endH - backH * 3600000);
            var hh = th.getUTCHours();
            var midnightH = hh === 0;
            out.push({
                v: slotValue(th),
                boundary: midnightH,
                tick: midnightH ? DAY_ABBR[th.getUTCDay()] : (hh % 6 === 0 ? pad2(hh) : ''),
                label: DAY_ABBR[th.getUTCDay()] + ' ' + th.getUTCDate() + ' ' + MONTH_ABBR[th.getUTCMonth()]
                    + ', ' + pad2(hh) + ':00 UTC'
            });
        }
        return out;
    }
    // Anchored to the last completed 15-minute slot, so the final bar is never
    // a partly elapsed interval.
    var end = new Date(Math.floor(Date.now() / 900000) * 900000);
    for (var back = hours * 4 - 1; back >= 0; back--) {
        var t = new Date(end - back * 900000);
        var h = t.getUTCHours(), m = t.getUTCMinutes();
        var midnight = h === 0 && m === 0;
        out.push({
            v: slotValue(t),
            boundary: midnight,
            tick: midnight ? DAY_ABBR[t.getUTCDay()] : (m === 0 && h % 6 === 0 ? pad2(h) : ''),
            label: DAY_ABBR[t.getUTCDay()] + ' ' + t.getUTCDate() + ' ' + MONTH_ABBR[t.getUTCMonth()]
                + ', ' + pad2(h) + ':' + pad2(m) + ' UTC'
        });
    }
    return out;
}

function pointsDaily(nDays) {
    var out = [], now = new Date();
    // A 7-day window has room to label every day; 30/90 day windows don't.
    var step = nDays <= 10 ? 1 : nDays <= 31 ? 5 : 10;
    for (var back = nDays - 1; back >= 0; back--) {
        var t = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() - back));
        var key = isoOf(t), dom = t.getUTCDate(), first = dom === 1;
        out.push({
            // A day absent from the archive is a gap, not a dry day.
            v: archiveDays[key] == null ? null : archiveDays[key],
            boundary: first,
            tick: first ? MONTH_ABBR[t.getUTCMonth()]
                : (step === 1 ? DAY_ABBR[t.getUTCDay()] : (dom % step === 0 ? String(dom) : '')),
            label: DAY_ABBR[t.getUTCDay()] + ' ' + prettyDate(key)
        });
    }
    return out;
}

// Monthly totals. Prefers the deep series — the same day convention as the
// averages drawn over it — and falls back to the rolling archive.
function pointsMonthly(nMonths) {
    var deep = mode !== 'none' && derived;
    var src = deep ? derived.monthly : null;
    if (!src) {
        src = {};
        Object.keys(archiveDays).forEach(function(d) {
            var mk = d.slice(0, 7);
            src[mk] = (src[mk] || 0) + archiveDays[d];
        });
    }
    var keys = Object.keys(src).sort().slice(-nMonths);
    if (!keys.length) return [];
    // Walk the calendar rather than the key list, so a month missing from the
    // record leaves a gap instead of silently closing up.
    var out = [], y = +keys[0].slice(0, 4), m = +keys[0].slice(5, 7), end = keys[keys.length - 1];
    var cur = keys[0];
    while (cur <= end) {
        var norm = deep ? derived.norms[pad2(m)] : null;
        var partial = deep && src[cur] != null && !derived.isComplete(cur);
        out.push({
            v: src[cur] == null ? null : src[cur],
            // An incomplete month is never coloured or judged against an
            // average — it would read as dry purely for being unfinished.
            norm: norm && !partial ? norm.mean : null,
            boundary: m === 1,
            // Quarterly labels: enough to locate any bar by eye without the
            // axis turning into a wall of month names.
            tick: m === 1 ? "Jan '" + cur.slice(2, 4) : (m % 3 === 1 ? MONTH_ABBR[m - 1] : ''),
            label: monthName(cur) + (partial ? ' (incomplete month)' : '')
        });
        m++; if (m > 12) { m = 1; y++; }
        cur = y + '-' + pad2(m);
    }
    return out;
}

// 15-minute resolution up to 72 h; a week and beyond switches to daily bars —
// 7 days at 15-minute resolution is 672 bars, finer than anyone reads at a
// glance, and daily is what the 30/90 day tabs already use.
var HOUR_TABS = {'24h': 24, '48h': 48, '72h': 72};

function renderRecent() {
    var tabs = ['24h', '48h', '72h', '7 days', '30 days', '90 days', '24 months'];
    document.getElementById('recentTabs').innerHTML = tabs.map(function(t) {
        return '<button class="' + (recentTab === t ? 'active' : '') + '" onclick="setRecentTab(\'' + t + '\')">' + t + '</button>';
    }).join('');

    var region = document.getElementById('recentRegion');
    var points, note, opts;

    if (HOUR_TABS[recentTab]) {
        var hrs = HOUR_TABS[recentTab];
        var sepaRecent = isSepaGauge();
        points = points15min(hrs);
        opts = sepaRecent
            ? {yTitle: 'mm per hour', barMax: hrs <= 24 ? 30 : hrs <= 48 ? 18 : 10}
            : {yTitle: 'mm per 15 min', barMax: hrs <= 24 ? 14 : hrs <= 48 ? 8 : 5};
        var got = points.filter(function(p) { return p.v != null; });
        var total = got.reduce(function(a, p) { return a + p.v; }, 0);
        var peak = got.reduce(function(a, p) { return Math.max(a, p.v); }, 0);
        note = !got.length
            ? 'No readings received from this gauge in the last ' + hrs + ' hours.'
            : sepaRecent
                ? 'SEPA reports hourly, not every 15 minutes, so each bar is one hour. ' + got.length + ' of ' + points.length
                  + ' hours received. ' + hrs + ' hour total ' + mmText(total, 1) + ' mm; peak hour ' + mmText(peak, 1)
                  + ' mm. Rules mark midnight, day names sit on it.'
                : '15 minute telemetry in UTC, ' + got.length + ' of ' + points.length + ' slots received. ' + hrs + ' hour total '
                  + mmText(total, 1) + ' mm; peak 15 minutes ' + mmText(peak, 1) + ' mm (' + mmText(peak * 4, 1)
                  + ' mm/h). Rules mark midnight, day names sit on it.';
    } else if (recentTab === '24 months') {
        points = pointsMonthly(24);
        opts = {yTitle: 'mm per month', colourByNorm: mode !== 'none', tol: 0.25, normLine: true, barMax: 30};
        note = mode !== 'none'
            ? 'Monthly totals from this gauge’s ' + (mode === 'historic' ? 'historic' : 'published')
              + ' daily series (09:00&ndash;09:00 rain days), coloured against the average for each calendar month. '
              + 'Rules mark January.'
            : 'Monthly totals accumulated from the rolling daily archive. No long record is published for this gauge, so there '
              + 'is no average to colour them against.';
    } else {
        var n = recentTab === '7 days' ? 7 : recentTab === '30 days' ? 30 : 90;
        points = pointsDaily(n);
        opts = {yTitle: 'mm per day', barMax: n === 7 ? 46 : n === 30 ? 24 : 12};
        var have = points.filter(function(p) { return p.v != null; });
        var dTotal = have.reduce(function(a, p) { return a + p.v; }, 0);
        var wettest = have.reduce(function(a, p) { return !a || p.v > a.v ? p : a; }, null);
        note = 'Daily totals from the rolling archive (00&ndash;24 UTC days), ' + have.length + ' of ' + n
             + ' days held. Total ' + mmText(dTotal, 1) + ' mm'
             + (wettest && wettest.v > 0 ? ', wettest ' + mmText(wettest.v, 1) + ' mm on ' + wettest.label : '')
             + '. Rules mark the first of each month.';
    }

    if (!points.length) {
        region.innerHTML = '<div class="empty">No data held for this period.</div>';
        if (charts.recentChart) { charts.recentChart.destroy(); delete charts.recentChart; }
        return;
    }

    region.innerHTML = '<div class="chart-box"><canvas id="recentChart"></canvas></div>'
        + '<div id="recentLegend"></div><div class="note" style="margin-top:0.55rem">' + note + '</div>';
    document.getElementById('recentLegend').innerHTML = barChart('recentChart', points, opts);
}
function setRecentTab(t) { recentTab = t; renderRecent(); }

// ── Year in context ─────────────────────────────────────────────────────
function envelopeTitle() {
    if (!derived) return 'Year in context';
    var y = (derived.ytd && derived.ytd.year) || (derived.envelope && derived.envelope.year);
    if (!y) return 'Year in context';
    return +y === new Date().getUTCFullYear() ? y + ' in context' : y + ' in context, the latest year of record';
}

function fillYear() {
    var region = document.getElementById('yearRegion');
    if (!region || !derived) return;
    var e = derived.envelope, y = derived.ytd, t = chartTheme();
    var panelYear = (y && y.year) || (e && e.year);

    // An implausible daily value does not stop at the extremes table: it
    // inflates the month, the cumulative curve and the rank built on them, so
    // say so where those numbers are read.
    var bad = clim.records && clim.records.wettestDay && clim.records.wettestDay.mm > UK_DAILY_RECORD_MM
        ? clim.records.wettestDay : null;
    var badHere = bad && bad.date.slice(0, 4) === String(panelYear) ? bad : null;

    var rail = '';
    if (y) {
        var dep = departure(y.mm, y.mean, 0.05);
        rail = '<div class="rail" style="margin-bottom:0.9rem">'
            + '<div class="item"><div class="rv">' + mmText(y.mm, 0) + ' mm</div><div class="rl">' + y.label + ' ' + y.year + '</div></div>'
            + '<div class="item"><div class="rv ' + dep + '">' + Math.round(y.pct) + '%</div>'
            +   '<div class="rl">of the ' + mmText(y.mean, 0) + ' mm average for ' + y.label + '</div></div>'
            + '<div class="item"><div class="rv ' + dep + '">' + ordinal(y.pct >= 100 ? y.rankWettest : y.rankDriest) + '</div>'
            +   '<div class="rl">' + (y.pct >= 100 ? 'wettest' : 'driest') + ' ' + y.label + ' of ' + y.n + ' years</div></div>'
            + (derived.annualNormal ? '<div class="item"><div class="rv">' + mmText(derived.annualNormal, 0) + ' mm</div>'
                + '<div class="rl">Average full year, ' + derived.fullYears.length + ' years</div></div>' : '')
            + '</div>';
    }
    if (badHere) {
        rail += '<div class="callout warn" style="margin-bottom:0.9rem">These figures inherit an implausible daily value on '
            + prettyDate(badHere.date) + ' (' + mmText(badHere.mm, 1) + ' mm, beyond the UK daily record), so the total, the '
            + 'percentage and the rank for ' + panelYear + ' all read high. See the extremes below.</div>';
    }

    if (!e) {
        region.innerHTML = rail + '<div class="note">Fewer than five complete years of record, not enough to draw a '
            + 'normal range for the year to date.</div>';
        return;
    }

    region.innerHTML = rail
        + '<div class="chart-box"><canvas id="yearChart"></canvas></div>'
        + '<div class="legend">'
        +   '<span class="key" style="color:' + t.wet + '"><span class="sw line"></span>' + e.year + ' cumulative</span>'
        +   '<span class="key"><span class="sw dash"></span>Average year</span>'
        +   '<span class="key"><span class="sw" style="background:' + t.wetFill + '"></span>Running ahead of average</span>'
        +   '<span class="key"><span class="sw" style="background:' + t.dryFill + '"></span>Running behind it</span>'
        +   '<span class="key"><span class="sw" style="background:' + t.tint + ';border:1px solid ' + t.grid + '"></span>Normal range, P10&ndash;P90</span>'
        + '</div>'
        + '<div class="note" style="margin-top:0.55rem">Rainfall accumulated from 1 January and plotted at each month end, against '
        + 'the P10&ndash;P90 spread of the cumulative total across ' + e.nYears + ' complete years of record. The dashed line is '
        + 'the mean, the same figure as the &ldquo;average full year&rdquo; total above, not the middle of the band, which '
        + 'sits well below it. Rainfall years are right-skewed (a floor near zero, a long tail from the occasional very wet one), '
        + 'so the typical year runs below the mean and the mean itself sits closer to the wet edge of the band than the dry one; '
        + 'that skew is a real property of the record, not a plotting error.'
        + (clim.recordEnd ? ' The series runs to ' + prettyDate(clim.recordEnd) + '.' : '') + '</div>';

    mountChart('yearChart', {
        type: 'line',
        data: {
            // Each point is a month boundary, so each label names that
            // boundary: index 1 is the end of January, which is 1 February.
            // Labelling it "Jan" would sit a month name on the wrong tick.
            labels: ['1 Jan'].concat(MONTH_ABBR.slice(1)).concat(['31 Dec']),
            datasets: [
                {label: 'P10', data: e.p10, borderColor: 'transparent', pointRadius: 0, fill: false},
                {label: 'P90', data: e.p90, borderColor: 'transparent', pointRadius: 0, backgroundColor: t.tint, fill: '-1'},
                // The mean, not the median: it is what "average full year" in
                // the rail above already means, so the dashed line and that
                // figure agree. A median would sit lower in the band — right,
                // not wrong, but a second, different "average" on the same
                // panel is confusing for no real benefit.
                {label: 'Average', data: e.mean, borderColor: t.muted, borderWidth: 2, borderDash: [5, 4],
                 pointRadius: 0, fill: false, tension: 0.15},
                // Two-colour fill against the average: ahead of it reads cool,
                // behind it reads warm — the above/below signal without a
                // second axis or a second chart.
                {label: e.year, data: e.current, borderColor: t.wet, borderWidth: 2.5,
                 pointRadius: 2.5, pointBackgroundColor: t.wet, pointHoverRadius: 5,
                 fill: {target: 2, above: t.wetFill, below: t.dryFill}, spanGaps: false, tension: 0.15}
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false, animation: {duration: 200},
            interaction: {mode: 'index', intersect: false},
            scales: {
                x: {
                    ticks: {color: t.text, font: {family: t.font, size: 10}, autoSkip: false, maxRotation: 0},
                    // A rule at every month end: reading off where the year
                    // stands at a given month is the whole point of the chart.
                    grid: {display: true, color: t.grid, drawTicks: false},
                    border: {color: t.grid}
                },
                y: {
                    beginAtZero: true, ticks: {color: t.text, font: {family: t.font, size: 10}},
                    grid: {color: t.grid, drawTicks: false}, border: {display: false},
                    title: {display: true, text: 'Cumulative mm', color: t.text, font: {family: t.font, size: 10}}
                }
            },
            plugins: {
                legend: {display: false},
                tooltip: tooltipOpts(t,
                    function(items) {
                        var i = items[0].dataIndex;
                        return i === 0 ? 'Start of the year' : 'End of ' + MONTH_ABBR[i - 1];
                    },
                    function(item) {
                        if (item.parsed.y == null) return null;
                        var n = item.dataset.label, avg = e.mean[item.dataIndex];
                        if (n === 'P10' || n === 'P90') return n + ' ' + mmText(item.parsed.y, 0) + ' mm';
                        if (n === 'Average') return 'Average ' + mmText(item.parsed.y, 0) + ' mm';
                        return n + ' ' + mmText(item.parsed.y, 0) + ' mm'
                            + (avg > 0 ? '  ·  ' + Math.round((item.parsed.y / avg) * 100) + '% of average' : '');
                    })
            }
        }
    });
}

// ── Extremes ─────────────────────────────────────────────────────────────
function fillExtremes(sum) {
    var region = document.getElementById('extremesRegion');
    var hint = document.getElementById('extremesHint');
    var deep = mode !== 'none' && clim.records;
    var r = deep ? clim.records : sum;

    hint.innerHTML = deep
        ? 'From the ' + clim.recordYears + ' year daily series, ' + clim.recordStart.slice(0, 4) + '&ndash;' + clim.recordEnd.slice(0, 4)
        : 'From Flood Forecast’s rolling record only' + (sum.recordsSince ? ', since ' + prettyDate(sum.recordsSince) : '');

    // A published daily total above the UK record is an artefact, not a
    // record. Shown as published, never presented as a fact about the weather.
    var daySuspect = r.wettestDay && r.wettestDay.mm > UK_DAILY_RECORD_MM;
    // The bad day inflates whatever month it sits in, so the mark follows it
    // into every figure built on that month, not just the day's own row.
    var badMonth = daySuspect ? r.wettestDay.date.slice(0, 7) : null;
    var mark = ' <span class="suspect" title="Inflated by an implausible daily value, see the note above">?</span>';
    // Same failure mode at the dry end: a full calendar month at exactly zero,
    // or a dry spell past the UK's own verified record, is a stuck gauge, not
    // weather. Both point at the same underlying artifact, so one mark and
    // one explanation covers either.
    var driestMonthSuspect = r.driestMonth && r.driestMonth.mm < ZERO_MONTH_MM;
    var spellSuspect = r.longestDrySpell && r.longestDrySpell.days > UK_DRY_SPELL_RECORD_DAYS;
    var dryBadMonth = driestMonthSuspect ? r.driestMonth.month : null;
    var dryMark = ' <span class="suspect" title="A stuck or blocked gauge, not a real dry spell, see the note above">?</span>';
    var rows = [
        ['Wettest day', r.wettestDay ? mmText(r.wettestDay.mm, 1) + ' mm' + (daySuspect ? mark : '') : null,
            r.wettestDay ? prettyDate(r.wettestDay.date) : ''],
        ['Wettest month', r.wettestMonth ? mmText(r.wettestMonth.mm, 0) + ' mm'
            + (badMonth && r.wettestMonth.month === badMonth ? mark : '') : null,
            r.wettestMonth ? monthName(r.wettestMonth.month) : ''],
        ['Driest month', r.driestMonth ? mmText(r.driestMonth.mm, 1) + ' mm' + (driestMonthSuspect ? dryMark : '') : null,
            r.driestMonth ? monthName(r.driestMonth.month) : ''],
        ['Longest dry spell', r.longestDrySpell ? r.longestDrySpell.days + ' days' + (spellSuspect ? dryMark : '') : null,
            r.longestDrySpell ? 'from ' + prettyDate(r.longestDrySpell.from) : '']
    ];
    if (deep && derived.wettestYear) {
        rows.push(['Wettest year', mmText(derived.years[derived.wettestYear].total, 0) + ' mm', derived.wettestYear]);
        rows.push(['Driest year', mmText(derived.years[derived.driestYear].total, 0) + ' mm'
            + (dryBadMonth && dryBadMonth.slice(0, 4) === derived.driestYear ? dryMark : ''), derived.driestYear]);
    }

    var left = '<div><div class="sub-h">Record extremes</div><table class="data"><tbody>'
        + rows.map(function(x) {
              return '<tr><td>' + x[0] + '</td><td class="num">' + (x[1] || '&ndash;') + '</td>'
                  + '<td class="dim">' + x[2] + '</td></tr>';
          }).join('')
        + '</tbody></table></div>';

    var right = '';
    if (deep && derived.topMonths.length) {
        var peak = derived.topMonths[0].mm;
        right = '<div><div class="sub-h">Wettest months on record</div><table class="data"><tbody>'
            + derived.topMonths.map(function(x, i) {
                  var norm = derived.norms[x.month.slice(5, 7)];
                  return '<tr><td>' + (i + 1) + '. ' + monthName(x.month) + '</td>'
                      + '<td class="num">' + mmText(x.mm, 0) + (x.month === badMonth ? mark : '') + '</td>'
                      + '<td class="bar-cell"><div class="bar-track"><div class="bar-fill" style="width:'
                      + Math.round((x.mm / peak) * 100) + '%"></div></div></td>'
                      + '<td class="dim">' + (norm ? Math.round((x.mm / norm.mean) * 100) + '% of avg' : '') + '</td></tr>';
              }).join('')
            + '</tbody></table></div>';
    } else if (!deep) {
        right = '<div><div class="sub-h">Why these are short-record figures</div>'
            + '<div class="note">A rolling record of months cannot produce a meaningful wettest day or dry spell for a UK site. '
            + 'These are the extremes observed since this gauge joined the network, and they will keep moving as the record grows. '
            + 'They are not climatological records.</div></div>';
    }

    var caption = '';
    if (daySuspect) {
        caption += '<div class="callout warn" style="margin-bottom:0.8rem"><strong>The wettest-day value is not credible.</strong> '
            + mmText(r.wettestDay.mm, 1) + ' mm in a day exceeds the highest daily rainfall ever recorded anywhere in the UK ('
            + UK_DAILY_RECORD_MM + ' mm at Honister Pass, 5 December 2015), so it is an artefact in the published series rather '
            + 'than a measurement, most likely a stuck or reset tipping-bucket count. It is shown as published rather than '
            + 'quietly dropped, and it inflates the month and the year it sits in too.</div>';
    }
    if (driestMonthSuspect || spellSuspect) {
        var bits = [];
        if (driestMonthSuspect) bits.push(monthName(r.driestMonth.month) + ' at exactly ' + mmText(r.driestMonth.mm, 1) + ' mm');
        if (spellSuspect) bits.push(r.longestDrySpell.days + ' consecutive days from ' + prettyDate(r.longestDrySpell.from));
        caption += '<div class="callout warn" style="margin-bottom:0.8rem"><strong>The dry extremes below are not credible.</strong> '
            + bits.join(', and ') + (bits.length > 1 ? ' both go' : ' goes') + ' well past the longest run without measurable rain '
            + 'ever verified in the UK (around 73 days, Mile End, spring 1893), so this reads as a gauge stuck or blocked at zero '
            + 'for an extended stretch, not a real drought. It is shown as published rather than quietly dropped, and it drags '
            + 'down whichever year it falls in too.</div>';
    }
    if (deep) {
        caption += '<div class="note" style="margin-bottom:0.8rem">Daily figures are '
            + (clim.dayWindow ? esc(clim.dayWindow) : '09:00–09:00 rain days') + '. Monthly extremes use complete months only ('
            + clim.completeMonths + ' of ' + clim.totalMonths + ' months qualify), so a half-missing month cannot take the '
            + 'driest-month record. A dry spell is a run of consecutive days below 0.2 mm with no gap in the record.'
            + (clim.qualityGoodPct != null
                ? ' ' + clim.qualityGoodPct + '% of the daily values behind these figures are flagged Good by the data provider'
                  + (clim.qualityGoodPct < 60 ? ', so treat the extremes with care' : '') + '.'
                : '')
            + (clim.source === 'sepa'
                ? ' SEPA labels each daily total by the start of its 09:00 window, so a single-day date can differ by one day '
                  + 'from Met Office convention.'
                : '')
            + '</div>';
    }

    region.innerHTML = caption + '<div class="two-col">' + left + right + '</div>';
}

// ── Long record ─────────────────────────────────────────────────────────
function fillLongRecord(sum) {
    var region = document.getElementById('recordRegion');
    var hint = document.getElementById('recordHint');
    var title = document.getElementById('recordTitle');

    if (mode === 'none') {
        title.textContent = 'Long record';
        hint.textContent = '';
        var since = sum.recordsSince ? 'on ' + prettyDate(sum.recordsSince) : 'when this gauge joined the network';
        region.innerHTML = '<div class="callout warn"><strong>No historical record exists for this site.</strong> '
            + (proxyRejected
                ? 'Natural Resources Wales publishes no rainfall archive, so nothing measured at this gauge goes back beyond '
                  + 'Flood Forecast’s own rolling record, which starts ' + since + '. A Met Office MIDAS Open station '
                  + (proxyRejected.distKm != null ? proxyRejected.distKm.toFixed(2) + ' km away' : 'nearby')
                  + ' does hold a long record, but that is a different instrument at a different site and is not shown here '
                  + 'or used in any figure on this page.'
                : 'There is no EA or SEPA historic daily series for this reference, so nothing measured here goes back beyond '
                  + 'Flood Forecast’s own rolling record, which starts ' + since + '.')
            + '</div>'
            + '<div class="note" style="margin-top:0.7rem">Without a record for the site there are no averages, no anomalies and '
            + 'no climatological extremes to show, so none are drawn. The 24 month view above holds the monthly totals we have '
            + 'accumulated ourselves.</div>';
        return;
    }

    title.textContent = mode === 'historic' ? 'Historic record' : 'Long record';
    hint.innerHTML = clim.recordStart.slice(0, 4) + '&ndash;' + clim.recordEnd.slice(0, 4)
        + ' &middot; ' + clim.recordYears + ' years &middot; ' + derived.fullYears.length + ' complete calendar years';

    // Everything from here down is measured at this gauge: a matched-station
    // record never reaches this branch (see climatologyMode).
    var banners = '';
    if (mode === 'historic') {
        banners += '<div class="callout warn"><strong>This record ends ' + prettyDate(clim.recordEnd) + '.</strong> It is shown '
            + 'on its own terms, as a historical baseline for the site. Today’s telemetry is not compared against it, because the '
            + 'two do not overlap: no year-to-date position, no percentage of normal.</div>';
    }

    region.innerHTML = banners
        + '<div class="sub-h" style="margin-top:' + (banners ? '0.9rem' : '0') + '">Annual totals</div>'
        + '<div class="chart-box h-mid"><canvas id="annualChart"></canvas></div>'
        + '<div id="annualLegend"></div>'
        + '<div class="sub-h" style="margin-top:1.3rem">Monthly totals against the average for that month</div>'
        + buildHeatmap()
        + '<div class="note" style="margin-top:0.7rem">' + heatmapNote() + '</div>';

    drawAnnualChart();
}

function drawAnnualChart() {
    var t = chartTheme();
    var keys = derived.yearKeys;
    var norm = derived.annualNormal;
    // Annual totals vary far less than monthly ones, so 10% either side of the
    // record average is the band worth colouring, not the quarter the heatmap
    // uses for months.
    var TOL = 0.10;
    var colours = keys.map(function(y) {
        if (!derived.years[y].fullYear) return t.inset;
        var d = departure(derived.years[y].total, norm, TOL);
        return d === 'wet' ? t.wetStrong : d === 'dry' ? t.dry : t.brand;
    });

    var datasets = [{
        label: 'Annual total', data: keys.map(function(y) { return derived.years[y].total; }),
        backgroundColor: colours,
        borderColor: keys.map(function(y, i) { return derived.years[y].fullYear ? colours[i] : t.gridStrong; }),
        borderWidth: keys.map(function(y) { return derived.years[y].fullYear ? 0 : 1; }),
        borderRadius: 2, borderSkipped: false,
        // A short record would otherwise draw four hairlines adrift in a wide
        // plot; a long one needs the cap to stay readable.
        maxBarThickness: keys.length > 24 ? 22 : keys.length > 12 ? 32 : 46
    }];
    if (norm) {
        datasets.push({type: 'line', label: 'Average', data: keys.map(function() { return norm; }),
            borderColor: t.muted, borderWidth: 2, borderDash: [5, 4], pointRadius: 0, tension: 0});
    }

    mountChart('annualChart', {
        type: 'bar',
        data: {labels: keys, datasets: datasets},
        options: {
            responsive: true, maintainAspectRatio: false, animation: {duration: 200},
            interaction: {mode: 'index', intersect: false},
            scales: {
                x: {
                    // A label every fifth year plus the ends keeps a 60 year
                    // record legible, where autoSkip drops arbitrary years.
                    ticks: {color: t.text, font: {family: t.font, size: 10}, autoSkip: false, maxRotation: 0,
                        callback: function(v, i) {
                            return (+keys[i] % 5 === 0 || i === 0 || i === keys.length - 1) ? keys[i] : '';
                        }},
                    grid: {display: true, drawTicks: false,
                        color: function(c) { return +keys[c.index] % 10 === 0 ? t.grid : 'transparent'; }},
                    border: {color: t.grid}
                },
                y: {
                    beginAtZero: true, ticks: {color: t.text, font: {family: t.font, size: 10}},
                    grid: {color: t.grid, drawTicks: false}, border: {display: false},
                    title: {display: true, text: 'mm per year', color: t.text, font: {family: t.font, size: 10}}
                }
            },
            plugins: {
                legend: {display: false},
                tooltip: tooltipOpts(t,
                    function(items) {
                        return items[0].label + (derived.years[keys[items[0].dataIndex]].fullYear ? '' : ' (part year)');
                    },
                    function(item) {
                        if (item.datasetIndex === 1) return 'Average ' + mmText(norm, 0) + ' mm';
                        var rec = derived.years[keys[item.dataIndex]];
                        var line = mmText(item.parsed.y, 0) + ' mm';
                        if (!rec.fullYear) return line + ' from ' + rec.monthsPresent + ' month' + (rec.monthsPresent === 1 ? '' : 's');
                        if (norm) line += '  ·  ' + Math.round((item.parsed.y / norm) * 100) + '% of average';
                        return line;
                    })
            }
        }
    });

    document.getElementById('annualLegend').innerHTML = '<div class="legend">'
        + '<span class="key"><span class="sw" style="background:' + t.wetStrong + '"></span>Above 110% of average</span>'
        + '<span class="key"><span class="sw" style="background:' + t.brand + '"></span>Within 10% of average</span>'
        + '<span class="key"><span class="sw" style="background:' + t.dry + '"></span>Below 90% of average</span>'
        + '<span class="key"><span class="sw" style="background:' + t.inset + ';border:1px solid ' + t.gridStrong + '"></span>Part year, not comparable</span>'
        + (norm ? '<span class="key"><span class="sw dash"></span>Average of complete years, ' + mmText(norm, 0) + ' mm</span>' : '')
        + '</div>';
}

// Year × month grid, coloured on the log ratio to that calendar month's
// average. Every month in the record is here, which a horizontal month
// scroller could never be.
function buildHeatmap() {
    var years = derived.yearKeys.slice().reverse();
    var norms = derived.norms;

    function bucket(v, mean) {
        if (!mean || mean <= 0) return '';
        // Log2 ratio — rainfall departures are multiplicative, so the arms are
        // symmetric and "half the average" reads as strongly as "double".
        // Nothing inside a quarter of the average is shaded: for a UK monthly
        // total that is ordinary variability, and shading it would turn the
        // grid into noise with no anomaly standing out.
        var r = Math.log(Math.max(v, 0.1) / mean) / Math.LN2;
        if (r >= 1.58) return 'w4';
        if (r >= 1.00) return 'w3';
        if (r >= 0.58) return 'w2';
        if (r >= 0.32) return 'w1';
        if (r <= -1.58) return 'd4';
        if (r <= -1.00) return 'd3';
        if (r <= -0.58) return 'd2';
        if (r <= -0.32) return 'd1';
        return '';
    }

    var head = '<tr><th class="yr">Year</th>'
        + MONTH_ABBR.map(function(m) { return '<th>' + m + '</th>'; }).join('') + '<th>Total</th></tr>';

    var body = years.map(function(y) {
        var rec = derived.years[y];
        var cells = '';
        for (var m = 1; m <= 12; m++) {
            var v = rec.months[m];
            if (v == null) { cells += '<td class="gap" title="' + MONTH_ABBR[m - 1] + ' ' + y + ', no data">&middot;</td>'; continue; }
            var mean = norms[pad2(m)] ? norms[pad2(m)].mean : null;
            if (!rec.complete[m]) {
                cells += '<td class="part" title="' + MONTH_ABBR[m - 1] + ' ' + y + ', ' + mmText(v, 0)
                    + ' mm, incomplete month, not compared with the average">' + mmText(v, 0) + '</td>';
                continue;
            }
            var tip = MONTH_ABBR[m - 1] + ' ' + y + ', ' + mmText(v, 1) + ' mm'
                + (mean ? ', ' + Math.round((v / mean) * 100) + '% of the ' + mmText(mean, 0) + ' mm average'
                        : ', no average published for this month');
            cells += '<td class="' + bucket(v, mean) + '" title="' + tip + '">' + mmText(v, 0) + '</td>';
        }
        var totTip = rec.fullYear ? mmText(rec.total, 0) + ' mm'
            : mmText(rec.total, 0) + ' mm from ' + rec.monthsPresent + ' months, part year';
        cells += '<td class="tot" title="' + y + ', ' + totTip + '">'
            + (rec.fullYear ? mmText(rec.total, 0) : '<span style="color:var(--text-dark)">' + mmText(rec.total, 0) + '*</span>')
            + '</td>';
        return '<tr><td class="yr">' + y + '</td>' + cells + '</tr>';
    }).join('');

    var normRow = '';
    if (Object.keys(norms).length) {
        normRow = '<tr class="norms"><td class="yr">Average</td>'
            + MONTH_ABBR.map(function(m, i) {
                  var n = norms[pad2(i + 1)];
                  return '<td title="' + m + ' average '
                      + (n ? mmText(n.mean, 1) + ' mm from ' + n.years + ' years' : 'not published') + '">'
                      + (n ? mmText(n.mean, 0) : '&middot;') + '</td>';
              }).join('')
            + '<td class="tot">' + (derived.annualNormal ? mmText(derived.annualNormal, 0) : '&middot;') + '</td></tr>';
    }

    var legend = '<div class="hm-legend"><span>Drier</span>'
        + ['d4', 'd3', 'd2', 'd1'].map(function(c) { return '<span class="cell" style="background:var(--dv-' + c + ')"></span>'; }).join('')
        + '<span class="cell" style="background:var(--dv-n)"></span>'
        + ['w1', 'w2', 'w3', 'w4'].map(function(c) { return '<span class="cell" style="background:var(--dv-' + c + ')"></span>'; }).join('')
        + '<span>Wetter</span>'
        + '<span style="margin-left:0.5rem">Unshaded within a quarter of the average; steps at &times;1.25, &times;1.5, '
        + '&times;2 and &times;3 either side</span></div>';

    return '<div class="hm-scroll"><table class="hm"><thead>' + head + '</thead><tbody>' + body + normRow + '</tbody></table></div>' + legend;
}

function heatmapNote() {
    var n = 'Each cell is that month’s total in mm, shaded only where it departs from the average for that calendar month by more '
        + 'than a quarter. Grey italic cells are months missing more than a tenth of their days (shown, never judged '
        + 'against an average). Dots are gaps in the record; a starred total is a part year.';
    if (Object.keys(derived.norms).length) {
        n += ' Averages need at least five complete years for that calendar month, computed over '
            + clim.recordStart.slice(0, 4) + '&ndash;' + clim.recordEnd.slice(0, 4) + '.';
    } else {
        n += ' Too few complete years in this record to publish monthly averages, so no cell is shaded.';
    }
    return n;
}

// ── Provenance ───────────────────────────────────────────────────────────
function fillProvenance(s, sum) {
    var rows = [
        ['Station name', esc(s.name)],
        ['Reference', '<span class="mono">' + esc(ref) + '</span>'],
        ['Network', networkOf(s) + (s.source === 'nrw' ? ' (Natural Resources Wales)'
            : s.source === 'sepa' ? ' (Scottish Environment Protection Agency)' : ' (Environment Agency)')],
        ['County', esc(countyName || 'Not matched')],
        ['Position', '<span class="mono">' + s.lat.toFixed(5) + ', ' + s.lon.toFixed(5) + '</span>'],
        ['Live telemetry', '15 minute tips, polled by Flood Forecast'
            + (sum.recordsSince ? '; our own record starts ' + prettyDate(sum.recordsSince) : '')]
    ];

    var q = [];
    if (mode !== 'none') {
        q.push(['Historic series', (clim.source === 'sepa' ? 'SEPA daily rainfall archive' : 'EA Hydrology daily rainfall measure')
            + ', measured at this station']);
        q.push(['Period of record', prettyDate(clim.recordStart) + ' to ' + prettyDate(clim.recordEnd)
            + ' &middot; ' + clim.recordYears + ' years'
            + (mode === 'historic' ? ' <span class="pill">Ends historically</span>' : '')]);
        q.push(['Valid daily values', (clim.validDays != null ? clim.validDays.toLocaleString() : '&ndash;')
            + ' days; ' + clim.completeMonths + ' of ' + clim.totalMonths + ' months complete; '
            + derived.fullYears.length + ' complete calendar years']);
        q.push(['Rain day', esc(clim.dayWindow || '09:00–09:00, the meteorological convention')
            + ', never summed with the 00–24 UTC rolling archive']);
        if (clim.qualityGoodPct != null) {
            q.push(['Quality flags', clim.qualityGoodPct + '% of daily values are flagged Good by the Environment Agency. The '
                + 'remainder are estimated, unchecked or suspect and are still included in every total on this page'
                + (clim.qualityGoodPct < 80 ? ', so read the records and anomalies with that in mind' : '') + '.']);
        }
        if (derived.annualNormal) {
            // Ranked on the index's own annual normal rather than the average
            // computed here: the pool is built from index values, and mixing
            // the two methods would compare unlike numbers. Stale records are
            // left out, because the pool describes current records.
            var mineIdx = normalIndex[ref] && normalIndex[ref].annualNormal;
            var rank = mode === 'live' && mineIdx ? nationalRank(mineIdx) : null;
            q.push(['Annual average', mmText(derived.annualNormal, 0) + ' mm from ' + derived.fullYears.length
                + ' complete years' + (rank ? ', wetter than ' + rank.pct + '% of the ' + rank.n.toLocaleString()
                    + ' UK gauges with a current published record' : '')]);
        }
    } else if (proxyRejected) {
        q.push(['Historic series', 'None for this site. Natural Resources Wales publishes no rainfall archive.']);
        q.push(['Nearest long record', 'Met Office MIDAS Open station ' + esc(titleCase(proxyRejected.name)) + ' ('
            + esc(proxyRejected.srcId) + ')'
            + (proxyRejected.distKm != null ? ', ' + proxyRejected.distKm.toFixed(2) + ' km away' : '')
            + ', a different site, deliberately not used for any figure here']);
        q.push(['Consequence', 'No averages, anomalies or climatological records are shown, because none have been measured at '
            + 'this gauge. Every figure on this page comes from our own rolling record.']);
    } else {
        q.push(['Historic series', 'None for this site. There is no EA or SEPA archive series for this reference.']);
        q.push(['Consequence', 'No averages, anomalies or climatological records are shown. Every figure on this page comes from '
            + 'our own rolling record.']);
    }

    document.getElementById('provRegion').innerHTML = '<div class="two-col">'
        + '<div><div class="sub-h">Station</div><dl class="dl">'
        +   rows.map(function(r) { return '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>'; }).join('') + '</dl></div>'
        + '<div><div class="sub-h">Record &amp; data quality</div><dl class="dl">'
        +   q.map(function(r) { return '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>'; }).join('') + '</dl></div>'
        + '</div>';
}

// Percentile of this gauge's annual average across every gauge whose record is
// current, from all three network indexes.
function nationalRank(value) {
    var all = Object.keys(normalIndex).map(function(k) { return normalIndex[k]; })
        .filter(function(v) {
            if (!v || typeof v.annualNormal !== 'number' || !(v.annualNormal > 0) || !v.recordEnd) return false;
            return (Date.now() - Date.parse(v.recordEnd)) / 86400000 <= STALE_RECORD_DAYS;
        })
        .map(function(v) { return v.annualNormal; });
    if (all.length < 50) return null;
    var below = all.filter(function(v) { return v < value; }).length;
    return {pct: Math.round((below / all.length) * 100), n: all.length};
}

// Re-theme when the OS switches light/dark: every colour is read live from the
// CSS custom properties, so a re-render is all it takes.
if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onScheme = function() {
        if (!station) return;
        renderRecent();
        fillYear();
        if (mode !== 'none' && document.getElementById('annualChart')) drawAnnualChart();
        fillPlace(station);
    };
    if (mq.addEventListener) mq.addEventListener('change', onScheme);
    else if (mq.addListener) mq.addListener(onScheme);
}
</script>
</body>
</html>
