<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>24hr Rainfall Accumulation</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }
    body {
      font-family: 'Roboto', sans-serif;
      background: #eef2f7;
      color: #1f2937;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────────────────────────── */
    header {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 8px;
      padding: 9px 14px;
      background: linear-gradient(90deg, #0ea5e9 0%, #2563eb 100%);
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    }
    .title { font-size: 15px; font-weight: 700; white-space: nowrap; flex: 1; }
    .toggle { display: flex; background: rgba(255,255,255,0.18); border-radius: 20px; padding: 3px; flex-shrink: 0; gap: 1px; }
    .toggle button {
      background: none; border: none; color: rgba(255,255,255,0.85);
      font-family: inherit; font-size: 11px; font-weight: 500;
      padding: 4px 10px; border-radius: 16px; cursor: pointer;
      transition: background .18s, color .18s; white-space: nowrap;
    }
    .toggle button.active { background: #fff; color: #2563eb; }

    /* ── Image stage ─────────────────────────────────────────────────────────── */
    #stage {
      flex: 1; min-height: 0;
      position: relative;
      display: flex; align-items: center; justify-content: center;
      background: #dbe4ee; overflow: hidden;
    }
    #stage img {
      max-width: 100%; max-height: 100%;
      object-fit: contain; display: block;
    }
    #loading {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: #2563eb; font-weight: 500; background: #eef2f7;
      text-align: center; padding: 20px;
    }
    #loading.done { display: none; }

    /* ── Dark controls panel ─────────────────────────────────────────────────── */
    #controls {
      flex-shrink: 0;
      background: #1a1f2e;
      padding: 12px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ctrl-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #play-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: #2563eb;
      border: none; color: #fff;
      font-size: 18px;
      cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    #play-btn:hover { background: #1d4ed8; }

    .step-btn {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: rgba(255,255,255,0.1);
      border: none; color: rgba(255,255,255,0.85);
      font-size: 15px;
      cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    .step-btn:hover { background: rgba(255,255,255,0.2); }

    #speed-select {
      background: rgba(255,255,255,0.1);
      border: none; color: rgba(255,255,255,0.85);
      font-family: inherit; font-size: 12px;
      padding: 6px 10px; border-radius: 8px;
      cursor: pointer; margin-left: auto;
    }
    #speed-select option { background: #1a1f2e; color: #fff; }

    /* ── Scrubber ─────────────────────────────────────────────────────────────── */
    #scrubber { display: flex; flex-direction: column; gap: 6px; }

    #progress-track {
      position: relative; height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px; cursor: pointer;
    }
    #progress-fill {
      height: 100%; background: #2563eb;
      border-radius: 2px; position: relative;
      transition: width .1s;
    }
    #scrubber-handle {
      position: absolute; right: -6px; top: -4px;
      width: 12px; height: 12px;
      border-radius: 50%; background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
      pointer-events: none;
    }

    .time-labels {
      display: flex; justify-content: space-between;
      font-size: 10px; color: rgba(255,255,255,0.45);
      font-weight: 500;
    }

    /* ── Big timestamp ───────────────────────────────────────────────────────── */
    #big-timestamp {
      font-size: 17px; font-weight: 700;
      color: #fff; text-align: center;
      letter-spacing: 0.01em;
    }

    footer {
      flex-shrink: 0;
      padding: 6px 14px; background: #1a1f2e;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 11px; text-align: center;
    }
    footer a { color: rgba(255,255,255,0.45); text-decoration: none; }
    footer a:hover { color: rgba(255,255,255,0.85); }
  </style>
</head>
<body>

<header>
  <span class="title">Rainfall Accumulation</span>
  <div class="toggle">
    <button id="btn-hourly" class="active" onclick="setMode('hourly')">Hourly</button>
    <button id="btn-daily"                 onclick="setMode('daily')">Daily</button>
  </div>
</header>

<div id="stage">
  <img id="frame-img" alt="Rainfall accumulation" />
  <div id="loading">Loading…</div>
</div>

<div id="controls">
  <div class="ctrl-row">
    <button id="play-btn" onclick="togglePlay()" title="Play/Pause">⏸</button>
    <button class="step-btn" onclick="stepFrame(-1)" title="Previous">⏮</button>
    <button class="step-btn" onclick="stepFrame(1)"  title="Next">⏭</button>
    <select id="speed-select" onchange="setSpeed(this.value)" title="Speed">
      <option value="1">Slow</option>
      <option value="2" selected>Normal</option>
      <option value="5">Fast</option>
    </select>
  </div>
  <div id="scrubber">
    <div id="progress-track" onclick="scrubClick(event)">
      <div id="progress-fill" style="width:0%">
        <div id="scrubber-handle"></div>
      </div>
    </div>
    <div class="time-labels">
      <span id="time-start">—</span>
      <span id="time-end">—</span>
    </div>
  </div>
  <div id="big-timestamp">—</div>
</div>

<footer>
  <a href="../radarmicro/">Live radar →</a>
  &nbsp;·&nbsp;
  <a href="../index.html">Full map →</a>
</footer>

<script>
const HOURLY_MANIFEST = '../frames_accum_hourly.json';
const DAILY_MANIFEST  = '../frames_accum_daily.json';
const REFRESH_MS      = 60 * 60 * 1000;
const DWELL_FRAMES    = 8;

let hourlyFrames = [];   // [{time, url}]
let dailyFrames  = [];   // [{date, url, label}]
let hourlyIdx    = 0;
let dailyIdx     = 0;
let mode         = 'hourly';
let playing      = true;
let fps          = 2;
let tickTimer    = null;
let dwellCount   = 0;
const cache      = {};

const img = document.getElementById('frame-img');

const DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// ── Label formatters ─────────────────────────────────────────────────────────

function fmtHourlyStamp(isoUtc) {
  const d    = new Date(isoUtc);
  const hh   = String(d.getUTCHours()).padStart(2,'0');
  const day  = DAYS[d.getUTCDay()];
  const date = d.getUTCDate();
  const mon  = MONTHS[d.getUTCMonth()];
  return `24hr to ${hh}:00 UTC  ${day} ${date} ${mon}`;
}

function fmtHourlyShort(isoUtc) {
  return String(new Date(isoUtc).getUTCHours()).padStart(2,'0') + ':00';
}

function fmtDailyStamp(fr) {
  // fr.label set during manifest parse: 'Today so far', 'Yesterday', 'Mon 21 Jun'
  return fr.label;
}

function parseDailyLabel(dateStr, idx) {
  // dateStr = 'YYYYMMDD'
  const y = +dateStr.slice(0,4), m = +dateStr.slice(4,6)-1, d = +dateStr.slice(6,8);
  const dt = new Date(Date.UTC(y, m, d));
  if (idx === 0) return 'Today so far';
  if (idx === 1) return 'Yesterday · 24hr total';
  return `${DAYS[dt.getUTCDay()]} ${d} ${MONTHS[m]} · 24hr total`;
}

// ── Active frame accessors ───────────────────────────────────────────────────

function activeFrames() { return mode === 'daily' ? dailyFrames : hourlyFrames; }
function getIdx()       { return mode === 'daily' ? dailyIdx    : hourlyIdx;    }
function setIdx(i)      { if (mode === 'daily') dailyIdx = i; else hourlyIdx = i; }

// ── UI update ────────────────────────────────────────────────────────────────

function updateTimeLabels() {
  const frames = activeFrames();
  if (!frames.length) {
    document.getElementById('time-start').textContent = '—';
    document.getElementById('time-end').textContent   = '—';
    return;
  }
  if (mode === 'hourly') {
    document.getElementById('time-start').textContent = fmtHourlyShort(frames[0].time);
    document.getElementById('time-end').textContent   = fmtHourlyShort(frames[frames.length-1].time);
  } else {
    document.getElementById('time-start').textContent = frames[frames.length-1].label.split(' ·')[0];
    document.getElementById('time-end').textContent   = 'Today';
  }
}

// ── Loaders ──────────────────────────────────────────────────────────────────

async function fetchAndCache(url) {
  return new Promise(resolve => {
    if (cache[url]) { resolve(true); return; }
    const im = new Image();
    im.onload  = () => { cache[url] = im; resolve(true); };
    im.onerror = () => resolve(false);
    im.src = url;
  });
}

async function loadHourlyManifest() {
  try {
    const res = await fetch(HOURLY_MANIFEST + '?t=' + Date.now());
    if (!res.ok) return null;
    const all = await res.json();
    if (!all.length) return null;
    const results = await Promise.all(all.map(async fr => {
      const ok = await fetchAndCache(fr.url);
      return ok ? fr : null;
    }));
    return results.filter(Boolean);
  } catch (_) { return null; }
}

async function loadDailyManifest() {
  try {
    const res = await fetch(DAILY_MANIFEST + '?t=' + Date.now());
    if (!res.ok) return null;
    const all = await res.json();
    if (!all.length) return null;
    // Sorted newest-first from script; reverse so oldest is index 0 in array,
    // but UI will show newest (today) first — keep server order (newest first)
    const results = await Promise.all(all.map(async (fr, i) => {
      const ok = await fetchAndCache(fr.url);
      return ok ? { ...fr, label: parseDailyLabel(fr.date, i) } : null;
    }));
    return results.filter(Boolean);
  } catch (_) { return null; }
}

async function boot() {
  const [hourly, daily] = await Promise.all([loadHourlyManifest(), loadDailyManifest()]);

  if (!hourly && !daily) {
    document.getElementById('loading').textContent =
      'No data yet — trigger the radar workflow first.';
    return;
  }

  if (hourly) {
    hourlyFrames = hourly;
    hourlyIdx    = hourlyFrames.length - 1;
  }
  if (daily) {
    dailyFrames = daily;
    dailyIdx    = 0;   // start on today (index 0 = newest)
  }

  document.getElementById('loading').classList.add('done');
  updateTimeLabels();
  renderFrame(getIdx());
  setInterval(backgroundRefresh, REFRESH_MS);
}

async function backgroundRefresh() {
  const [hourly, daily] = await Promise.all([loadHourlyManifest(), loadDailyManifest()]);
  if (hourly && hourly.length > hourlyFrames.length) {
    const shift = hourly.length - hourlyFrames.length;
    hourlyFrames = hourly;
    hourlyIdx    = Math.min(hourlyIdx + shift, hourlyFrames.length - 1);
    if (mode === 'hourly') { updateTimeLabels(); }
  }
  if (daily) {
    dailyFrames = daily;
    if (mode === 'daily') { updateTimeLabels(); }
  }
}

// ── Render ───────────────────────────────────────────────────────────────────

function renderFrame(i) {
  const frames = activeFrames();
  if (!frames.length) return;
  const fr = frames[i];
  img.src = fr.url;
  document.getElementById('big-timestamp').textContent =
    mode === 'daily' ? fmtDailyStamp(fr) : fmtHourlyStamp(fr.time);
  const pct = frames.length > 1 ? i / (frames.length - 1) * 100 : 100;
  document.getElementById('progress-fill').style.width = pct + '%';
}

// ── Animation ────────────────────────────────────────────────────────────────

function tick() {
  const frames = activeFrames();
  if (!frames.length) return;
  let i = getIdx();
  if (i >= frames.length - 1) {
    if (++dwellCount < DWELL_FRAMES) return;
    dwellCount = 0; i = 0;
  } else {
    i++;
  }
  setIdx(i);
  renderFrame(i);
}

function startLoop() { clearInterval(tickTimer); tickTimer = setInterval(tick, 1000 / fps); }
function stopLoop()  { clearInterval(tickTimer); tickTimer = null; }

function togglePlay() {
  playing = !playing;
  document.getElementById('play-btn').textContent = playing ? '⏸' : '▶';
  playing ? startLoop() : stopLoop();
}

function stepFrame(d) {
  const frames = activeFrames();
  const i = Math.max(0, Math.min(frames.length - 1, getIdx() + d));
  setIdx(i); dwellCount = 0; renderFrame(i);
}

function setSpeed(v) { fps = parseFloat(v); if (playing) startLoop(); }

function scrubClick(e) {
  const frames = activeFrames();
  const r = e.currentTarget.getBoundingClientRect();
  const frac = (e.clientX - r.left) / r.width;
  const i = Math.max(0, Math.min(frames.length - 1, Math.round(frac * (frames.length - 1))));
  setIdx(i); dwellCount = 0; renderFrame(i);
}

// ── Mode toggle ───────────────────────────────────────────────────────────────

function setMode(m) {
  mode = m;
  document.getElementById('btn-hourly').classList.toggle('active', m === 'hourly');
  document.getElementById('btn-daily').classList.toggle('active',  m === 'daily');

  if (m === 'daily' && !dailyFrames.length) {
    document.getElementById('big-timestamp').textContent = 'Daily data not yet available';
    return;
  }
  updateTimeLabels();
  renderFrame(getIdx());
}

// ── Boot ─────────────────────────────────────────────────────────────────────
boot();
startLoop();
</script>
</body>
</html>
