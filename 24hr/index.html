<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>24hr Rainfall Accumulation</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }
    body {
      font-family: 'Roboto', sans-serif;
      background: #eef2f7;
      color: #1f2937;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────────────────────────── */
    header {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 8px;
      padding: 9px 14px;
      background: linear-gradient(90deg, #0ea5e9 0%, #2563eb 100%);
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    }
    .title    { font-size: 15px; font-weight: 700; white-space: nowrap; flex: 1; }
    .subtitle { font-size: 11px; font-weight: 400; opacity: 0.75; white-space: nowrap; }

    /* ── Image stage ─────────────────────────────────────────────────────────── */
    #stage {
      flex: 1; min-height: 0;
      position: relative;
      display: flex; align-items: center; justify-content: center;
      background: #dbe4ee; overflow: hidden;
    }
    #stage img {
      max-width: 100%; max-height: 100%;
      object-fit: contain; display: block;
    }
    #loading {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: #2563eb; font-weight: 500; background: #eef2f7;
    }
    #loading.done { display: none; }

    /* ── Dark controls panel ─────────────────────────────────────────────────── */
    #controls {
      flex-shrink: 0;
      background: #1a1f2e;
      padding: 12px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ctrl-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #play-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: #2563eb;
      border: none; color: #fff;
      font-size: 18px;
      cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    #play-btn:hover { background: #1d4ed8; }

    .step-btn {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: rgba(255,255,255,0.1);
      border: none; color: rgba(255,255,255,0.85);
      font-size: 15px;
      cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    .step-btn:hover { background: rgba(255,255,255,0.2); }

    #speed-select {
      background: rgba(255,255,255,0.1);
      border: none; color: rgba(255,255,255,0.85);
      font-family: inherit; font-size: 12px;
      padding: 6px 10px; border-radius: 8px;
      cursor: pointer; margin-left: auto;
    }
    #speed-select option { background: #1a1f2e; color: #fff; }

    /* ── Scrubber ─────────────────────────────────────────────────────────────── */
    #scrubber { display: flex; flex-direction: column; gap: 6px; }

    #progress-track {
      position: relative; height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px; cursor: pointer;
    }
    #progress-fill {
      height: 100%; background: #2563eb;
      border-radius: 2px; position: relative;
      transition: width .1s;
    }
    #scrubber-handle {
      position: absolute; right: -6px; top: -4px;
      width: 12px; height: 12px;
      border-radius: 50%; background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
      pointer-events: none;
    }

    .time-labels {
      display: flex; justify-content: space-between;
      font-size: 10px; color: rgba(255,255,255,0.45);
      font-weight: 500;
    }

    /* ── Big timestamp ───────────────────────────────────────────────────────── */
    #big-timestamp {
      font-size: 17px; font-weight: 700;
      color: #fff; text-align: center;
      letter-spacing: 0.01em;
    }

    footer {
      flex-shrink: 0;
      padding: 6px 14px; background: #1a1f2e;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 11px; text-align: center;
    }
    footer a { color: rgba(255,255,255,0.45); text-decoration: none; }
    footer a:hover { color: rgba(255,255,255,0.85); }
  </style>
</head>
<body>

<header>
  <span class="title">24hr Rainfall Accumulation</span>
  <span class="subtitle">Hourly · Met Office radar</span>
</header>

<div id="stage">
  <img id="frame-img" alt="Rainfall accumulation" />
  <div id="loading">Loading…</div>
</div>

<div id="controls">
  <div class="ctrl-row">
    <button id="play-btn" onclick="togglePlay()" title="Play/Pause">⏸</button>
    <button class="step-btn" onclick="stepFrame(-1)" title="Previous">⏮</button>
    <button class="step-btn" onclick="stepFrame(1)"  title="Next">⏭</button>
    <select id="speed-select" onchange="setSpeed(this.value)" title="Speed">
      <option value="1">Slow</option>
      <option value="2" selected>Normal</option>
      <option value="5">Fast</option>
    </select>
  </div>
  <div id="scrubber">
    <div id="progress-track" onclick="scrubClick(event)">
      <div id="progress-fill" style="width:0%">
        <div id="scrubber-handle"></div>
      </div>
    </div>
    <div class="time-labels">
      <span id="time-start">—</span>
      <span id="time-end">—</span>
    </div>
  </div>
  <div id="big-timestamp">—</div>
</div>

<footer>
  <a href="../radarmicro/">Live radar →</a>
  &nbsp;·&nbsp;
  <a href="../index.html">Full map →</a>
</footer>

<script>
const MANIFEST   = 'https://radar.floodforecast.co.uk/composites/frames_accum_hourly.json';
const REFRESH_MS = 60 * 60 * 1000;
const DWELL_FRAMES = 8;

let frames     = [];
let idx        = 0;
let playing    = true;
let fps        = 2;
let tickTimer  = null;
let dwellCount = 0;
const cache    = {};

const img = document.getElementById('frame-img');

const DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function fmtWindow(isoUtc) {
  const d   = new Date(isoUtc);
  const end = new Date(d.getTime() + 3600000);
  const hh0 = String(d.getUTCHours()).padStart(2,'0');
  const hh1 = String(end.getUTCHours()).padStart(2,'0');
  const day  = DAYS[d.getUTCDay()];
  const date = d.getUTCDate();
  const mon  = MONTHS[d.getUTCMonth()];
  return `${hh0}:00 – ${hh1}:00 UTC  ${day} ${date} ${mon}`;
}

function fmtShort(isoUtc) {
  const d = new Date(isoUtc);
  return String(d.getUTCHours()).padStart(2,'0') + ':00';
}

function updateTimeLabels() {
  if (!frames.length) return;
  document.getElementById('time-start').textContent = fmtShort(frames[0].time);
  document.getElementById('time-end').textContent   = fmtShort(frames[frames.length - 1].time);
}

async function loadManifest() {
  try {
    const res = await fetch(MANIFEST + '?t=' + Date.now());
    const all = await res.json();
    if (!all.length) {
      document.getElementById('loading').textContent = 'No accumulation data yet — workflow may not have run.';
      return;
    }

    const checked = await Promise.all(all.map(fr => new Promise(resolve => {
      const im = new Image();
      im.onload  = () => { cache[fr.url] = im; resolve(fr); };
      im.onerror = () => resolve(null);
      im.src = fr.url;
    })));
    frames = checked.filter(Boolean);

    if (!frames.length) {
      document.getElementById('loading').textContent = 'Images not yet available.';
      return;
    }

    document.getElementById('loading').classList.add('done');
    idx = frames.length - 1;
    updateTimeLabels();
    renderFrame(idx);
    setInterval(refreshInBackground, REFRESH_MS);
  } catch (e) {
    document.getElementById('loading').textContent = 'Failed to load: ' + e.message;
  }
}

async function refreshInBackground() {
  try {
    const res = await fetch(MANIFEST + '?t=' + Date.now());
    const all = await res.json();
    if (!all.length) return;
    const known = new Set(frames.map(f => f.url));
    const novel = all.filter(f => !known.has(f.url));
    if (!novel.length) return;
    const checked = await Promise.all(novel.map(fr => new Promise(resolve => {
      const im = new Image();
      im.onload  = () => { cache[fr.url] = im; resolve(fr); };
      im.onerror = () => resolve(null);
      im.src = fr.url;
    })));
    const valid = checked.filter(Boolean);
    if (!valid.length) return;
    const merged = [...frames, ...valid].slice(-24);
    idx = Math.min(idx + (merged.length - frames.length), merged.length - 1);
    frames = merged;
    updateTimeLabels();
  } catch (_) {}
}

function renderFrame(i) {
  const fr = frames[i];
  img.src = fr.url;
  document.getElementById('big-timestamp').textContent = fmtWindow(fr.time);
  const pct = frames.length > 1 ? i / (frames.length - 1) * 100 : 100;
  document.getElementById('progress-fill').style.width = pct + '%';
}

function tick() {
  if (!frames.length) return;
  if (idx >= frames.length - 1) {
    if (++dwellCount < DWELL_FRAMES) return;
    dwellCount = 0; idx = 0;
  } else {
    idx++;
  }
  renderFrame(idx);
}

function startLoop() { clearInterval(tickTimer); tickTimer = setInterval(tick, 1000 / fps); }
function stopLoop()  { clearInterval(tickTimer); tickTimer = null; }

function togglePlay() {
  playing = !playing;
  document.getElementById('play-btn').textContent = playing ? '⏸' : '▶';
  playing ? startLoop() : stopLoop();
}

function stepFrame(d) {
  idx = Math.max(0, Math.min(frames.length - 1, idx + d));
  dwellCount = 0;
  renderFrame(idx);
}

function setSpeed(v) { fps = parseFloat(v); if (playing) startLoop(); }

function scrubClick(e) {
  const r = e.currentTarget.getBoundingClientRect();
  const frac = (e.clientX - r.left) / r.width;
  idx = Math.max(0, Math.min(frames.length - 1, Math.round(frac * (frames.length - 1))));
  dwellCount = 0;
  renderFrame(idx);
}

loadManifest();
startLoop();
</script>
</body>
</html>
